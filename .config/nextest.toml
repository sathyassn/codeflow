# Windows uses the same membership and writes its raw referee report here.
# Nextest keeps reports in the workspace Cargo target directory, while
# instrumented binaries live below CARGO_LLVM_COV_TARGET_DIR.
[test-groups.serial]
max-threads = 1

[profile.codeflow]
fail-fast = false

[profile.codeflow.junit]
path = "junit.xml"

[[profile.codeflow.overrides]]
filter = 'package(codeflow-present) | binary(present_cli) | binary(init_e2e) | test(process_group) | binary(test_gate_cli)'
test-group = "serial"

# Essential uses the full gate's isolation and serial group without coverage.
# Keep its overrides equal to profile.codeflow; doctests run after nextest.
[profile.essential]
fail-fast = false
# Eight workers: existing essential default on the 10-core reference host; not re-measured (AC-4 amendment).
test-threads = 8

[profile.essential.junit]
path = "junit.xml"

[[profile.essential.overrides]]
filter = 'package(codeflow-present) | binary(present_cli) | binary(init_e2e) | test(process_group) | binary(test_gate_cli)'
test-group = "serial"
