# Windows uses the same membership and writes its raw referee report here.
# Nextest keeps reports in the workspace Cargo target directory, while
# instrumented binaries live below CARGO_LLVM_COV_TARGET_DIR.
[test-groups.serial]
max-threads = 1

[profile.codeflow]
fail-fast = false

[profile.codeflow.junit]
path = "junit.xml"

[[profile.codeflow.overrides]]
filter = 'package(codeflow-present) | binary(present_cli) | binary(init_e2e) | test(process_group) | binary(test_gate_cli)'
test-group = "serial"

# Essential uses the full gate's isolation and serial group without coverage.
# Keep its overrides equal to profile.codeflow; doctests run after nextest.
[profile.essential]
fail-fast = false
# The gate supplies NEXTEST_TEST_THREADS from execution.worker_budget.

[profile.essential.junit]
path = "junit.xml"

[[profile.essential.overrides]]
filter = 'package(codeflow-present) | binary(present_cli) | binary(init_e2e) | test(process_group) | binary(test_gate_cli)'
test-group = "serial"

# The hosted Windows test partitions run under this profile (TSK-1321). A test
# still running after 6 periods of 120 s (12 minutes) is ended and reported as
# a timeout, so one hung test cannot use up its partition's job time and lose
# the partition's other results. The bound is at least twice the longest
# measured hosted Windows test (323 s). The bound stays out of profile.codeflow, which
# the local full gate uses: a slow test on a loaded host must keep running
# there while it is active (TSK-1278). Keep the overrides equal to
# profile.codeflow, written out because nextest 0.9.129's `inherits` does not
# carry them over.
[profile.windows-hosted]
fail-fast = false
slow-timeout = { period = "120s", terminate-after = 6 }

[profile.windows-hosted.junit]
path = "junit.xml"

[[profile.windows-hosted.overrides]]
filter = 'package(codeflow-present) | binary(present_cli) | binary(init_e2e) | test(process_group) | binary(test_gate_cli)'
test-group = "serial"
