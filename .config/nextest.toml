# Windows uses the same membership and writes its raw referee report here.
# Nextest keeps reports in the workspace Cargo target directory, while
# instrumented binaries live below CARGO_LLVM_COV_TARGET_DIR.
[test-groups.serial]
max-threads = 1

[profile.codeflow]
fail-fast = false

[profile.codeflow.junit]
path = "junit.xml"

[[profile.codeflow.overrides]]
filter = 'package(codeflow-present) | binary(present_cli) | binary(init_e2e) | test(process_group) | binary(test_gate_cli)'
test-group = "serial"

# Essential uses the full gate's isolation and serial group without coverage.
# Keep its overrides equal to profile.codeflow; doctests run after nextest.
# The full gate (profile.codeflow) runs every test. Essential leaves out the
# exhaustive matrices below and the one test that waits a real minute
# (TSK-356); each keeps a representative of the same boundary in essential:
# - tier and preset matrices: a one-tier test beside each;
# - the harness wiring matrix: codex_hooks runs every fixed form through an
#   installed wiring, the exec-guard unit tests judge them all, and
#   headless_peer_runs_block_in_every_harness_wiring_at_every_tier crosses
#   every tier and wiring;
# - crash-point matrices: the cut points around the payload on each drive
#   layout;
# - random-input guard matrices: the fixed guard counterexamples;
# - the real slow push: clears_push_over_budget_builtin.
[profile.essential]
default-filter = '''not (
    (binary(tier_floor_e2e) & test(=init_writes_the_compaction_default_at_every_tier_and_preset))
    | (binary(tier_floor_e2e) & test(=every_harness_wiring_judges_composed_deletions_and_help_at_every_tier))
    | (binary(init_e2e) & test(=split_references_install_and_update_replaces_whole_files_at_standard_and_full))
    | (binary(init_e2e) & test(=init_and_update_bring_the_plain_writing_rule_at_every_tier))
    | (package(codeflow-core) & kind(lib) & test(=scaffold::state::tests::an_update_after_a_crash_at_any_point_installs_the_new_version))
    | (package(codeflow-core) & kind(lib) & test(=scaffold::state::tests::a_crash_with_the_file_on_another_drive_still_installs_the_new_version))
    | (package(codeflow-core) & kind(lib) & test(=hooks::git_guard::tests::test_random_shell_patterns_never_match_less_than_bash))
    | (package(codeflow-core) & kind(lib) & test(=hooks::git_guard::tests::test_random_words_are_refused_whenever_bash_reaches_an_enforcement_file))
    | (package(codeflow-core) & kind(lib) & test(=hooks::git_guard::tests::test_random_words_are_refused_whenever_zsh_reaches_an_enforcement_file))
    | (binary(remedy_clearing) & test(=push::push_budget_is_reported_after_a_real_slow_step))
)'''
fail-fast = false
# The gate supplies NEXTEST_TEST_THREADS from execution.worker_budget.

[profile.essential.junit]
path = "junit.xml"

[[profile.essential.overrides]]
filter = 'package(codeflow-present) | binary(present_cli) | binary(init_e2e) | test(process_group) | binary(test_gate_cli)'
test-group = "serial"
