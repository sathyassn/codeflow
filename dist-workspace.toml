[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# Release publication is explicitly dispatched on main. Pull-request artifact
# planning remains enabled.
dispatch-releases = true
# Pull requests exercise the generated plan only. Cross-platform publication
# builds remain release-checklist evidence, not a costly implicit PR promise.
pr-run-mode = "plan"
# The local job proves deliberate current-main authority before packaging. The
# supported global job rechecks main after platform builds. cargo-dist 0.32
# gates hosting on both jobs' success or intentional skip.
local-artifacts-jobs = ["./release-plan-authority"]
global-artifacts-jobs = ["./release-main-recheck"]
post-announce-jobs = ["./release-post-announce"]
# CodeFlow has no external package publisher. Deferring GitHub hosting to the
# announce phase keeps the tag/release as cargo-dist's final operation.
github-release = "announce"
# The authority plan creates the empty draft after its exact-source checks.
# cargo-dist uploads every artifact to that draft and alone makes it public.
create-release = false
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false

[dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803"
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"

[dist.github-custom-job-permissions.release-plan-authority]
actions = "read"
contents = "write"
pull-requests = "read"
checks = "read"

[dist.github-custom-job-permissions.release-main-recheck]
actions = "read"
contents = "write"
checks = "read"
