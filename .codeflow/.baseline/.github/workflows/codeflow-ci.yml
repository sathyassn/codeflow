# codeflow CI — the perimeter. Re-runs every gate that matters so nothing
# depends on local state. Written by `codeflow init` and managed by `codeflow
# update` (charter §4.3): an unmodified copy is replaced on update; your edits
# are preserved via 3-way merge, never clobbered.
#
# IMPORTANT: the "Install codeflow" step below is a PLACEHOLDER. Until you
# replace it with the release installer (or a from-source build), the codeflow
# `test`/`validate` gates FAIL RED by design — a missing binary is an unarmed
# perimeter, not a pass. This is a loud, honest signal that the gate is not yet
# enforcing; wire the install step to turn it green. Do NOT "fix" the red by
# making a missing binary skip — that hands branch protection a job that ran
# nothing. The secret-scan and security-review jobs work out of the box
# (external pinned tools); the commit-standards job now runs the same
# `codeflow ci` binary as the gates, so it shares the Install-codeflow step and
# fails RED until that step is wired (CodeFlow ADR-0017 — one source of truth,
# no drift).
name: codeflow-ci

on:
  # `edited` reruns the checks when the PR body changes after it opens, so an
  # edited body is linted again (a bare `pull_request:` would skip edits).
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  gates:
    name: codeflow gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install codeflow
        run: |
          # PLACEHOLDER: replace with the release installer once published, e.g.
          #   curl -fsSL https://github.com/sathyassn/codeflow/releases/latest/download/codeflow-cli-installer.sh | sh
          # The installer honours CARGO_HOME (dist-workspace.toml sets
          # install-path = "CARGO_HOME"), so resolve the bin dir through it and
          # fall back to the default only when CARGO_HOME is unset.
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
          echo "::error::codeflow install step is an unwired PLACEHOLDER — the test/validate gates below fail RED until you replace this with the real installer. The perimeter is intentionally not armed."

      - name: codeflow test
        run: |
          if command -v codeflow >/dev/null 2>&1; then
            codeflow test --strict
          else
            echo "::error::codeflow not installed — test gate cannot run. The perimeter is not armed; failing red. Wire the Install codeflow step above."
            exit 1
          fi

      - name: codeflow validate --docs
        run: |
          if command -v codeflow >/dev/null 2>&1; then
            codeflow validate --docs
          else
            echo "::error::codeflow not installed — validate gate cannot run. The perimeter is not armed; failing red. Wire the Install codeflow step above."
            exit 1
          fi

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Run the gitleaks binary directly (pinned) rather than the
      # gitleaks-action wrapper, which requires a GitHub token/license.
      - name: gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" -o "$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$archive" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

  security-review:
    name: security review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Dependency / supply-chain audit — the deterministic floor the
      # cf-security-reviewer red-team layers on (CodeFlow ADR-0016; OWASP
      # A03:2025). Pinned
      # osv-scanner is stack-agnostic: it reads every lockfile ecosystem
      # (Cargo.lock, package-lock.json, requirements.txt, go.mod, …), so this one
      # job is the universal floor. Add stack-specific scanners (cargo audit,
      # pip-audit, govulncheck) and a SAST pass (semgrep --config auto) as your
      # stack warrants.
      #
      # Enforcement reads two .codeflow/policy.json keys: `git.security_review` is
      # the umbrella gate for the whole security-review job; `git.dep_audit` is the
      # SCA-specific sub-gate for this osv-scanner step. The advisory blocks when
      # EITHER is `block`, reports when either is `warn`, and the step is skipped
      # only when BOTH are `off`:
      #   block — an advisory (or scan error) fails the job (the hard CI gate);
      #   warn  — reported, not failed (the shipped default);
      #   off   — skipped (only when both keys are off).
      # Record a justified suppression for an accepted or unreachable advisory in
      # an .osv-scanner.toml allowlist (auto-discovered), so a transitive advisory
      # in unchanged code cannot block an unrelated PR.
      - name: dependency audit (osv-scanner)
        run: |
          set -u
          sr=$(jq -r '.git.security_review // "warn"' .codeflow/policy.json 2>/dev/null || echo warn)
          da=$(jq -r '.git.dep_audit // "warn"' .codeflow/policy.json 2>/dev/null || echo warn)
          if [ "$sr" = "block" ] || [ "$da" = "block" ]; then
            level=block
          elif [ "$sr" = "off" ] && [ "$da" = "off" ]; then
            echo "security_review=off and dep_audit=off — skipping."; exit 0
          else
            level=warn
          fi

          OSV_VERSION=2.4.0
          OSV_SHA256=15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" -o osv-scanner
          printf '%s  %s\n' "$OSV_SHA256" osv-scanner | sha256sum -c -
          chmod +x osv-scanner

          set +e
          out=$(./osv-scanner scan -r . 2>&1); rc=$?
          set -e
          printf '%s\n' "$out"

          if [ "$rc" -eq 0 ]; then
            echo "No known advisories."
          elif printf '%s' "$out" | grep -qiE 'no package sources found|no packages found|no lockfiles'; then
            echo "No scannable manifests found — nothing to audit."
          elif [ "$level" = "block" ]; then
            echo "::error::dependency advisories found (or scan error, exit ${rc}) and policy git.security_review=${sr} / git.dep_audit=${da} (either is block) — failing. Triage, or record a justified suppression in .osv-scanner.toml."
            exit 1
          else
            echo "::warning::dependency advisories found (or scan error, exit ${rc}); policy git.security_review=${sr} / git.dep_audit=${da} → reporting only. Harden either to block once triaged."
          fi

  commit-lint:
    name: commit standards
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install codeflow
        run: |
          # PLACEHOLDER: replace with the release installer once published, e.g.
          #   curl -fsSL https://github.com/sathyassn/codeflow/releases/latest/download/codeflow-cli-installer.sh | sh
          # The installer honours CARGO_HOME (dist-workspace.toml sets
          # install-path = "CARGO_HOME"), so resolve the bin dir through it and
          # fall back to the default only when CARGO_HOME is unset.
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
          echo "::error::codeflow install step is an unwired PLACEHOLDER — the commit-standards gate below fails RED until you replace this with the real installer. The perimeter is intentionally not armed."

      # One source of truth: `codeflow ci` runs the SAME commit-format,
      # no-AI-attribution, no-emoji, breaking-footer, and branch-naming checks as
      # the git-client hooks and the Claude git-guard, reading .codeflow/policy.json
      # for the level of each (block/warn/off), plus the PR-body structure check
      # (git.pr_sections: required sections present and non-empty, test evidence
      # when the range touches code). No inline regex to drift
      # (CodeFlow ADR-0017).
      # The PR body is passed via CODEFLOW_PR_BODY in `env:` (not interpolated into
      # the script), so an untrusted body cannot inject shell.
      - name: codeflow ci (commit + branch + PR-body standards)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          CODEFLOW_PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if command -v codeflow >/dev/null 2>&1; then
            codeflow ci --base "$BASE_SHA" --head "$HEAD_SHA" --branch "$HEAD_REF"
          else
            echo "::error::codeflow not installed — commit-standards gate cannot run. The perimeter is not armed; failing red. Wire the Install codeflow step above."
            exit 1
          fi
