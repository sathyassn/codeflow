# Minimal Autonomous Batch
# =========================
# Three independent tasks running concurrently. No integration_branch or
# integration_auto_merge specified — the system provides autonomous defaults.
#
# Autonomous defaults:
#   integration_branch: auto-generated as autorun/{batch-name}-{session-suffix} off main
#   integration_auto_merge: inferred from integration_branch — integration branches
#               auto-merge after CI passes; protected branches (main, master,
#               release/*, production) are forbidden with integration_auto_merge.
#   final_pr:   true — resolve_target() sets final_pr for auto-generated targets.
#               Set final_pr: false explicitly to skip the summary PR from
#               the integration branch to main after all workers complete.
#
# This is the recommended pattern for most autorun batches. Omitting
# integration_branch and integration_auto_merge keeps the batch file minimal
# and lets the system apply the correct behavior based on the deployment context.
#
# File scope must NOT overlap between concurrent tasks. The Loro CRDT
# claim system enforces this at runtime: if two workers try to claim
# the same file, the second is blocked (scope_policy=soft) or rejected
# (scope_policy=hard). Use validate_batch_extended() overlap detection
# at parse time to catch overlaps before workers start.
#
# Usage:
#   codeflow autorun run --batch .codeflow/config/autorun/examples/minimal-autonomous.yaml
#
# Task Requirements:
#   Each task ID must have a corresponding markdown file at:
#     project-management/epics/{AREA}/{AREA}-EPC-{NNN}/tasks/{task-id}.md
#   The task markdown MUST contain frontmatter with:
#     autorun_eligible: true       — marks task as safe for autonomous execution
#     acceptance: [list]           — at least one acceptance criterion
#     file_scope: [list]           — file paths this task may modify (non-overlapping)
#     scope_policy: soft or hard   — NOT permissive (forbidden for autorun)

name: minimal-autonomous
max_workers: 3
tasks:
  - id: AREA-TSK-NNN-001
  - id: AREA-TSK-NNN-002
  - id: AREA-TSK-NNN-003
