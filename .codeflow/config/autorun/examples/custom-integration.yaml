# Custom Integration Branch Batch
# ==================================
# Tasks targeting an explicit custom integration branch. Worker PRs
# auto-merge to the integration branch after CI passes via the CRDT
# merge queue (serialized FIFO merges). After all workers complete,
# a final summary PR is created from the integration branch to main.
#
# Use this pattern when you need a named, persistent integration branch
# rather than the auto-generated autorun/{batch-name}-{session-suffix}.
#
# Integration branch convention:
#   main
#     └── autorun/sprint-42           ← custom integration branch (pre-created off main)
#           ├── feat/task-001         ← worker branch (created off integration)
#           └── feat/task-002         ← worker branch (created off integration)
#
# final_pr behavior:
#   When integration_branch is an explicit non-main branch, final_pr is inferred true.
#   Setting it explicitly (as below) is recommended for clarity.
#   After all workers merge to autorun/sprint-42, the orchestrator creates
#   a single PR from autorun/sprint-42 to main for human review.
#
# final_pr_target:
#   Defaults to "main" when omitted. Set explicitly for teams using a
#   develop → main workflow (e.g. final_pr_target: develop).
#   Must differ from integration_branch.
#
# Protected branch restriction:
#   integration_auto_merge: true REQUIRES integration_branch to be a non-protected branch.
#   Protected branches (main, master, release/*, production) are FORBIDDEN
#   with integration_auto_merge — validation rejects at batch parse time.
#
# Merge queue:
#   Worker PRs are serialized through the Loro CRDT merge queue (FIFO).
#   Each worker enqueues before merge and dequeues after, preventing
#   concurrent merges that could cause conflicts.
#
# Usage:
#   codeflow autorun run --batch .codeflow/config/autorun/examples/custom-integration.yaml
#
# Task Requirements:
#   Each task ID must have a corresponding markdown file at:
#     project-management/epics/{AREA}/{AREA}-EPC-{NNN}/tasks/{task-id}.md
#   The task markdown MUST contain frontmatter with:
#     autorun_eligible: true       — marks task as safe for autonomous execution
#     acceptance: [list]           — at least one acceptance criterion
#     file_scope: [list]           — file paths this task may modify
#     scope_policy: soft or hard   — NOT permissive (forbidden for autorun)

name: sprint-42
max_workers: 3
integration_branch: autorun/sprint-42
integration_auto_merge: true
final_pr: true          # inferred true when integration_branch is explicit non-main; set explicitly for clarity
final_pr_target: main     # optional (main is the default)
tasks:
  - id: FRT-TSK-001-001
  - id: FRT-TSK-001-002
