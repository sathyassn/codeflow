# Complex Dependencies Batch
# ===========================
# Diamond dependency DAG with batch-level scope overrides.
#
# Dependency graph:
#   AREA-TSK-NNN-001 ──┐
#                       ├──> AREA-TSK-NNN-003 ──> AREA-TSK-NNN-004
#   AREA-TSK-NNN-002 ──┘
#
# Tasks 001 and 002 run in parallel (no dependency between them).
# Task 003 waits for both 001 and 002 to complete.
# Task 004 waits for 003.
#
# Scope policy overrides:
#   The batch file can TIGHTEN (but not loosen) scope_policy per task.
#   If the task markdown says "soft", the batch can override to "hard"
#   for stricter enforcement in this particular run. The batch cannot
#   override to "permissive" — that is forbidden for autorun tasks.
#
# Batch sizing:
#   max_workers controls how many tasks run concurrently. With
#   max_workers: 2 and the diamond DAG above, execution proceeds:
#     Round 1: 001 + 002 (parallel, 2 workers)
#     Round 2: 003 (1 worker, waits for both deps)
#     Round 3: 004 (1 worker, waits for 003)
#
# Autonomous defaults apply: target branch is auto-generated as
# autorun/{batch-name}-{session-suffix} off main. auto_merge is inferred
# from target — protected branches (main, master, release/*, production)
# cannot auto-merge; integration branches can.
#
# Usage:
#   codeflow autorun run --batch .codeflow/config/autorun/examples/complex-dependencies.yaml
#
# Task Requirements:
#   Each task ID must have a corresponding markdown file at:
#     project-management/epics/{AREA}/{AREA}-EPC-{NNN}/tasks/{task-id}.md
#   The task markdown MUST contain frontmatter with:
#     autorun_eligible: true       — marks task as safe for autonomous execution
#     acceptance: [list]           — at least one acceptance criterion
#     file_scope: [list]           — file paths this task may modify
#     scope_policy: soft or hard   — NOT permissive (forbidden for autorun)

name: complex-deps
max_workers: 2
tasks:
  - id: AREA-TSK-NNN-001
  - id: AREA-TSK-NNN-002
  - id: AREA-TSK-NNN-003
    depends_on:
      - AREA-TSK-NNN-001
      - AREA-TSK-NNN-002
  - id: AREA-TSK-NNN-004
    depends_on:
      - AREA-TSK-NNN-003
    scope_policy: hard
