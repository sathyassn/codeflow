# Direct-to-Main Batch
# =====================
# Tasks that create worker branches off main and target main directly
# with PRs. This is the backward-compatible pattern for teams that
# review individual worker PRs rather than a summary integration PR.
#
# Because main is a protected branch, integration_auto_merge is forbidden and PRs
# must be merged by a human via the GitHub UI.
#
# final_pr behavior:
#   When integration_branch is "main", final_pr is inferred false. There is no
#   integration branch to PR from — each worker PR targets main directly.
#   Setting final_pr: true with integration_branch: main is a validation error.
#
# Workflow:
#   main
#     ├── feat/task-001             ← worker branch off main
#     └── feat/task-002             ← worker branch off main
#
#   Each worker PR targets main directly for human review.
#
# When to use this pattern:
#   - Small batches (1-3 tasks) with reviewable-sized PRs
#   - Teams with required PR review policies on main
#   - Tasks that are logically independent enough for standalone review
#
# When NOT to use:
#   - Large batches (4+ tasks) — prefer the default integration branch
#     pattern to consolidate review into a single summary PR
#   - Interdependent tasks — integration branch ordering is safer
#
# Usage:
#   codeflow autorun run --batch .codeflow/config/autorun/examples/direct-to-main.yaml
#
# Task Requirements:
#   Each task ID must have a corresponding markdown file at:
#     project-management/epics/{AREA}/{AREA}-EPC-{NNN}/tasks/{task-id}.md
#   The task markdown MUST contain frontmatter with:
#     autorun_eligible: true       — marks task as safe for autonomous execution
#     acceptance: [list]           — at least one acceptance criterion
#     file_scope: [list]           — file paths this task may modify
#     scope_policy: soft or hard   — NOT permissive (forbidden for autorun)

name: direct-to-main
max_workers: 2
integration_branch: main
tasks:
  - id: AREA-TSK-NNN-001
  - id: AREA-TSK-NNN-002
