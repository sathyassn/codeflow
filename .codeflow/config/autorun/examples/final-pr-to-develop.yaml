# Final PR to Develop Branch
# ===========================
# Tasks targeting an explicit integration branch, with the final summary
# PR targeting a develop branch instead of main. Use this pattern for
# teams that use a develop → main workflow (GitFlow or similar).
#
# Workflow:
#   develop
#     └── autorun/sprint-43           ← integration branch (off develop)
#           ├── feat/task-001         ← worker branch (off integration)
#           └── feat/task-002         ← worker branch (off integration)
#
#   1. Workers run and merge PRs to autorun/sprint-43 (auto-merge after CI)
#   2. Orchestrator creates a final PR from autorun/sprint-43 to develop
#   3. Human reviews and merges the final PR to develop
#   4. Develop is later merged to main via normal release process
#
# final_pr_target:
#   Set to "develop" to target the develop branch instead of main.
#   Must differ from integration_branch (you cannot PR from a branch to itself).
#   Defaults to "main" when omitted.
#
# final_pr behavior:
#   When integration_branch is an explicit non-main branch, final_pr is inferred true.
#   Setting it explicitly (as below) is recommended for clarity.
#
# integration_auto_merge:
#   Inferred true for non-protected targets (autorun/* branches).
#   Worker PRs auto-merge to the integration branch via the CRDT merge
#   queue. The final PR to develop requires human review.
#
# Usage:
#   codeflow autorun run --batch .codeflow/config/autorun/examples/final-pr-to-develop.yaml
#
# Task Requirements:
#   Each task ID must have a corresponding markdown file at:
#     project-management/epics/{AREA}/{AREA}-EPC-{NNN}/tasks/{task-id}.md
#   The task markdown MUST contain frontmatter with:
#     autorun_eligible: true       — marks task as safe for autonomous execution
#     acceptance: [list]           — at least one acceptance criterion
#     file_scope: [list]           — file paths this task may modify
#     scope_policy: soft or hard   — NOT permissive (forbidden for autorun)

name: sprint-43
max_workers: 3
integration_branch: autorun/sprint-43
integration_auto_merge: true
final_pr: true
final_pr_target: develop   # PR from autorun/sprint-43 → develop (not main)
tasks:
  - id: AREA-TSK-NNN-001
  - id: AREA-TSK-NNN-002
  - id: AREA-TSK-NNN-003
