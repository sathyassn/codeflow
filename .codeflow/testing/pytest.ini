[pytest]
# CodeFlow Test Configuration

# Test paths
testpaths = scripts/db scripts/memory scripts/coordination scripts/codeflow_py_lib scripts/shell-lib

# Python path for imports
pythonpath = ../scripts ../scripts/db/lib

# Test file patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output settings
# Note: Coverage flags are in run-coverage.sh to avoid conflicts with ad-hoc pytest runs
addopts = -v --tb=short --strict-markers -ra

# Markers
markers =
    critical: Security-critical tests
    high: Workflow enforcement tests
    medium: Guidance tests
    low: Cleanup tests
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may touch filesystem/db)
    db: Tests requiring database
    memory: Memory script tests
    coordination: Coordination script tests
    crdt: CRDT-related tests

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s

# Timeout (requires pytest-timeout)
timeout = 60
