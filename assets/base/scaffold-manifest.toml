dest = "AGENTS.md"
ownership = "managed-region"
region = "markdown"
tiers = ["minimal"]
template = true

[[entry]]
src = "CLAUDE.md.tmpl"
dest = "CLAUDE.md"
ownership = "managed-region"
region = "markdown"
tiers = ["standard", "full"]
template = true

[[entry]]
