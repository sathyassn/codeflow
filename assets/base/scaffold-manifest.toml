dest = ".claude/skills/cf-method/SKILL.md"
ownership = "managed"
tiers = ["standard", "full"]

[[entry]]
src = "claude/skills/cf-delegate/SKILL.md"
dest = ".claude/skills/cf-delegate/SKILL.md"
ownership = "managed"
tiers = ["standard", "full"]

# The five workflow commands are now SKILL.md skills. Claude Code merged custom
# commands into skills (v2.1.101, 2026-04-11): `.claude/skills/<name>/SKILL.md`
# creates `/<name>` just like the old `.claude/commands/<name>.md` did. Keeping
# both would conflict on the same slash name, so codeflow ships skills only.
# Each is auto-loaded by Claude when the conversation matches its description and
# is still explicitly invocable with `/<name>`. They install to .claude/skills
# (Claude) and .agents/skills (Codex).

[[entry]]
src = "agents/skills/cf-plan/SKILL.md"
dest = ".claude/skills/cf-plan/SKILL.md"
ownership = "managed"
tiers = ["standard", "full"]

[[entry]]
src = "agents/skills/cf-develop/SKILL.md"
dest = ".claude/skills/cf-develop/SKILL.md"
ownership = "managed"
tiers = ["standard", "full"]

[[entry]]
