ownership = "managed"
tiers = ["standard", "full"]

[[entry]]
src = "agents/skills/cf-consult/SKILL.md"
dest = ".claude/skills/cf-consult/SKILL.md"
ownership = "managed"
tiers = ["standard", "full"]

# cf-model-orchestrator ships its SKILL.md plus a resources/ file (the app-server
# driver) — the first skill with a resource, so each resource needs its own entry.
[[entry]]
src = "agents/skills/cf-model-orchestrator/SKILL.md"
dest = ".claude/skills/cf-model-orchestrator/SKILL.md"
ownership = "managed"
tiers = ["standard", "full"]

[[entry]]
