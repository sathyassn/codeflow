# --- Claude settings presets (exactly one applies, chosen at init) -----------
# Part of the enforcement floor (CodeFlow ADR-0019): .claude/settings.json wires the
# in-session git-guard/exec-guard PreToolUse hooks and the orient/summary session
# hooks, so it ships from --minimal up. The three presets stay disjoint-selected
# by the permission preset chosen at init; only one lands.

[[entry]]
src = "settings/default.json"
dest = ".claude/settings.json"
ownership = "managed-region"
region = "json"
tiers = ["minimal", "standard", "full"]
preset = "default"

[[entry]]
src = "settings/acceptEdits.json"
dest = ".claude/settings.json"
ownership = "managed-region"
region = "json"
tiers = ["minimal", "standard", "full"]
preset = "acceptEdits"

[[entry]]
src = "settings/bypass-sandboxed.json"
dest = ".claude/settings.json"
ownership = "managed-region"
region = "json"
tiers = ["minimal", "standard", "full"]
preset = "bypassPermissions"

# --- Codex starter (harness parity, CodeFlow ADR-0008) ------------------------
# The same `codeflow hook git-guard` / `codeflow hook exec-guard` binaries bind
# Codex via .codex/hooks.json (byte-compatible PreToolUse payload); config.toml
# enables the hooks engine and sets workspace autonomy. One-time trust via
# `/hooks` inside codex. Fully managed: codeflow owns the harness wiring, with
# the standard 3-way merge if a user edits their copy.

[[entry]]
src = "codex/hooks.json"
dest = ".codex/hooks.json"
ownership = "managed"
tiers = ["minimal", "standard", "full"]

# Grok Build reads `.grok/hooks/*.json` (and may also scan Claude settings).
# Same PreToolUse git-guard/exec-guard binaries as Codex. Grok's session,
# compaction and prompt events exist but their output never reaches the
# model, so no advisory hook is wired here (TSK-128).
# Project hooks need `/hooks-trust` or `--trust` once.
[[entry]]
src = "grok/hooks.json"
dest = ".grok/hooks/codeflow.json"
ownership = "managed"
tiers = ["minimal", "standard", "full"]

[[entry]]
src = "codex/config.toml"
dest = ".codex/config.toml"
ownership = "managed"
tiers = ["minimal", "standard", "full"]

