# Codex config for a CodeFlow-managed repo (harness parity — ADR-0008).
#
# The same `codeflow hook git-guard` / `codeflow hook exec-guard` binaries that
# bind a Claude session bind an INTERACTIVE Codex session here, via
# `.codex/hooks.json`; their payload contract is byte-compatible, so the
# in-session PreToolUse protection matches Claude's — for interactive Codex.
# Headless `codex exec` (0.142.5) does NOT fire project PreToolUse hooks at all,
# so these in-session guards are inactive there. Codex-driven work is instead
# bound unconditionally by the git-client hook plane plus CI (the authoritative
# perimeter), exactly as any other harness — that is the real boundary headless.
#
# ONE-TIME TRUST: an interactive Codex session must trust a hook source before it
# runs — run `/hooks` inside `codex` once and approve the CodeFlow hooks. The
# `--dangerously-bypass-hook-trust` flag only skips that trust prompt for an
# interactive session (in an environment that already vets the source — here,
# this repo's own committed config); it does NOT make headless `codex exec` run
# the hooks (nothing does), so headless CI relies on the git-hook plane + CI.

# Workspace autonomy (owner posture): project-scoped work runs promptless.
# `workspace-write` lets Codex edit the repo without approval; `on-request`
# means it only asks when it needs to escalate BEYOND the workspace sandbox —
# exactly where a human decision belongs. Tighten (`read-only` / `untrusted`)
# or loosen (`never` for fully headless) per repo.
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[features]
# Enable the hooks engine (declared defensively; recent Codex enables it, but
# an explicit value survives a default flip).
hooks = true
