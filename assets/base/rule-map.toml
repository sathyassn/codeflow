action = "one PR per task: code, tests, docs, criteria changes (a reason per removal), the acceptance completion last; update the truth it makes stale; checks follow effects, never labels; `Task: TSK-NNN` (the epic for the breakdown PR and the PR to main); the PR stays draft until its required evidence exists"
see = [
