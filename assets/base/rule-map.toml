key = "session"
group = "delivery"
when = "start a session, or resume after compaction or a break"
action = "`codeflow orient` (the hook runs it where wired); re-read this block; state lives in its durable home, not chat"
see = [{ target = ".codeflow/rules/workflow-discipline.md", section = "Sessions and state" }]

