[[moment]]
key = "failure"
group = "situation"
when = "hit a failure, a red check, a blocker or a cancellation"
action = "classify it; reproduce, then one bounded probe on a new hypothesis, never the same retry; an unfinished CI job is missing evidence; escalate only an external dependency or operator choice"
see = [{ target = ".codeflow/rules/workflow-discipline.md", section = "Navigate blockers" }]

[[moment]]
key = "refusal"
group = "situation"
when = "see a guard, hook or CI refuse a command"
action = "the message names the rule and the sanctioned path; fix the cause; never `--no-verify`, a hook edit or an override env"
see = [{ target = ".codeflow/rules/git-rules.md", section = "Enforcement" }]

[[moment]]
key = "secret"
group = "situation"
when = "touch a secret, a protected branch or an irreversible action"
action = "never stage credentials, keys, tokens or `.env`; never commit, merge, push, force-push, delete or hard-reset on `main` or `master`; an irreversible step waits for human approval"
see = [
  { target = ".codeflow/rules/git-rules.md", section = "Protected branches" },
  { target = ".codeflow/rules/workflow-discipline.md", section = "Match the gate", note = "before acting", must_open = true, reason = "scope, recovery, approval" },
]

