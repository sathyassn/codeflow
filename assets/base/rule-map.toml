group = "delivery"
tiers = ["standard"]
when = "open the PR"
action = "one PR per unit: code, tests, docs, criteria changes (a reason per removal); update the truth it makes stale; checks follow effects, never labels; the `Task:` line names the tracked unit; the PR stays draft until its required evidence exists"
see = [
  { target = "cf-ship", note = "steps 2 to 4", must_open = true, reason = "truth updates and release impact" },
