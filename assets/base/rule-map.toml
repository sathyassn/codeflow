# The one kernel source of the root instruction files (TSK-127).
#
# `codeflow_core::scaffold::rule_map` renders every tier's AGENTS.md and
# CLAUDE.md template from this file: AGENTS.minimal.md.tmpl,
# AGENTS.md.tmpl (standard), AGENTS.full.md.tmpl and the two CLAUDE
# templates. The rendered templates are checked in and a test fails when one
# drifts from this file; regenerate them with
# `CODEFLOW_BLESS=1 cargo test -p codeflow-core --test rule_map_contract`.
# This file is not installed into projects.
#
# Blocks render in order. `tiers` defaults to every tier. A block of
# `kind = "rules"` or `kind = "moments"` renders the rules or the moment
# table for that tier. A `see` entry is a pointer: `cf-*` names a skill or
# agent installed at that tier, anything else a project-relative path.
# Every pointer must resolve in a fresh scaffold of the tier that renders it.

schema_version = 1

[[agents]]
text = """
# {{PROJECT_NAME}}: agent operating contract

{{PROJECT_ONE_LINER}}

- **Stack:** {{STACK}}
- **Areas:** {{AREAS}}
- **Tier:** {{TIER}}

This file is the canonical instruction set for any agent or human working in
this repo. The block between the codeflow markers below is maintained by
`codeflow update`; everything outside it is project-owned, so extend it freely.

<!-- codeflow:managed:begin scaffold={{SCAFFOLD_VERSION}} -->
<!-- Owned by `codeflow update`. Edits inside this block are replaced on update;
     put project-specific instructions outside the markers. -->

## How to use this map

This block is a map. Each always rule is one line with a pointer to its full
text, and the table below names the rule and the reference for the moment you
are about to act. Rules marked [enforced] are also checked by hooks, guards
or CI, and a refusal names its rule. Precedence: the operator's instruction,
then the nearest AGENTS.md, then a parent one, then skill defaults; safety
floors and enforced rules hold under all of them. After compaction or resume,
re-read this block before acting.
"""

[[agents]]
tiers = ["minimal"]
text = """
## What this tier installs

This is codeflow's **minimal** tier: the complete git-discipline enforcement
floor plus working principles. It installs no method: no skills, reviewer
agents, knowledge docs or work records, so this map points only at files
installed here. `codeflow init --standard` is an additive upgrade that adds
the method and rewrites this block; do it when the repo is a code project
that has earned the weight, not a doc-set or a small tool.
"""

[[agents]]
kind = "rules"
text = "## Always rules"

[[agents]]
kind = "moments"
text = "## When you are about to"

[[agents]]
tiers = ["standard", "full"]
text = """
**Other skills:** `/cf-stack` sets up the stack and test config,
`/cf-customize` tailors a scaffolded project, `/cf-docs-portal` runs the
opt-in repository guide, and `/cf-herdr` hosts a peer terminal when
`HERDR_ENV=1`.
"""

[[agents]]
tiers = ["standard"]
text = """
**Mechanics:** `codeflow orient`, `status`, `test`, `validate [--docs]`,
`doctor`, `recall "<query>"`, `integrate <branch>`, `present`, `portal`,
`remote`; `codeflow --help` lists the rest. Durable work records need the full
tier.
"""

[[agents]]
tiers = ["full"]
text = """
**Mechanics:** `codeflow orient`, `status`, `work next`, `work claim <id>`,
`work start <id>`, `task new`, `task status`, `epic new`, `spec new --for <id>`,
`adr new`, `test`, `validate [--docs]`, `doctor`, `recall "<query>"`,
`integrate <branch>`, `present`, `portal`, `remote`; `codeflow --help` lists
the rest.
"""

[[agents]]
tiers = ["minimal"]
text = """
**Mechanics:** `codeflow orient`, `status`, `test`, `doctor`, `policy show`;
`codeflow --help` lists the rest.
"""

[[agents]]
tiers = ["standard", "full"]
text = """
## Where things live

| Layer | Lives in |
|---|---|
| Why: purpose, users, scope, non-goals | `docs/product.md` (human-owned) |
| Rules: how we work | this map, `.codeflow/rules/` and the skills |
| What: what the system does | `docs/capabilities.md` (CAP registry, every ship) |
| How: structure and decisions | `docs/architecture.md` and `docs/decisions/` |
| Trace: what happened and why | the ledger and `codeflow recall` |
"""

[[agents]]
tiers = ["standard"]
text = """
Work in progress lives in the harness's task tools; the full tier adds
durable records. Before building, check `docs/capabilities.md` and the recent
ADRs. Answer "why is X this way" by following links or `codeflow recall "X"`,
never by reading all the code.
"""

[[agents]]
tiers = ["full"]
text = """
Planned and active work lives in `project-management/` (epics, specs, tasks,
allocated by the CLI). The traceability spine runs capability, work item,
ADR or spec, PR, ledger; `validate --docs` checks it. Before building, check
`docs/capabilities.md` and the recent ADRs. Answer "why is X this way" by
following frontmatter links or `codeflow recall "X"`, never by reading all
the code.
"""

