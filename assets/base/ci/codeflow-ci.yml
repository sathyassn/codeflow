# codeflow CI — the perimeter. Re-runs every gate that matters so nothing
# depends on local state. Written by `codeflow init` only if absent; after
# that it is yours.
#
# IMPORTANT: the "Install codeflow" step below is a PLACEHOLDER. Until you
# replace it with the release installer (or a from-source build), the codeflow
# `test`/`validate` gates FAIL RED by design — a missing binary is an unarmed
# perimeter, not a pass. This is a loud, honest signal that the gate is not yet
# enforcing; wire the install step to turn it green. Do NOT "fix" the red by
# making a missing binary skip — that hands branch protection a job that ran
# nothing. The secret-scan and commit-lint jobs work out of the box.
name: codeflow-ci

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  gates:
    name: codeflow gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install codeflow
        run: |
          # PLACEHOLDER: replace with the release installer once published, e.g.
          #   curl -fsSL https://github.com/sathyassn/codeflow/releases/latest/download/codeflow-installer.sh | sh
          #   echo "$HOME/.codeflow/bin" >> "$GITHUB_PATH"
          echo "::error::codeflow install step is an unwired PLACEHOLDER — the test/validate gates below fail RED until you replace this with the real installer. The perimeter is intentionally not armed."

      - name: codeflow test
        run: |
          if command -v codeflow >/dev/null 2>&1; then
            codeflow test
          else
            echo "::error::codeflow not installed — test gate cannot run. The perimeter is not armed; failing red. Wire the Install codeflow step above."
            exit 1
          fi

      - name: codeflow validate --docs
        run: |
          if command -v codeflow >/dev/null 2>&1; then
            codeflow validate --docs
          else
            echo "::error::codeflow not installed — validate gate cannot run. The perimeter is not armed; failing red. Wire the Install codeflow step above."
            exit 1
          fi

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Run the gitleaks binary directly (pinned) rather than the
      # gitleaks-action wrapper, which requires a GitHub token/license.
      - name: gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

  security-review:
    name: security review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Dependency / supply-chain audit — the deterministic floor the
      # cf-security-reviewer red-team layers on (ADR-0016; OWASP A03:2025). Pinned
      # osv-scanner is stack-agnostic: it reads every lockfile ecosystem
      # (Cargo.lock, package-lock.json, requirements.txt, go.mod, …), so this one
      # job is the universal floor. Add stack-specific scanners (cargo audit,
      # pip-audit, govulncheck) and a SAST pass (semgrep --config auto) as your
      # stack warrants.
      #
      # Enforcement reads .codeflow/policy.json `git.dep_audit`:
      #   block — an advisory (or scan error) fails the job (the hard CI gate);
      #   warn  — reported, not failed (the shipped default);
      #   off   — skipped.
      # Record a justified suppression for an accepted or unreachable advisory in
      # an .osv-scanner.toml allowlist (auto-discovered), so a transitive advisory
      # in unchanged code cannot block an unrelated PR.
      - name: dependency audit (osv-scanner)
        run: |
          set -u
          level=$(jq -r '.git.dep_audit // "warn"' .codeflow/policy.json 2>/dev/null || echo warn)
          if [ "$level" = "off" ]; then echo "dep_audit=off — skipping."; exit 0; fi

          OSV_VERSION=2.4.0
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" -o osv-scanner
          chmod +x osv-scanner

          set +e
          out=$(./osv-scanner scan -r . 2>&1); rc=$?
          set -e
          printf '%s\n' "$out"

          if [ "$rc" -eq 0 ]; then
            echo "No known advisories."
          elif printf '%s' "$out" | grep -qiE 'no package sources found|no packages found|no lockfiles'; then
            echo "No scannable manifests found — nothing to audit."
          elif [ "$level" = "block" ]; then
            echo "::error::dependency advisories found (or scan error, exit ${rc}) and policy git.dep_audit=block — failing. Triage, or record a justified suppression in .osv-scanner.toml."
            exit 1
          else
            echo "::warning::dependency advisories found (or scan error, exit ${rc}); policy git.dep_audit=${level} → reporting only. Harden to block once triaged."
          fi

  commit-lint:
    name: commit standards
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint PR commits (format, no AI attribution, no emoji)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          fail=0
          types='feat|fix|docs|refactor|test|chore|ci|perf|build|revert'

          while IFS= read -r subject; do
            if ! printf '%s\n' "$subject" | grep -qE "^(${types})(\([a-zA-Z0-9._/-]+\))?!?: .+[^.]$"; then
              echo "::error::malformed commit subject: ${subject}"
              fail=1
            fi
          done < <(git log --no-merges --format=%s "${BASE_SHA}..${HEAD_SHA}")

          if git log --no-merges --format=%B "${BASE_SHA}..${HEAD_SHA}" \
            | grep -niE 'co-authored-by:.*(claude|anthropic|openai|gpt|copilot|gemini|codex|cursor|assistant|agent|\bai\b|bot)|generated (with|by)'; then
            echo "::error::AI attribution found in commit message(s)"
            fail=1
          fi

          if git log --no-merges --format=%B "${BASE_SHA}..${HEAD_SHA}" \
            | grep -P '[\x{1F000}-\x{1FAFF}]|[\x{2600}-\x{27BF}]|[\x{2B00}-\x{2BFF}]|\x{FE0F}'; then
            echo "::error::emoji found in commit message(s)"
            fail=1
          fi

          exit "$fail"

      - name: Lint PR body (no AI attribution, no emoji)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -u
          fail=0

          if printf '%s\n' "${PR_BODY}" \
            | grep -niE 'co-authored-by:.*(claude|anthropic|openai|gpt|copilot|gemini|codex|cursor|assistant|agent|\bai\b|bot)|generated (with|by)'; then
            echo "::error::AI attribution found in PR body"
            fail=1
          fi

          if printf '%s\n' "${PR_BODY}" \
            | grep -P '[\x{1F000}-\x{1FAFF}]|[\x{2600}-\x{27BF}]|[\x{2B00}-\x{2BFF}]|\x{FE0F}'; then
            echo "::error::emoji found in PR body"
            fail=1
          fi

          exit "$fail"
