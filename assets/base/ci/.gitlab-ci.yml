# codeflow CI for GitLab: a THIN WRAPPER (CodeFlow ADR-0017). The checks
# themselves live in the `codeflow` binary (single source of truth, no drift
# from the git hooks or the Claude git-guard):
#   codeflow ci              verify the MR commit range and branch name against
#                            .codeflow/policy.json (format, no AI attribution,
#                            no emoji, breaking footer, branch naming, and the
#                            MR-body section structure when a body is provided)
#   codeflow test            the test gate
#   codeflow validate --docs the doc-graph integrity lint
#
# The binary is the version the merge request's target pins in
# .codeflow/project.toml (`scaffold_version`), downloaded from its release and
# verified against the release's published sha256.sum; a missing or wrong
# checksum fails the job and nothing unverified is installed (SPC-013 R-113).
# The target is the target branch's current commit: the one a merged results
# pipeline names (CI_MERGE_REQUEST_TARGET_BRANCH_SHA), otherwise the branch
# CI_MERGE_REQUEST_TARGET_BRANCH_NAME fetched from the merge request's project;
# the job fails when it cannot establish it. A branch pipeline judges its own
# commit. An upgrade takes
# two merge requests, in order: first raise only `scaffold_version` (the
# target's binary judges it and the candidate is tested alongside), then run
# `codeflow update`. The job file itself runs from the merge request, so
# protect .gitlab-ci.yml and .codeflow/ with required review.
#
# This is a copy-in template (see this directory's README): `codeflow init`
# scaffolds the GitHub workflow today; a platform picker is a follow-up.
#
# Optional external add-ons (as in the GitHub template), added as extra jobs:
#   gitleaks detect --source . --redact --no-banner --exit-code 1   # secret scan
#   osv-scanner scan -r .                                           # dep audit

stages: [verify]

codeflow:
  stage: verify
  image: debian:stable-slim
  variables:
    GIT_DEPTH: 0
    # MR description for the PR-body attribution and emoji scan. The binary
    # reads this env var; it is not interpolated into the script, so an
    # untrusted body cannot inject shell. Empty (non-MR pipeline): the PR-body
    # check is skipped.
    CODEFLOW_PR_BODY: $CI_MERGE_REQUEST_DESCRIPTION
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates curl git xz-utils >/dev/null
  script:
    - |
      # A merge request is judged by its target branch's current commit, never
      # CI_MERGE_REQUEST_DIFF_BASE_SHA, the diff's base, which stays behind when
      # the target advances. A merged results pipeline names the target commit
      # it merged with. An ordinary merge request pipeline leaves that empty
      # and fetches only the pipeline's own ref, so the job fetches
      # the target branch from the merge request's project: `origin` when the
      # pipeline runs there, the project's URL when it runs in a fork. A
      # default-branch pipeline judges its own commit, already on the target.
      if [ "${CI_PIPELINE_SOURCE:-}" = merge_request_event ]; then
        BASE="${CI_MERGE_REQUEST_TARGET_BRANCH_SHA:-}"
        if [ -z "$BASE" ] && [ -n "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-}" ]; then
          remote=origin
          [ "${CI_MERGE_REQUEST_PROJECT_ID:-}" = "${CI_PROJECT_ID:-}" ] ||
            remote="${CI_MERGE_REQUEST_PROJECT_URL:-}.git"
          git fetch -q --no-tags "$remote" "+refs/heads/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}:refs/codeflow/target" || {
            echo "codeflow: error: cannot fetch the merge request's target branch ${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}; the pinned install never judges by the diff base" >&2
            exit 1
          }
          BASE=$(git rev-parse refs/codeflow/target)
        fi
      else
        BASE="$CI_COMMIT_SHA"
      fi
      HEAD="$CI_COMMIT_SHA"
      # >>> codeflow pinned run (SPC-013 R-113). The same text runs in ci-generic.sh,
      # .gitlab-ci.yml and bitbucket-pipelines.yml: BASE names the target commit and
      # HEAD the change, and the target's pin chooses the binary that judges it.
      set -eu
      codeflow_fail() { echo "codeflow: error: $*" >&2; exit 1; }
      [ -n "${BASE:-}" ] || codeflow_fail "no target commit: pass the commit this change lands on (the pull request's base); the pinned install never guesses it"
      target=$(git rev-parse --verify -q "${BASE}^{commit}") || codeflow_fail "target commit ${BASE} is not in this clone's history"
      head=$(git rev-parse --verify -q "${HEAD:-HEAD}^{commit}") || codeflow_fail "head commit ${HEAD:-HEAD} is not in this clone's history"
      case "$(uname -s) $(uname -m)" in
        "Linux x86_64") triple=x86_64-unknown-linux-gnu ;;
        "Darwin arm64") triple=aarch64-apple-darwin ;;
        "Darwin x86_64") triple=x86_64-apple-darwin ;;
        *) codeflow_fail "codeflow publishes no release binary for $(uname -s) $(uname -m)" ;;
      esac
      # The scaffold_version a commit pins, or nothing.
      codeflow_pin() {
        git show "$1:.codeflow/project.toml" 2>/dev/null |
          sed -n 's/^scaffold_version[[:space:]]*=[[:space:]]*"\([0-9A-Za-z.+-]*\)".*/\1/p' | head -n 1
      }
      # Succeeds when version $1 is older than $2: numeric core first, and a
      # pre-release before its release, as codeflow orders versions.
      codeflow_older() {
        awk -v a="$1" -v b="$2" 'BEGIN {
          i = index(a, "-"); ca = i ? substr(a, 1, i - 1) : a; pa = i ? substr(a, i + 1) : ""
          j = index(b, "-"); cb = j ? substr(b, 1, j - 1) : b; pb = j ? substr(b, j + 1) : ""
          n = split(ca, x, "."); m = split(cb, y, ".")
          for (k = 1; k <= (n > m ? n : m); k++) {
            if (x[k] + 0 < y[k] + 0) exit 0
            if (x[k] + 0 > y[k] + 0) exit 1
          }
          if (pa != "" && pb == "") exit 0
          if (pa == "" || pb == "") exit 1
          exit (pa < pb) ? 0 : 1
        }'
      }
      # Install release $1 into directory $2, verified against its sha256.sum. A
      # missing checksum file, a missing entry or a mismatch fails closed.
      codeflow_install() {
        url="${CODEFLOW_RELEASE_URL:-https://github.com/sathyassn/codeflow/releases/download}/v$1"
        asset="codeflow-cli-${triple}.tar.xz"
        work=$(mktemp -d)
        curl -fsSL "${url}/sha256.sum" -o "${work}/sha256.sum" ||
          codeflow_fail "codeflow $1 has no published checksum file (sha256.sum); refusing an unverified binary"
        expected=$(awk -v a="$asset" '{n=$2; sub(/^\*/, "", n)} n == a {print $1; exit}' "${work}/sha256.sum")
        [ -n "$expected" ] ||
          codeflow_fail "sha256.sum for codeflow $1 lists no checksum for ${asset}; refusing an unverified binary"
        curl -fsSL "${url}/${asset}" -o "${work}/${asset}" ||
          codeflow_fail "cannot download ${asset} for codeflow $1"
        if command -v sha256sum >/dev/null 2>&1; then
          actual=$(sha256sum "${work}/${asset}" | cut -d ' ' -f 1)
        else
          actual=$(shasum -a 256 "${work}/${asset}" | cut -d ' ' -f 1)
        fi
        [ "$actual" = "$expected" ] ||
          codeflow_fail "checksum mismatch for ${asset} (codeflow $1): expected ${expected}, got ${actual}; refusing it"
        tar -xJf "${work}/${asset}" -C "$work"
        mkdir -p "$2"
        cp "${work}/codeflow-cli-${triple}/codeflow" "$2/codeflow"
        chmod +x "$2/codeflow"
        echo "codeflow $1 installed and verified against sha256.sum"
      }
      pin=$(codeflow_pin "$target")
      [ -n "$pin" ] || codeflow_fail "no scaffold_version pinned in .codeflow/project.toml at ${target}"
      head_pin=$(codeflow_pin "$head")
      bin=$(mktemp -d)
      codeflow_install "$pin" "$bin"
      PATH="${bin}:${PATH}"
      export PATH
      lowered=
      if [ "$head_pin" != "$pin" ]; then
        if [ -n "$head_pin" ] && codeflow_older "$pin" "$head_pin"; then
          # Upgrade step one: test the candidate the head pins, never enforce with it.
          candidate=$(mktemp -d)
          codeflow_install "$head_pin" "$candidate"
          "${candidate}/codeflow" --version
          "${candidate}/codeflow" validate --docs
        else
          lowered="${head_pin:-no pin}"
        fi
      fi
      # The target's binary judges the range from a checkout of the target, so the
      # target's policy applies and the head is read only as git data.
      judge=$(mktemp -d)
      git worktree add -q --detach "${judge}/target" "$target"
      trap 'git worktree remove --force "${judge}/target" >/dev/null 2>&1 || true' EXIT
      branch=$(git symbolic-ref --short -q HEAD || true)
      (cd "${judge}/target" && codeflow ci --base "$target" --head "$head" ${branch:+--branch "$branch"})
      codeflow test --strict
      codeflow validate --docs
      [ -z "$lowered" ] ||
        codeflow_fail "the head lowers scaffold_version from ${pin} to ${lowered}; the pin only rises, one pull request at a time, then \`codeflow update\` in the next"
      # <<< codeflow pinned run
