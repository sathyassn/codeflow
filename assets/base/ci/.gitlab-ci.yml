# codeflow CI for GitLab — a THIN WRAPPER (CodeFlow ADR-0017). The checks themselves
# live in the `codeflow` binary (single source of truth, no drift from the git
# hooks or the Claude git-guard):
#   codeflow ci             — verify the MR commit range + branch name against
#                             .codeflow/policy.json (format, no AI attribution,
#                             no emoji, breaking-footer, branch naming, and the
#                             MR-body section structure when a body is provided)
#   codeflow test           — the test gate
#   codeflow validate --docs — the doc-graph integrity lint
#
# `codeflow ci` auto-detects the range from GitLab's predefined variables:
# CI_MERGE_REQUEST_DIFF_BASE_SHA (base) and CI_COMMIT_SHA (head), plus the
# source branch CI_MERGE_REQUEST_SOURCE_BRANCH_NAME. GIT_DEPTH: 0 gives it the
# full history the range walk needs.
#
# This is a copy-in template (see this directory's README): `codeflow init`
# scaffolds the GitHub workflow today; a platform picker is a follow-up.
#
# Optional external add-ons (as in the GitHub template) — add as extra jobs:
#   gitleaks detect --source . --redact --no-banner --exit-code 1   # secret scan
#   osv-scanner scan -r .                                           # dep audit

stages: [verify]

codeflow:
  stage: verify
  image: debian:stable-slim
  variables:
    GIT_DEPTH: 0
    # MR description → the PR-body attribution/emoji scan. The binary reads this
    # env var; it is not interpolated into the script, so an untrusted body
    # cannot inject shell. Empty (non-MR pipeline) → the PR-body check is skipped.
    CODEFLOW_PR_BODY: $CI_MERGE_REQUEST_DESCRIPTION
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    # PLACEHOLDER: install the codeflow binary onto PATH, e.g.
    #   curl -fsSL https://github.com/sathyassn/codeflow/releases/latest/download/codeflow-cli-installer.sh | sh
    # The installer honours CARGO_HOME (dist-workspace.toml sets
    # install-path = "CARGO_HOME"), so the export below resolves the bin
    # dir through it and falls back only when CARGO_HOME is unset.
    # Until wired, the gate fails RED — a missing binary is an unarmed
    # perimeter, not a pass (do NOT "fix" the red by skipping).
    - export PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"
    - command -v codeflow >/dev/null 2>&1 || { echo "codeflow not installed — wire the install step above; failing red (unarmed perimeter)."; exit 1; }
  script:
    - codeflow ci
    - codeflow test --strict
    - codeflow validate --docs
