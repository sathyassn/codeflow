[workspace]
members = ["core", "cli"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
# Runtime dependencies (13)
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
surrealdb = { version = "2", features = ["kv-mem", "kv-surrealkv"] }
loro = "1"
fs2 = "0.4"
git2 = { version = "0.20", features = ["vendored-libgit2", "vendored-openssl"] }
regex = "1"
serde_yaml = "0.9"
ulid = "1"
tokio = { version = "1", features = ["full"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"
# Dev-only dependencies (3)
proptest = "1"
insta = { version = "1", features = ["json"] }
tempfile = "3"
ctor = "0.2"

# Note: cargo-nextest and cargo-llvm-cov are installed tools, NOT Cargo deps.

[profile.release]
opt-level = 3
lto = "fat"
strip = true
codegen-units = 1

[profile.ci]
inherits = "release"
opt-level = 2
codegen-units = 4
lto = false

[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
similar_names = "allow"
items_after_statements = "allow"
manual_let_else = "allow"
too_many_lines = "allow"
cast_precision_loss = "allow"
single_match_else = "allow"
doc_markdown = "allow"
