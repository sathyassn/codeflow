[profile.default]
retries = 0
slow-timeout = { period = "10s", terminate-after = 2 }
fail-fast = true

[profile.ci]
retries = 2
fail-fast = false

# Serialize tests that create SurrealDB in-memory instances.
# Under LLVM coverage instrumentation, concurrent instances cause OOM SIGKILL.
[test-groups]
surrealdb-serial = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(::surreal::) | (package(codeflow-cli) & (test(test_db_) | test(test_workgraph_)))'
test-group = "surrealdb-serial"

[[profile.ci.overrides]]
filter = 'test(::surreal::) | (package(codeflow-cli) & (test(test_db_) | test(test_workgraph_)))'
test-group = "surrealdb-serial"

# ── Testing engine profiles ──────────────────────────────────────────────
# Used by `codeflow test --mode essential` and `codeflow test --mode full`.

[profile.essential]
retries = 0
fail-fast = true

[profile.essential.junit]
path = "junit.xml"

[[profile.essential.overrides]]
filter = 'test(::surreal::) | (package(codeflow-cli) & (test(test_db_) | test(test_workgraph_)))'
test-group = "surrealdb-serial"

[profile.full]
retries = 0
fail-fast = false
slow-timeout = { period = "30s", terminate-after = 3 }

[profile.full.junit]
path = "junit.xml"

[[profile.full.overrides]]
filter = 'test(::surreal::) | (package(codeflow-cli) & (test(test_db_) | test(test_workgraph_)))'
test-group = "surrealdb-serial"
