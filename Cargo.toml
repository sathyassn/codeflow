[workspace]
resolver = "2"
members = ["crates/codeflow-core", "crates/codeflow-cli", "crates/codeflow-present"]

[workspace.package]
version = "2.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sathyassn/codeflow"
homepage = "https://github.com/sathyassn/codeflow"
description = "The AI-development discipline layer you install into any repo: one Rust binary that scaffolds, enforces, verifies, and remembers."
readme = "README.md"
rust-version = "1.94"
keywords = ["cli", "ai", "agents", "git-hooks", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
anyhow = "1.0.103"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
toml = "0.8"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
quick-xml = "0.41"
regex = "1"
git2 = { version = "0.21", default-features = false }
fs2 = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
ulid = "1"
tokio = { version = "1", features = ["process", "time", "rt-multi-thread", "macros"] }
which = "7"
sha2 = "0.11"
unicode-normalization = "=0.1.24"
diffy = "0.4"
rust-embed = "8"
tempfile = "3"
portable-pty = "0.9"
libc = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_System_SystemServices", "Win32_System_Com", "Win32_UI_Shell"] }
axum = { version = "=0.8.9", default-features = false, features = ["form", "http1", "json", "tokio"] }
base64 = "=0.23.0"
getrandom = { version = "=0.4.3", features = ["std"] }
pulldown-cmark = { version = "=0.13.4", default-features = false, features = ["html"] }
scraper = { version = "=0.27.0", default-features = false }
uuid = { version = "=1.24.0", features = ["serde", "v4"] }

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
