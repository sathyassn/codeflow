[workspace]
resolver = "2"
members = ["crates/codeflow-core", "crates/codeflow-cli"]

[workspace.package]
version = "2.0.0-dev"
edition = "2021"
license = "UNLICENSED"
repository = "https://github.com/sathyassn/codeflow"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
diffy = "0.4"
rust-embed = "8"
tempfile = "3"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
