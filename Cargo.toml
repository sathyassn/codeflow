[workspace]
resolver = "2"
members = ["crates/codeflow-core", "crates/codeflow-cli"]

[workspace.package]
version = "2.0.0-dev"
edition = "2021"
license = "UNLICENSED"
repository = "https://github.com/sathyassn/codeflow"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
regex = "1"
git2 = { version = "0.20", default-features = false }
fs2 = "0.4"
tokio = { version = "1", features = ["process", "time", "rt-multi-thread", "macros"] }
which = "7"
tempfile = "3"

[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
