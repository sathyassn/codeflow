[extend]
useDefault = true

[allowlist]
description = "codeflow test fixtures and the secret-scanner's own example patterns are not real credentials"
paths = [
  '''crates/codeflow-core/src/hooks/scan\.rs$''',
  '''crates/codeflow-core/src/hooks/git_hook\.rs$''',
  '''crates/codeflow-cli/tests/hooks_cli\.rs$''',
  # Exact pre-rename fixture paths retained only for private-history scans.
  # Never suppress the historical directory as a whole: that could conceal a
  # future or unrelated credential.
  '''^codeflow-rs/codeflow-core/src/hooks/logging/tooluse\.rs$''',
  '''^codeflow-rs/core/src/hooks/logging/tooluse\.rs$''',
]
regexes = [
  # The cf-security-reviewer / pipeline `security` stage charge enumerates the vuln
  # classes to hunt ("... vulnerable/malicious deps ...") — security-review prose,
  # not a credential; generic-api-key false-matches it. Same category as the scanner
  # example patterns above.
  '''vulnerable/malicious''',
]
