# Builds the docs portal from the committed Markdown and deploys it to GitHub
# Pages. It does not gate a merge and nothing else depends on it.
#
# The repository owner must first set Settings > Pages > Source to
# "GitHub Actions". Until then the deploy job fails at configure-pages and the
# build job still proves the portal builds.
#
# The portal `base` in docs-portal/portal.config.json is /codeflow/, the path
# of a project site at https://sathyassn.github.io/codeflow/.
name: portal-pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs-portal/**"
      - ".github/workflows/portal-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-pages
  cancel-in-progress: false

jobs:
  build:
    name: build portal
    runs-on: ubuntu-latest
    steps:
      # The portal reads the commit history for its last-updated dates.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          # The version pinned in docs-portal/.node-version.
          node-version-file: docs-portal/.node-version
      - name: Install the locked dependencies
        working-directory: docs-portal
        run: npm run deps:install
      - name: Build the portal
        working-directory: docs-portal
        run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-portal/dist

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.repository == 'sathyassn/codeflow'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
