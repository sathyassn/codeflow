# release-plz: propose version bumps + changelog from conventional commits, and
# (on merge of that release PR) cut the vX.Y.Z tag that triggers cargo-dist's
# release.yml. See release-plz.toml and docs/decisions/ADR-0010-automated-release.md.
#
# TOKEN: both jobs prefer a fine-grained PAT in the RELEASE_PLZ_TOKEN secret and
# fall back to the built-in GITHUB_TOKEN. The PAT is effectively REQUIRED for the
# automation to work end to end, because a tag/PR created with GITHUB_TOKEN does
# NOT trigger other workflows — so without it the release PR gets no CI and the
# tag does not start cargo-dist. Add a PAT with `contents: write` +
# `pull-requests: write` on this repo as RELEASE_PLZ_TOKEN before relying on this.
name: release-plz

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Opens/updates the "release" PR: version bump + CHANGELOG.md from the
  # conventional commits landed since the last tag. A human reviews and merges it.
  release-plz-pr:
    name: release-plz release-pr
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout (full history for changelog + tag detection)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: release-plz release-pr
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}

  # On the release PR merge, creates the vX.Y.Z tag (git_release_enable = false,
  # so cargo-dist — not release-plz — authors the GitHub Release from that tag).
  release-plz-release:
    name: release-plz release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: release-plz release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN || secrets.GITHUB_TOKEN }}
