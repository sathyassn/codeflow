name: Enforce Commit Format

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
      - "bugfix/**"
      - "hotfix/**"
      - "docs/**"
      - "refactor/**"
      - "test/**"
      - "chore/**"
      - "style/**"
      - "perf/**"
      - "build/**"
      - "ci/**"
      - "revert/**"
      - "merge/**"
      - "plan/**"
      - "refine/**"
      - "experiment/**"
      - "wip/**"
  pull_request:
    branches:
      - main

jobs:
  validate-commits:
    name: Validate Commit Messages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for all branches

      - name: Get commit range
        id: commit-range
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # For PRs, validate commits in the PR
            echo "base=${{ github.event.pull_request.base.sha }}" >> $GITHUB_OUTPUT
            echo "head=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
          else
            # For pushes, validate only the pushed commits
            echo "base=${{ github.event.before }}" >> $GITHUB_OUTPUT
            echo "head=${{ github.event.after }}" >> $GITHUB_OUTPUT
          fi

      - name: Validate commit messages
        run: |
          #!/bin/bash
          set -e

          # Colors for output
          RED='\033[0;31m'
          GREEN='\033[0;32m'
          YELLOW='\033[1;33m'
          BLUE='\033[0;34m'
          NC='\033[0m' # No Color

          # Allowed commit types (11 types - CodeFlow convention)
          ALLOWED_TYPES=(feat fix docs style refactor test chore perf ci build revert)

          # Get commit list (exclude merge commits)
          BASE="${{ steps.commit-range.outputs.base }}"
          HEAD="${{ steps.commit-range.outputs.head }}"

          # Handle new branch case (no base commit)
          if [ "$BASE" == "0000000000000000000000000000000000000000" ]; then
            COMMITS=$(git rev-list --no-merges "$HEAD")
          else
            COMMITS=$(git rev-list --no-merges "$BASE..$HEAD")
          fi

          # Track validation status
          ALL_VALID=true
          COMMIT_COUNT=0

          echo -e "${BLUE}=======================================================${NC}"
          echo -e "${BLUE}  CodeFlow Commit Format Validation${NC}"
          echo -e "${BLUE}=======================================================${NC}"
          echo ""

          # Validate each commit
          for commit in $COMMITS; do
            COMMIT_COUNT=$((COMMIT_COUNT + 1))

            # Get commit details
            SUBJECT=$(git log --format=%s -n 1 "$commit")
            BODY=$(git log --format=%b -n 1 "$commit")
            FULL_MSG=$(git log --format=%B -n 1 "$commit")
            SHORT_SHA=$(echo "$commit" | cut -c1-7)

            echo -e "${YELLOW}Validating commit: $SHORT_SHA${NC}"
            echo "Subject: $SUBJECT"
            echo ""

            COMMIT_VALID=true

            # 1. Check subject format (type: description) or (type(scope): description)
            VALID_FORMAT=false
            for type in "${ALLOWED_TYPES[@]}"; do
              if echo "$SUBJECT" | grep -qE "^$type(\([a-z0-9-]+\))?: .+$"; then
                VALID_FORMAT=true
                break
              fi
            done

            if [ "$VALID_FORMAT" != true ]; then
              echo -e "${RED}ERROR: Invalid commit format${NC}"
              echo "   Subject: $SUBJECT"
              echo "   Expected: type: description  OR  type(scope): description"
              echo "   Valid types: ${ALLOWED_TYPES[*]}"
              echo ""
              COMMIT_VALID=false
            fi

            # 2. Check subject length (max 72 chars)
            SUBJECT_LEN=${#SUBJECT}
            if [ $SUBJECT_LEN -gt 72 ]; then
              echo -e "${RED}ERROR: Subject line too long${NC}"
              echo "   Length: $SUBJECT_LEN characters"
              echo "   Maximum: 72 characters"
              echo "   Subject: $SUBJECT"
              echo ""
              COMMIT_VALID=false
            fi

            # 3. Check for minimum description length (at least 10 chars after type:)
            DESCRIPTION=$(echo "$SUBJECT" | sed 's/^[a-z]*\([^)]*\)\?: //')
            DESC_LEN=${#DESCRIPTION}
            if [ $DESC_LEN -lt 10 ]; then
              echo -e "${RED}ERROR: Description too short${NC}"
              echo "   Length: $DESC_LEN characters"
              echo "   Minimum: 10 characters"
              echo ""
              COMMIT_VALID=false
            fi

            # 4. Check for trailing period (warning only)
            if echo "$SUBJECT" | grep -qE '\.$'; then
              echo -e "${YELLOW}WARNING: Subject should not end with a period${NC}"
              echo ""
            fi

            # Print commit status
            if [ "$COMMIT_VALID" == true ]; then
              echo -e "${GREEN}Commit validation passed${NC}"
            else
              ALL_VALID=false
            fi
            echo ""
          done

          # Final summary
          echo -e "${BLUE}=======================================================${NC}"
          if [ "$ALL_VALID" == true ]; then
            echo -e "${GREEN}All $COMMIT_COUNT commit(s) pass validation${NC}"
            echo ""
            exit 0
          else
            echo -e "${RED}Validation failed${NC}"
            echo "   Some commits do not meet format requirements"
            echo ""
            echo "   Expected format: type: description"
            echo "   Valid types: ${ALLOWED_TYPES[*]}"
            echo ""
            exit 1
          fi

      - name: Validation passed
        if: success()
        run: |
          echo "All commit messages are valid"

      - name: Validation failed
        if: failure()
        run: |
          echo "Commit validation failed"
          echo ""
          echo "To fix:"
          echo "  1. Review errors above"
          echo "  2. Amend commits with correct format"
          echo "  3. Force push (if necessary): git push --force-with-lease"
          exit 1
