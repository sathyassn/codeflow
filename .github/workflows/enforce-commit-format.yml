# Enforce Commit Format
#
# Validates commit messages against CodeFlow conventions.
# CI cannot read local config files, so values are hardcoded here.
#
# Sync source: .codeflow/config/enforcement/enforcement-policy.json [git_format]
#   - commit_types: 16 types
#   - subject.max_length: 50
#   - body.format: bullets_only, max_bullets: 3, line_max_length: 72
#   - ai_attribution_patterns: 41 patterns (BLOCKED, not required)
#
# If you update enforcement-policy.json git_format, update this workflow to match.

name: Enforce Commit Format

on:
  push:
    branches:
      - main
      - "feat/**"
      - "feature/**"
      - "fix/**"
      - "bugfix/**"
      - "hotfix/**"
      - "docs/**"
      - "refactor/**"
      - "test/**"
      - "chore/**"
      - "style/**"
      - "perf/**"
      - "build/**"
      - "ci/**"
      - "revert/**"
      - "merge/**"
      - "plan/**"
      - "refine/**"
      - "experiment/**"
      - "wip/**"
  pull_request:
    branches:
      - main

jobs:
  validate-commits:
    name: Validate Commit Messages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get commit range
        id: commit-range
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> $GITHUB_OUTPUT
            echo "head=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
          else
            # For push events: always validate all branch commits vs main
            MERGE_BASE=$(git merge-base origin/main "${{ github.sha }}" 2>/dev/null || echo "")
            echo "base=${MERGE_BASE}" >> $GITHUB_OUTPUT
            echo "head=${{ github.sha }}" >> $GITHUB_OUTPUT
          fi

      - name: Validate commit messages
        run: |
          #!/bin/bash
          set -e

          # ---------------------------------------------------------------
          # Hardcoded from enforcement-policy.json [git_format] (16 types)
          # ---------------------------------------------------------------
          ALLOWED_TYPES=(feat fix bugfix hotfix docs refactor test chore style perf build ci revert merge plan refine)

          # Subject: max 50 chars (git_format.subject.max_length)
          MAX_SUBJECT_LENGTH=50

          # Body: bullets_only, max 3, 72-char lines (git_format.body)
          MAX_BODY_BULLETS=3
          MAX_BODY_LINE_LENGTH=72

          # AI attribution patterns (git_format.ai_attribution_patterns, 41 patterns)
          AI_PATTERNS=(
            "Claude" "Anthropic" "@anthropic.com" "claude.ai" "claude code"
            "ChatGPT" "OpenAI" "GPT-3" "GPT-4" "GPT-4o" "o1-preview" "o1-mini"
            "Codex" "@openai.com" "Gemini" "Google AI" "Bard" "@google.com"
            "Copilot" "GitHub Copilot" "@github.com" "Cursor" "Codeium" "Tabnine"
            "CodeWhisperer" "Amazon CodeWhisperer" "Sourcegraph Cody" "Replit AI"
            "Windsurf" "Aider" "Generated with" "Generated by" "AI-generated"
            "AI generated" "Co-Authored-By: AI" "Co-Authored-By: Claude"
            "Co-Authored-By: ChatGPT" "Co-Authored-By: Copilot"
            "🤖" "🔮" "✨ Generated"
          )
          # ---------------------------------------------------------------

          # Colors for CI output
          RED='\033[0;31m'
          GREEN='\033[0;32m'
          YELLOW='\033[1;33m'
          BLUE='\033[0;34m'
          NC='\033[0m'

          # Build type regex
          TYPE_REGEX=$(IFS='|'; echo "${ALLOWED_TYPES[*]}")

          # Get commit list
          BASE="${{ steps.commit-range.outputs.base }}"
          HEAD="${{ steps.commit-range.outputs.head }}"

          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            # No valid base (push to main or unreachable SHA): check all commits
            COMMITS=$(git rev-list --no-merges "$HEAD")
          else
            COMMITS=$(git rev-list --no-merges "$BASE..$HEAD")
          fi

          ALL_VALID=true
          COMMIT_COUNT=0

          echo -e "${BLUE}=======================================================${NC}"
          echo -e "${BLUE}  CodeFlow Commit Format Validation${NC}"
          echo -e "${BLUE}=======================================================${NC}"
          echo ""

          for commit in $COMMITS; do
            COMMIT_COUNT=$((COMMIT_COUNT + 1))

            SUBJECT=$(git log --format=%s -n 1 "$commit")
            BODY=$(git log --format=%b -n 1 "$commit")
            FULL_MSG=$(git log --format=%B -n 1 "$commit")
            SHORT_SHA=$(echo "$commit" | cut -c1-7)

            echo -e "${YELLOW}Validating commit: $SHORT_SHA${NC}"
            echo "Subject: $SUBJECT"
            echo ""

            COMMIT_VALID=true

            # -----------------------------------------------------------
            # 0. Skip merge, revert, and fixup/squash commits
            # -----------------------------------------------------------
            if echo "$SUBJECT" | grep -qE '^Merge '; then
              echo -e "${GREEN}SKIP: Merge commit${NC}"
              echo ""
              continue
            fi
            if echo "$SUBJECT" | grep -qE '^Revert '; then
              echo -e "${GREEN}SKIP: Revert commit${NC}"
              echo ""
              continue
            fi
            if echo "$SUBJECT" | grep -qE '^(fixup|squash)!'; then
              echo -e "${GREEN}SKIP: Fixup/squash commit${NC}"
              echo ""
              continue
            fi

            # -----------------------------------------------------------
            # 1. Subject format: type: desc
            # -----------------------------------------------------------
            VALID_FORMAT=false
            if echo "$SUBJECT" | grep -qE "^($TYPE_REGEX): .+$"; then
              VALID_FORMAT=true
            fi

            if [ "$VALID_FORMAT" != true ]; then
              echo -e "${RED}ERROR: Invalid commit format${NC}"
              echo "  Subject: $SUBJECT"
              echo "  Expected: type: description"
              echo "  Valid types: ${ALLOWED_TYPES[*]}"
              echo ""
              COMMIT_VALID=false
            fi

            # -----------------------------------------------------------
            # 2. Subject length (max 50 chars)
            # -----------------------------------------------------------
            SUBJECT_LEN=${#SUBJECT}
            if [ "$SUBJECT_LEN" -gt "$MAX_SUBJECT_LENGTH" ]; then
              echo -e "${RED}ERROR: Subject line too long${NC}"
              echo "  Length: $SUBJECT_LEN characters"
              echo "  Maximum: $MAX_SUBJECT_LENGTH characters"
              echo "  Subject: $SUBJECT"
              echo ""
              COMMIT_VALID=false
            fi

            # -----------------------------------------------------------
            # 3. Minimum description length (10 chars after type:)
            # -----------------------------------------------------------
            DESCRIPTION=$(echo "$SUBJECT" | sed 's/^[a-z]*: //')
            DESC_LEN=${#DESCRIPTION}
            if [ "$DESC_LEN" -lt 10 ]; then
              echo -e "${RED}ERROR: Description too short${NC}"
              echo "  Length: $DESC_LEN characters"
              echo "  Minimum: 10 characters"
              echo ""
              COMMIT_VALID=false
            fi

            # -----------------------------------------------------------
            # 4. No trailing period on subject
            # -----------------------------------------------------------
            if echo "$SUBJECT" | grep -qE '\.$'; then
              echo -e "${RED}ERROR: Subject should not end with a period${NC}"
              echo ""
              COMMIT_VALID=false
            fi

            # -----------------------------------------------------------
            # 5. Body format validation (bullets_only, max 3, 72-char lines)
            # -----------------------------------------------------------
            if [ -n "$BODY" ]; then
              BULLET_COUNT=0
              NON_BULLET_LINES=0
              LONG_LINES=0
              LINE_NUM=0

              while IFS= read -r line; do
                LINE_NUM=$((LINE_NUM + 1))

                # Skip empty lines
                if [ -z "$line" ]; then
                  continue
                fi

                # Skip AI attribution lines (Co-Authored-By etc)
                if echo "$line" | grep -qiE '^Co-Authored-By:'; then
                  continue
                fi

                # Check if line is a bullet
                if echo "$line" | grep -qE '^- '; then
                  BULLET_COUNT=$((BULLET_COUNT + 1))
                else
                  NON_BULLET_LINES=$((NON_BULLET_LINES + 1))
                fi

                # Check line length
                LINE_LEN=${#line}
                if [ "$LINE_LEN" -gt "$MAX_BODY_LINE_LENGTH" ]; then
                  LONG_LINES=$((LONG_LINES + 1))
                fi
              done <<< "$BODY"

              # Body must use bullet format
              if [ "$NON_BULLET_LINES" -gt 0 ]; then
                echo -e "${RED}ERROR: Body must use bullet format (lines starting with '- ')${NC}"
                echo "  Found $NON_BULLET_LINES non-bullet line(s)"
                echo ""
                COMMIT_VALID=false
              fi

              # No blank lines between bullets
              BTWN_BULLETS=false
              BTWN_IN=false
              while IFS= read -r bline; do
                if echo "$bline" | grep -qE '^- '; then
                  if [ "$BTWN_BULLETS" = "true" ]; then
                    echo -e "${RED}ERROR: Blank lines between bullets${NC}"
                    echo "  Bullets must be contiguous (no blank lines between them)"
                    echo ""
                    COMMIT_VALID=false
                    break
                  fi
                  BTWN_IN=true
                  BTWN_BULLETS=false
                elif [ -z "$bline" ] && [ "$BTWN_IN" = "true" ]; then
                  BTWN_BULLETS=true
                fi
              done <<< "$BODY"

              # Max 3 bullets
              if [ "$BULLET_COUNT" -gt "$MAX_BODY_BULLETS" ]; then
                echo -e "${RED}ERROR: Too many bullet points in body${NC}"
                echo "  Found: $BULLET_COUNT bullets"
                echo "  Maximum: $MAX_BODY_BULLETS bullets"
                echo ""
                COMMIT_VALID=false
              fi

              # 72-char body lines
              if [ "$LONG_LINES" -gt 0 ]; then
                echo -e "${RED}ERROR: Body lines exceed $MAX_BODY_LINE_LENGTH characters${NC}"
                echo "  Found $LONG_LINES line(s) over limit"
                echo ""
                COMMIT_VALID=false
              fi
            fi

            # -----------------------------------------------------------
            # 6. AI attribution check
            # -----------------------------------------------------------
            HAS_ATTRIBUTION=false
            for pattern in "${AI_PATTERNS[@]}"; do
              if echo "$FULL_MSG" | grep -qiF "$pattern"; then
                HAS_ATTRIBUTION=true
                break
              fi
            done

            if [ "$HAS_ATTRIBUTION" == true ]; then
              echo -e "${RED}ERROR: AI attribution detected${NC}"
              echo "  Commit messages must NOT include AI model names or attribution"
              echo "  Remove any AI-related patterns from the commit message"
              echo ""
              COMMIT_VALID=false
            fi

            # -----------------------------------------------------------
            # Commit result
            # -----------------------------------------------------------
            if [ "$COMMIT_VALID" == true ]; then
              echo -e "${GREEN}PASS${NC}"
            else
              ALL_VALID=false
            fi
            echo ""
          done

          # Final summary
          echo -e "${BLUE}=======================================================${NC}"
          if [ "$ALL_VALID" == true ]; then
            echo -e "${GREEN}All $COMMIT_COUNT commit(s) pass validation${NC}"
            echo ""
            exit 0
          else
            echo -e "${RED}Validation failed${NC}"
            echo "  Some commits do not meet format requirements."
            echo ""
            echo "  Expected format: type: description"
            echo "  Valid types: ${ALLOWED_TYPES[*]}"
            echo "  Max subject length: $MAX_SUBJECT_LENGTH characters"
            echo "  Body: bullet format (- or *), max $MAX_BODY_BULLETS bullets, $MAX_BODY_LINE_LENGTH-char lines"
            echo "  AI attribution blocked (no AI model names or Co-Authored-By patterns)"
            echo ""
            exit 1
          fi

      - name: Validation passed
        if: success()
        run: |
          echo "All commit messages are valid"

      - name: Validation failed
        if: failure()
        run: |
          echo "Commit validation failed"
          echo ""
          echo "To fix:"
          echo "  1. Review errors above"
          echo "  2. Amend commits with correct format"
          echo "  3. Force push (if necessary): git push --force-with-lease"
          exit 1
