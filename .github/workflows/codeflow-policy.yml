# codeflow policy: the enforcing CodeFlow check for pull requests. Written by
# `codeflow init` and managed by `codeflow update`.
#
# It runs on `pull_request_target`, so GitHub runs this file from the
# repository's default branch, never from the pull request: a pull request
# that edits this workflow cannot change the job that judges it. GitHub's
# default checkout for this event is also the default branch, whatever the
# pull request targets, so the job checks out the pull request's base commit
# explicitly. From that target checkout it installs the codeflow version the
# target pins in .codeflow/project.toml (`scaffold_version`), verified against
# the release's published sha256.sum (SPC-013 R-113), and reads the target's
# policy. It fetches the pull request head only as git data and never runs
# its code. The token is read-only and no secret is used. Builds and tests of
# the head run in codeflow-ci.yml on `pull_request`.
#
# `codeflow ci` runs the SAME commit-format, no-AI-attribution, no-emoji,
# breaking-footer, branch-naming and PR-body checks as the git hooks and the
# Claude git-guard, reading the target's .codeflow/policy.json (CodeFlow
# ADR-0017). `edited` reruns it when the PR body changes. Trusted automation
# profiles (git.automation_profiles) apply only for the actor passed here, and
# never on a fork pull request.
#
# The same job is the enforcing check of the shared id registry (SPC-013
# R-14, R-20, R-109; ADR-0072), so one target build serves both. Push,
# schedule and dispatch runs keep their own event's commit and run only the
# registry check; with durable work tracking off, `codeflow ids check` passes
# with a note.
#
# Pull request runs share one concurrency group per pull request, so a newer
# event (a push, then a body edit seconds later) cancels the run it
# supersedes. The judging run reads the pull request's body from the API
# when it runs, never from its event, so the newest body is judged whichever
# run survives. Push, schedule and dispatch runs each get a group of their
# own run and are never cancelled: a registry run is never replaced by a
# newer queued event.
#
# This repository's copy: CodeFlow is its own first consumer, so the install
# step builds the target branch's own source in place of the pinned release.
# `codeflow update` keeps it as a user-modified file.
name: codeflow-policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main, master, "integration/**"]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request_target' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  commit-lint:
    name: commit standards
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Read access to pull requests serves the body step below, and read
    # access to actions the merge admission; the token stays read-only.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      # Only a protected base supplies the code this job builds and runs
      # (TSK-1001): before any checkout or build, a pull request into any
      # other branch fails here, since a branch its author controls would
      # run its own code as the judge.
      - name: The base branch is a protected one
        if: github.event_name == 'pull_request_target'
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          case "$BASE_REF" in
            main|master|integration/*) echo "base ${BASE_REF} is protected" ;;
            *) echo "::error::the base ${BASE_REF} is not main, master or integration/**; its code is not trusted to judge this pull request"; exit 1 ;;
          esac

      # The target, never the pull request head: for a pull request its base
      # commit, otherwise the event's own commit. The binary, the pin and the
      # policy all come from this checkout.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || '' }}
          fetch-depth: 0

      # This repository IS codeflow, so it builds the checked-out TARGET
      # branch's own source instead of installing a pinned release. The PR
      # head is never checked out or built. The toolchain is pinned in
      # rust-toolchain.toml.
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Build codeflow from the target's source
        run: |
          cargo build --release -p codeflow-cli
          echo "${GITHUB_WORKSPACE}/target/release" >> "$GITHUB_PATH"

      - name: Fetch the pull request head as data
        if: github.event_name == 'pull_request_target'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/codeflow/pr-head"
          fetched=$(git rev-parse refs/codeflow/pr-head)
          if [ "$fetched" != "$HEAD_SHA" ]; then
            echo "::error::the pull request head moved (${fetched}, event ${HEAD_SHA}); this run belongs to an older event, so it fails; re-run the check for the current head"; exit 1
          fi

      # The body is read when the job runs, never taken from the event. An
      # event carries the body as it was when the event fired, and the run
      # that survives the concurrency group can belong to an older event (one
      # delivered late, or a re-run), so only the current body is the newest.
      # The text is written as a step output under a random delimiter and is
      # never interpolated into a script.
      - name: Read the pull request's current body
        id: body
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 60 \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" -o "${RUNNER_TEMP}/pull.json"
          delimiter="codeflow_body_$(openssl rand -hex 16)"
          {
            echo "text<<${delimiter}"
            jq -r '.body // ""' "${RUNNER_TEMP}/pull.json"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"
          # The digest of the exact body judged here, from the same read;
          # merge admission binds it and refuses when the body moved since.
          echo "sha256=$(python3 -I -c 'import hashlib, json, sys; print(hashlib.sha256((json.load(open(sys.argv[1])).get("body") or "").encode("utf-8")).hexdigest())' "${RUNNER_TEMP}/pull.json")" >> "$GITHUB_OUTPUT"
          # The draft state from the same read, so the judgment and the
          # admission below use one snapshot, never the event's older one
          # (a rerun of a draft event after the pull request was made ready).
          # A draft state that is not true or false fails this job.
          draft=$(python3 -I -c 'import json, sys; d = json.load(open(sys.argv[1])).get("draft"); sys.exit(2) if not isinstance(d, bool) else print(str(d).lower())' "${RUNNER_TEMP}/pull.json")
          echo "draft=${draft}" >> "$GITHUB_OUTPUT"

      # The PR body reaches `codeflow ci` through `env:`, never interpolated
      # into the script, so an untrusted body cannot inject shell.
      - name: codeflow ci (commit + branch + PR-body standards)
        if: github.event_name == 'pull_request_target'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          CODEFLOW_PR_BODY: ${{ steps.body.outputs.text }}
          CODEFLOW_PR_IS_DRAFT: ${{ steps.body.outputs.draft }}
          ACTOR: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor || 'unknown' }}
        run: codeflow ci --base "$BASE_SHA" --head "$HEAD_SHA" --branch "$HEAD_REF" --actor "$ACTOR"

      # The registry is fetched explicitly with full history, never forced
      # (R-20); the pull request head above was fetched as data only.
      - name: Fetch the shared registry
        run: |
          if git ls-remote --exit-code --heads origin codeflow/registry >/dev/null; then
            git fetch --no-tags origin refs/heads/codeflow/registry:refs/remotes/origin/codeflow/registry
          else
            echo "codeflow/registry is not on origin; the check reports it when records are tracked"
          fi

      - name: codeflow ids check
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request_target ]; then
            codeflow ids check --base "$BASE_SHA" --head refs/codeflow/pr-head
          else
            codeflow ids check
          fi

      # Merge admission (TSK-449 AC-6, TSK-1001). It binds trusted identity
      # only: the head, base, body and draft state this job judged, which the live pull
      # request must match before and after admission; the codeflow-ci
      # workflow and this verdict script hashed at the head against that
      # base (a pull request that edits either picks its own jobs and is
      # refused); GitHub's association of the run with exactly this pull
      # request, head and base, beside the title the trusted workflow
      # writes; and no other pull request sharing the head. A draft's codeflow-ci verdicts are
      # skipped, which a required-check rule reads as passing, so this
      # required check passes only when the newest codeflow-ci pull_request
      # run at exactly this head completed with success and both verdicts
      # succeeded. A ready pull request waits for that run, 35 minutes at
      # most so the job stays inside the 45-minute job bound; a run still
      # pending then refuses and names the re-run that admits it. A draft,
      # a cancelled or failed run, a run only for another head or a skipped
      # verdict refuses at once. `ready_for_review` and a new push start
      # this job again at the new head. The script comes from the target
      # checkout above, never from the pull request.
      - name: the exact head's ready codeflow-ci run passed
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BODY_SHA256: ${{ steps.body.outputs.sha256 }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DRAFT: ${{ steps.body.outputs.draft }}
        run: |
          set -euo pipefail
          wait=2100
          if [ "$DRAFT" = true ]; then wait=0; fi
          # The provenance verifier: PyJWT with cryptography, every
          # distribution pinned by SHA-256 in the target's requirements file.
          python3 -m venv "${RUNNER_TEMP}/admission"
          "${RUNNER_TEMP}/admission/bin/pip" install --quiet --disable-pip-version-check --require-hashes --no-deps \
            -r scripts/requirements-admission.txt
          "${RUNNER_TEMP}/admission/bin/python" -I scripts/ci-reuse.py admit --repo "$REPOSITORY" --head "$HEAD_SHA" --pull "$PR_NUMBER" \
            --workflow .github/workflows/codeflow-ci.yml \
            --trusted-file .github/workflows/codeflow-ci.yml --trusted-file scripts/ci-reuse.py \
            --trusted-file scripts/requirements-admission.txt \
            --base-ref "$BASE_REF" --base-sha "$BASE_SHA" --body-sha256 "$BODY_SHA256" --draft "$DRAFT" \
            --require "codeflow gates" --require windows --wait "$wait"
