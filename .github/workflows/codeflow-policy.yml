# Trusted policy validation and exact-head admission for this public repository.
# pull_request_target judges the current body after a push, edit or readiness
# change. workflow_run completed requests admission again when codeflow-ci
# ends, including failures and reruns. Nothing polls or holds a runner for CI.
# Both events execute the workflow's default-branch scripts. Validation builds
# only the current trusted target; the PR head is fetched solely as git data.
# The publisher uses no target build, PR checkout, cache or artifact. Its only
# write permission is checks:write; it reads public API metadata without a token.
# It first writes a failing commit standards check for the native event head.
# Only that new check can be promoted after rechecking current PR number, exact
# head, target, body digest, newest CI run and exact attempt. Initial read errors
# therefore cannot preserve a previous green check at the same head.
# Missing/ambiguous identities and API errors fail closed. Stale completions
# cannot publish for a newer head or attempt. Publication has a final-read
# window: a later change is judged by the event it queues, as in TSK-1040.
# Per-PR queue:max retains every event without cancellation, up to GitHub's
# 100-run queue limit. No ordering is assumed. Public API rate limits and the
# window after the last read remain limits; an API failure never grants success.
# Consumer templates receive no admission mechanism (TSK-1239 AC-5).
name: codeflow-policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]
  workflow_run:
    workflows: [codeflow-ci]
    types: [completed]
  push:
    branches: [main, master, "integration/**"]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.event_name == 'pull_request_target' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || github.event_name == 'workflow_run' && github.event.workflow_run.pull_requests[0].number && format('{0}-pr-{1}', github.workflow, github.event.workflow_run.pull_requests[0].number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    name: policy validation
    if: github.event_name == 'pull_request_target' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      digest: ${{ steps.prepare.outputs.digest }}
    steps:
      - name: Read the trusted workflow scripts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Preserve the trusted scripts before the target checkout
        run: |
          mkdir -p "$RUNNER_TEMP/policy-tools"
          cp scripts/ci-reuse.py scripts/policy-admission.py "$RUNNER_TEMP/policy-tools/"
      - name: Read current pull request identity and body
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I "$RUNNER_TEMP/policy-tools/policy-admission.py" prepare
      - name: Check out the trusted target, never the pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.prepare.outputs.base_sha }}
          fetch-depth: 0
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build codeflow from the target's source
        run: |
          cargo build --release -p codeflow-cli
          echo "${GITHUB_WORKSPACE}/target/release" >> "$GITHUB_PATH"
      - name: Fetch the pull request head as data
        env:
          PR_NUMBER: ${{ steps.prepare.outputs.pull }}
          HEAD_SHA: ${{ steps.prepare.outputs.head }}
        run: |
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/codeflow/pr-head"
          if [ "$(git rev-parse refs/codeflow/pr-head)" != "$HEAD_SHA" ]; then
            echo "::error::the pull request head moved; the new head must be judged"; exit 1
          fi
      - name: codeflow ci (commit + branch + PR-body standards)
        env:
          BASE_SHA: ${{ steps.prepare.outputs.base_sha }}
          HEAD_SHA: ${{ steps.prepare.outputs.head }}
          HEAD_REF: ${{ steps.prepare.outputs.head_ref }}
          ACTOR: ${{ steps.prepare.outputs.actor }}
        # Completion events are not the PR actor, so no automation profile is
        # inferred from the actor who reran CI. PR events retain their actor.
        run: codeflow ci --base "$BASE_SHA" --head "$HEAD_SHA" --branch "$HEAD_REF" --actor "$ACTOR" --pr-body-file "$RUNNER_TEMP/pr-body.md"
      - name: Fetch the shared registry
        run: |
          if git ls-remote --exit-code --heads origin codeflow/registry >/dev/null; then
            git fetch --no-tags origin refs/heads/codeflow/registry:refs/remotes/origin/codeflow/registry
          else
            echo "codeflow/registry is not on origin; the check reports it when records are tracked"
          fi
      - name: codeflow ids check
        env:
          BASE_SHA: ${{ steps.prepare.outputs.base_sha }}
        run: codeflow ids check --base "$BASE_SHA" --head refs/codeflow/pr-head
      - name: Check the newest exact-head CI attempt without waiting
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.prepare.outputs.head }}
          PR_NUMBER: ${{ steps.prepare.outputs.pull }}
          BASE_REF: ${{ steps.prepare.outputs.base }}
        run: |
          python3 -I "$RUNNER_TEMP/policy-tools/ci-reuse.py" admit \
            --repo "$GITHUB_REPOSITORY" --head "$HEAD_SHA" --pull "$PR_NUMBER" --base "$BASE_REF" \
            --workflow .github/workflows/codeflow-ci.yml --require "codeflow gates" --require windows

  publish:
    name: publish exact-head admission
    needs: validate
    if: always() && (github.event_name == 'pull_request_target' || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
    steps:
      # Only the default-branch workflow commit is executable here. There is
      # no target checkout, head checkout, build, cache or downloaded artifact.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Publish the current PR head's required check
        env:
          GH_TOKEN: ${{ github.token }}
          JUDGED_DIGEST: ${{ needs.validate.outputs.digest }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: python3 -I scripts/policy-admission.py publish

  registry:
    name: shared id registry
    if: github.event_name != 'pull_request_target' && github.event_name != 'workflow_run'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build codeflow from the target's source
        run: |
          cargo build --release -p codeflow-cli
          echo "${GITHUB_WORKSPACE}/target/release" >> "$GITHUB_PATH"
      - name: Fetch the shared registry
        run: |
          if git ls-remote --exit-code --heads origin codeflow/registry >/dev/null; then
            git fetch --no-tags origin refs/heads/codeflow/registry:refs/remotes/origin/codeflow/registry
          else
            echo "codeflow/registry is not on origin; the check reports it when records are tracked"
          fi
      - name: codeflow ids check
        run: codeflow ids check
