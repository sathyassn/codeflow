# codeflow policy: the enforcing CodeFlow check for pull requests. Written by
# `codeflow init` and managed by `codeflow update`.
#
# It runs on `pull_request_target`, so GitHub runs this file from the
# repository's default branch, never from the pull request: a pull request
# that edits this workflow cannot change the job that judges it. GitHub's
# default checkout for this event is also the default branch, whatever the
# pull request targets, so the job checks out the pull request's base commit
# explicitly. From that target checkout it installs the codeflow version the
# target pins in .codeflow/project.toml (`scaffold_version`), verified against
# the release's published sha256.sum (SPC-013 R-113), and reads the target's
# policy. It fetches the pull request head only as git data and never runs
# its code. The token is read-only and no secret is used. Builds and tests of
# the head run in codeflow-ci.yml on `pull_request`.
#
# `codeflow ci` runs the SAME commit-format, no-AI-attribution, no-emoji,
# breaking-footer, branch-naming and PR-body checks as the git hooks and the
# Claude git-guard, reading the target's .codeflow/policy.json (CodeFlow
# ADR-0017). `edited` reruns it when the PR body changes. Trusted automation
# profiles (git.automation_profiles) apply only for the actor passed here, and
# never on a fork pull request.
#
# The same job is the enforcing check of the shared id registry (SPC-013
# R-14, R-20, R-109; ADR-0072), so one target build serves both. Push and
# schedule runs check the registry at their event's commit. Manual dispatch
# is now a cache warmer on main, requiring a SHA contained in main or an
# integration branch; it replaces the manual registry check on arbitrary
# refs. It builds that SHA only on a cache miss and never runs registry
# checks. PR-target runs retain read-only cache access. With durable work
# tracking off, `codeflow ids check` passes with a note.
#
# Pull request runs share one concurrency group per pull request, so a newer
# event (a push, then a body edit seconds later) cancels the run it
# supersedes. The judging run reads the pull request's body from the API
# when it runs, never from its event, so the newest body is judged whichever
# run survives. Push, schedule and dispatch runs each get a group of their
# own run and are never cancelled: a registry check or cache warm is never
# replaced by a newer queued event.
#
# This repository's copy: CodeFlow is its own first consumer, so the install
# step builds the target branch's own source in place of the pinned release.
# `codeflow update` keeps it as a user-modified file.
name: codeflow-policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main, master, "integration/**"]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
    inputs:
      build_sha:
        description: Commit contained in main or an integration branch to cache
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request_target' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

jobs:
  # Only a trusted integration push can request default-scope population.
  # No checkout or PR data runs with this job's dispatch permission.
  warm-target-cache:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/integration/')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Request a target build in main's cache scope
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
        run: |
          if ! gh workflow run codeflow-policy.yml --repo "$GH_REPO" --ref main -f "build_sha=$BUILD_SHA"; then
            echo "::warning::Could not request cache warming for $BUILD_SHA; main must contain the build_sha writer. Readers rebuild on a miss."
            exit 1
          fi

  commit-lint:
    name: commit standards
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Read access to pull requests serves the body step below, and read
    # access to actions the merge admission; the token stays read-only.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      # The target, never the pull request head: for a pull request its base
      # commit, otherwise the event's own commit. The binary, the pin and the
      # policy all come from this checkout.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || '' }}
          fetch-depth: 0

      # Dispatch inputs confer no trust. Refresh branch authority, prove
      # containment, then select the exact commit before running its tools.
      - name: Verify the dispatched target
        id: dispatch-target
        if: github.event_name == 'workflow_dispatch'
        env:
          WORKFLOW_REF: ${{ github.ref }}
          BUILD_SHA: ${{ inputs.build_sha }}
        run: |
          set -euo pipefail
          if [ "$WORKFLOW_REF" != refs/heads/main ] || ! [[ "$BUILD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::cache population requires a full commit SHA and a workflow dispatched on main"; exit 1
          fi
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git cat-file -e "$BUILD_SHA^{commit}"
          refs=$(git for-each-ref --contains="$BUILD_SHA" --format='%(refname)' refs/remotes/origin)
          trusted=false
          while IFS= read -r ref; do
            case "$ref" in
              refs/remotes/origin/main|refs/remotes/origin/integration/*) trusted=true ;;
            esac
          done <<< "$refs"
          if [ "$trusted" != true ]; then
            echo "::error::requested cache SHA is not contained in main or an integration branch"; exit 1
          fi
          git checkout --detach "$BUILD_SHA"
          [ "$(git rev-parse HEAD)" = "$BUILD_SHA" ]
          echo "verified=true" >> "$GITHUB_OUTPUT"

      # This repository IS codeflow, so it builds the checked-out TARGET
      # branch's own source instead of installing a pinned release. The PR
      # head is never checked out or built. The toolchain is pinned in
      # rust-toolchain.toml.
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install

      # A target checkout determines the key before any head is fetched.
      # The namespace fixes release/default features/native target. No
      # fallback keys: even a prefix match must rebuild. A dispatch uses
      # only the SHA whose trusted branch containment was proved above.
      - name: Identify the target build
        id: target-build
        env:
          EVENT: ${{ github.event_name }}
          VERIFIED_DISPATCH: ${{ steps.dispatch-target.outputs.verified }}
          TARGET_REF: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.ref || github.ref_name }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          git diff --quiet
          git diff --cached --quiet
          allowed=false
          case "$EVENT:$TARGET_REF" in
            push:main|push:master|push:integration/*|pull_request_target:main|pull_request_target:master|pull_request_target:integration/*|schedule:main|schedule:master) allowed=true ;;
            workflow_dispatch:main) if [ "$VERIFIED_DISPATCH" = true ]; then allowed=true; fi ;;
          esac
          identity=$({
            rustc -vV
            cargo -V
            cc --version
            printf '%s\n' "${ImageOS:?}" "${ImageVersion:?}" "${RUNNER_ARCH:?}"
            printf '%s\n' "${RUSTFLAGS-}" "${CARGO_ENCODED_RUSTFLAGS-}" "${CC-}" "${CFLAGS-}" "${LDFLAGS-}"
          } | sha256sum | cut -d ' ' -f 1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "key=codeflow-policy-release-default-v1-$sha-$identity" >> "$GITHUB_OUTPUT"
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"

      - name: Restore the target binary
        id: target-cache
        if: steps.target-build.outputs.allowed == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/codeflow-policy-binary
          key: ${{ steps.target-build.outputs.key }}
          # A writer needs no downloaded executable when its exact key exists.
          lookup-only: ${{ github.event_name == 'workflow_dispatch' }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.target-cache.outputs.cache-hit != 'true'
        with:
          # Head builds cannot populate the trusted dependency scope either.
          save-if: ${{ github.event_name == 'push' && steps.target-build.outputs.allowed == 'true' }}

      - name: Verify or rebuild the target binary
        id: target-binary
        if: github.event_name != 'workflow_dispatch' || steps.target-cache.outputs.cache-hit != 'true'
        env:
          TARGET_SHA: ${{ steps.target-build.outputs.sha }}
          CACHE_HIT: ${{ steps.target-cache.outputs.cache-hit }}
          BINARY_DIR: ${{ runner.temp }}/codeflow-policy-binary
        run: |
          set -euo pipefail
          binary="$BINARY_DIR/codeflow"
          matches_target() {
            [ -x "$binary" ] && [ ! -L "$binary" ] || return 1
            version=$("$binary" --version) || return 1
            [[ "$version" =~ ^codeflow\ [^[:space:]]+\ source=$TARGET_SHA\ dirty=false\ inputs=[0-9a-f]+$ ]]
          }
          built=false
          if [ "$CACHE_HIT" != true ] || ! matches_target; then
            echo "Target binary cache absent, inexact or wrong identity; rebuilding $TARGET_SHA"
            rm -f "$binary"
            cargo build --release --locked -p codeflow-cli
            mkdir -p "$BINARY_DIR"
            cp target/release/codeflow "$binary"
            built=true
          fi
          if ! matches_target; then
            echo "::error::target binary source identity does not match $TARGET_SHA"; exit 1
          fi
          echo "Verified target binary: $TARGET_SHA (rebuilt=$built)"
          echo "built=$built" >> "$GITHUB_OUTPUT"
          echo "$BINARY_DIR" >> "$GITHUB_PATH"

      # A verified main-scope dispatch or trusted push saves a fresh build.
      # PR events remain read-only under GitHub's default cache permissions;
      # no cache-mode expression or write override is needed. An invalid
      # immutable entry is rebuilt by the reader, not replaced.
      - name: Save the verified target binary
        if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && steps.dispatch-target.outputs.verified == 'true')) && steps.target-build.outputs.allowed == 'true' && steps.target-binary.outputs.built == 'true' && steps.target-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/codeflow-policy-binary
          key: ${{ steps.target-build.outputs.key }}

      - name: Fetch the pull request head as data
        if: github.event_name == 'pull_request_target'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/codeflow/pr-head"
          fetched=$(git rev-parse refs/codeflow/pr-head)
          if [ "$fetched" != "$HEAD_SHA" ]; then
            echo "::error::the pull request head moved (${fetched}, event ${HEAD_SHA}); this run belongs to an older event, so it fails; re-run the check for the current head"; exit 1
          fi

      # The body is read when the job runs, never taken from the event. An
      # event carries the body as it was when the event fired, and the run
      # that survives the concurrency group can belong to an older event (one
      # delivered late, or a re-run), so only the current body is the newest.
      # The text is written as a step output under a random delimiter and is
      # never interpolated into a script.
      - name: Read the pull request's current body
        id: body
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 60 \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" -o "${RUNNER_TEMP}/pull.json"
          delimiter="codeflow_body_$(openssl rand -hex 16)"
          {
            echo "text<<${delimiter}"
            jq -r '.body // ""' "${RUNNER_TEMP}/pull.json"
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      # The PR body reaches `codeflow ci` through `env:`, never interpolated
      # into the script, so an untrusted body cannot inject shell.
      - name: codeflow ci (commit + branch + PR-body standards)
        if: github.event_name == 'pull_request_target'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          CODEFLOW_PR_BODY: ${{ steps.body.outputs.text }}
          ACTOR: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor || 'unknown' }}
        run: codeflow ci --base "$BASE_SHA" --head "$HEAD_SHA" --branch "$HEAD_REF" --actor "$ACTOR"

      # The registry is fetched explicitly with full history, never forced
      # (R-20); the pull request head above was fetched as data only.
      - name: Fetch the shared registry
        if: github.event_name != 'workflow_dispatch'
        run: |
          if git ls-remote --exit-code --heads origin codeflow/registry >/dev/null; then
            git fetch --no-tags origin refs/heads/codeflow/registry:refs/remotes/origin/codeflow/registry
          else
            echo "codeflow/registry is not on origin; the check reports it when records are tracked"
          fi

      - name: codeflow ids check
        if: github.event_name != 'workflow_dispatch'
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request_target ]; then
            codeflow ids check --base "$BASE_SHA" --head refs/codeflow/pr-head
          else
            codeflow ids check
          fi

      # Merge admission (TSK-449 AC-6). A draft's codeflow-ci verdicts are
      # skipped, which a required-check rule reads as passing, so this
      # required check passes only when the newest codeflow-ci pull_request
      # run at exactly this head completed with success and both verdicts
      # succeeded. A ready pull request waits for that run, 35 minutes at
      # most so the job stays inside the 45-minute job bound; a run still
      # pending then refuses and names the re-run that admits it. A draft,
      # a cancelled or failed run, a run only for another head or a skipped
      # verdict refuses at once. `ready_for_review` and a new push start
      # this job again at the new head. The script comes from the target
      # checkout above, never from the pull request.
      - name: the exact head's ready codeflow-ci run passed
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          wait=2100
          if [ "$DRAFT" = true ]; then wait=0; fi
          python3 -I scripts/ci-reuse.py admit --repo "$REPOSITORY" --head "$HEAD_SHA" --pull "$PR_NUMBER" \
            --workflow .github/workflows/codeflow-ci.yml --require "codeflow gates" --require windows \
            --wait "$wait"
