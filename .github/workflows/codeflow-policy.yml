# codeflow policy: the enforcing CodeFlow check for pull requests. Written by
# `codeflow init` and managed by `codeflow update`.
#
# The verdict job, `commit standards`, runs on `pull_request_target`
# for every pull request, whatever it targets. GitHub runs this file from the
# repository's default branch, never from the pull request or its target,
# and sets GITHUB_REF to that branch and GITHUB_SHA to its tip. The job
# checks that, checks out exactly GITHUB_SHA (the authority), installs the
# codeflow version the authority pins in .codeflow/project.toml
# (`scaffold_version`), verified against the archive digests pinned beside it
# ([scaffold_sha256]) and the release's published sha256.sum (SPC-013
# R-113), and judges with the authority's policy, never the target's. The
# pull request's base and head are fetched only as git data and never run.
# After every step the job asserts that the checkout is still the authority.
# The verdict job's token is read-only and the job uses no secret; only the
# `authority` job below holds one. Builds and tests of the head run in
# codeflow-ci.yml on `pull_request`.
#
# `codeflow ci` runs the SAME commit-format, no-AI-attribution, no-emoji,
# breaking-footer, branch-naming and PR-body checks as the git hooks and the
# Claude git-guard, reading the authority's .codeflow/policy.json (CodeFlow
# ADR-0017, ADR-0091). `edited` reruns it when the PR body changes. Trusted
# automation profiles (git.automation_profiles) apply only for the actor
# passed here, and never on a fork pull request.
#
# The verdict job is also the enforcing check of the shared id registry for
# the pull request (SPC-013 R-14, R-20, R-109; ADR-0072); with durable work
# tracking off, `codeflow ids check` passes with a note. This workflow has
# no other trigger: pushes, the schedule and manual runs check the registry
# in codeflow-registry.yml, so they create no check under a `trusted:` name,
# not even a skipped one, which GitHub would count as passing.
#
# Pull request runs share one concurrency group per pull request, and no
# event cancels or replaces a run: `cancel-in-progress` is false and
# `queue: max` keeps every pending run, so a push followed by a body edit
# seconds later leaves both runs to finish and the push's required "commit
# standards" check completed, never cancelled. (`cancel-in-progress: false`
# alone is not enough: the default queue holds one pending run and cancels
# it when a newer one arrives.) Limits: a group queues at most 100 runs, and
# a run that arrives past that is cancelled, so the newest push fails closed
# until the check is re-run; `queue` is a 2026 key that some linters reject
# (actionlint releases up to 1.7.12), so ignore that message in the linter's
# configuration rather than removing the key.
#
# Merge admission starts when codeflow-ci completes (TSK-1239): the commit
# standards job never waits for that run, and codeflow-admission.yml, on
# `workflow_run` completed, re-runs this job for the run's pull request.
# That workflow joins this concurrency group (`codeflow-policy-pr-<n>`) with
# the same `queue: max`, so it starts only after a policy run in progress
# ends, and the re-run it requests waits behind it. It writes no check: the
# native job here stays the only producer of `commit standards`.
#
# The event pins the head and the base commit: the job fetches both as data
# and refuses a head that is not the event's. Only the body comes from the
# API, read when the job runs, so a queued run can judge a newer body than
# its event. The job's last read of the pull request, after the checks, fails
# the run, with its own message, when the head, the base branch or the body
# differs from what the run judged; the run queued by that change decides. It
# fails closed when that read fails. A change made after that last read,
# before the run ends, is judged by the run that change queued.
# The body is logged as a sha256 digest, never as text: it is written to a
# file in the runner's temp directory and handed to `codeflow ci` as a file,
# never through `env:` or an argument, because the runner prints a step's
# `env:` values in its log. Each run makes two API reads on the job's token.
#
# Each verdict job, just before its last read, refuses another producer of
# a trusted name that is on the head at that moment: a check run of that
# name from another workflow, event or app, or a commit status of a trusted
# or authority name (Mode B). Mode B is a lower tier: it does not close forgery by a later
# producer. GitHub takes the newest check run of a name, so a workflow that
# runs after the verdict job, for example on an event this file does not
# run on, can still satisfy a trusted: name pinned to GitHub Actions. Only
# Mode A closes it: for a pull request into the default branch, the
# `authority` job creates the `authority:` checks with a GitHub App held in
# the environment `codeflow-authority`, concluded from the verdict jobs,
# and ruleset B pins those names to the App. Without the App it creates
# none (ADR-0091, TSK-1177).
#
# This repository's copy: CodeFlow is its own first consumer, so the verdict
# jobs run the authority's own build in place of the pinned release (the
# binary a push to the default branch saved and attested, used only when
# its attestation verifies and rebuilt otherwise; these jobs never save a
# cache), and
# a second verdict job, `trusted: release impact`, runs scripts/release.py
# check-pr from the authority with the authority's binary, the pull request
# body and its range as data. That job reads, logs and rechecks the body as the
# commit standards job does, with its own two API reads. `codeflow update` keeps
# it as a user-modified file.
name: codeflow-policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) }}
  cancel-in-progress: false
  queue: max

jobs:
  commit-lint:
    name: "commit standards"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Read access to pull requests serves the body step, read access to
    # actions the merge admission, and read access to actions, checks and
    # statuses the last step, which looks for another producer of a trusted
    # name; the token stays read-only.
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
      statuses: read
    steps:
      # The authority is the default branch at the one commit this run was
      # started for. A run whose ref is not the default branch (an older
      # host's pull_request_target semantics, or any other event) fails
      # closed rather than judge with another branch's code.
      - name: Resolve the authority
        env:
          EVENT: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request_target ] || [ -z "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "::error::this run is for ${GITHUB_REF} on ${EVENT}, not the default branch ${DEFAULT_BRANCH:-(unknown)} on pull_request_target; nothing is judged"; exit 1
          fi
          if ! printf '%s\n' "$AUTHORITY_SHA" | grep -Eqx '[0-9a-f]{40}'; then
            echo "::error::the run's commit '${AUTHORITY_SHA}' is not a full commit id; nothing is judged"; exit 1
          fi
          echo "judged by ${DEFAULT_BRANCH}@${AUTHORITY_SHA}" | tee -a "$GITHUB_STEP_SUMMARY"

      # The authority, never the pull request's head or its target. The
      # binary, the pin and the policy all come from this checkout.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      # This repository IS codeflow, so it builds the authority's own source
      # instead of installing a pinned release. The pull request's base and
      # head are never checked out or built. The toolchain is pinned in the
      # authority's rust-toolchain.toml.
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      # The cache key names the default branch's exact commit and the build
      # environment. It is computed from this checkout before any pull
      # request data is fetched, so nothing a pull request controls reaches
      # it.
      - name: Identify the authority build
        id: authority-build
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          [ "$sha" = "$AUTHORITY_SHA" ]
          git diff --quiet
          git diff --cached --quiet
          identity=$({
            rustc -vV
            cargo -V
            cc --version
            printf '%s\n' "${ImageOS:?}" "${ImageVersion:?}" "${RUNNER_ARCH:?}"
            printf '%s\n' "${RUSTFLAGS-}" "${CARGO_ENCODED_RUSTFLAGS-}" "${CC-}" "${CFLAGS-}" "${LDFLAGS-}"
          } | sha256sum | cut -d ' ' -f 1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "key=codeflow-policy-main-binary-v3-$sha-$identity" >> "$GITHUB_OUTPUT"

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      # The limit of this design: the attestation covers the bytes that run, and
      # nothing else. actions/cache extracts an archive (tar -P) before any
      # check can run, so restoring an entry is not made safe by it; the
      # restore goes to a fresh directory off PATH and is deleted unless the
      # attestation verifies. On a miss the job builds with the dependency
      # cache restored from the default branch's scope, whose trust is its
      # single writer (codeflow-registry.yml, job cache-main-build).
      # Read only: a verdict run restores the binary that a push to the
      # default branch saved and attested (codeflow-registry.yml, job
      # cache-main-build). The exact key only; no fallback key and no save.
      - name: Restore the authority binary
        id: authority-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/codeflow-main-binary
          key: ${{ steps.authority-build.outputs.key }}

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      # The restored file is used only when its attestation verifies against
      # the default branch's workflow identity and commit, and it then reports
      # the authority's commit and a clean tree. Anything else deletes the
      # restored directory and the job builds.
      - name: Verify the authority binary
        id: authority-verify
        env:
          AUTHORITY_SHA: ${{ github.sha }}
          CACHE_HIT: ${{ steps.authority-cache.outputs.cache-hit }}
          BINARY_DIR: ${{ runner.temp }}/codeflow-main-binary
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          binary="$BINARY_DIR/codeflow"
          verified=false
          if [ "$CACHE_HIT" = true ]; then
            if [ -f "$binary" ] && [ ! -L "$binary" ] && [ -x "$binary" ] \
              && timeout 60 gh attestation verify "$binary" \
                --repo "$GITHUB_REPOSITORY" \
                --cert-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/codeflow-registry.yml@refs/heads/main" \
                --source-ref refs/heads/main \
                --source-digest "$AUTHORITY_SHA" \
                --signer-digest "$AUTHORITY_SHA" \
                --deny-self-hosted-runners > /dev/null \
              && version=$(timeout 30 env -i "$binary" --version) \
              && [[ "$version" =~ ^codeflow\ [^[:space:]]+\ source=$AUTHORITY_SHA\ dirty=false\ inputs=[0-9a-f]+$ ]]; then
              verified=true
            else
              echo "::warning::the cache entry for $AUTHORITY_SHA did not verify; deleting it from this job and building instead"
            fi
          fi
          if [ "$verified" = true ]; then
            mkdir -p target/release
            cp "$binary" target/release/codeflow
            echo "${GITHUB_WORKSPACE}/target/release" >> "$GITHUB_PATH"
          else
            rm -rf "$BINARY_DIR"
          fi
          echo "verified=$verified" >> "$GITHUB_OUTPUT"

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.authority-verify.outputs.verified != 'true'
        with:
          prefix-key: codeflow-policy-main-deps-v3
          shared-key: authority
          save-if: false

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      - name: Build the authority binary
        if: steps.authority-verify.outputs.verified != 'true'
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo build --release --locked -p codeflow-cli
          version=$(target/release/codeflow --version)
          if ! [[ "$version" =~ ^codeflow\ [^[:space:]]+\ source=$AUTHORITY_SHA\ dirty=false\ inputs=[0-9a-f]+$ ]]; then
            echo "::error::the rebuilt authority binary does not report $AUTHORITY_SHA with a clean tree"; exit 1
          fi
          echo "${GITHUB_WORKSPACE}/target/release" >> "$GITHUB_PATH"

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      # The base and the head are git data: fetched to refs, never checked
      # out or run. Each must be the commit the event names.
      - name: Fetch the pull request's base and head as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/codeflow/pr-head"
          fetched=$(git rev-parse refs/codeflow/pr-head)
          if [ "$fetched" != "$HEAD_SHA" ]; then
            echo "::error::the pull request head moved (${fetched}, event ${HEAD_SHA}); this run belongs to an older event, so it fails; re-run the check for the current head"; exit 1
          fi
          git fetch --no-tags origin "+${BASE_SHA}:refs/codeflow/pr-base"
          if [ "$(git rev-parse refs/codeflow/pr-base)" != "$BASE_SHA" ]; then
            echo "::error::cannot fetch the pull request's base ${BASE_SHA}; nothing is judged"; exit 1
          fi

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      # The body is read when the job runs, never taken from the event. An
      # event carries the body as it was when the event fired, and a run can
      # start long after that (one that waited in the queue, one delivered
      # late, or a re-run), so only the current body is the newest.
      # The text is written to a file in the runner's temp directory, never to
      # a step output, an `env:` value or an argument, so it cannot reach the
      # log. The path is fixed (`pr-body.md` in the runner's temp directory)
      # and the step's only output is the file's sha256 digest.
      - name: Read the pull request's current body
        id: body
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 60 \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" -o "${RUNNER_TEMP}/pull.json"
          jq -r '.body // ""' "${RUNNER_TEMP}/pull.json" > "${RUNNER_TEMP}/pr-body.md"
          # The body is logged as a digest of the file's bytes, never as
          # text; the last read compares a new digest with this one.
          if command -v sha256sum >/dev/null 2>&1; then
            digest=$(sha256sum "${RUNNER_TEMP}/pr-body.md" | cut -d ' ' -f 1)
          else
            digest=$(shasum -a 256 "${RUNNER_TEMP}/pr-body.md" | cut -d ' ' -f 1)
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "pull request body judged: sha256 ${digest}"

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      # The host's rules for the default branch, read with the read-only
      # token for the report's authority line and nothing else. A failure
      # here leaves the line saying the rules are unreadable and never
      # changes the verdict (TSK-1177 AC-2).
      - name: Read the host rules for the authority line
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          umask 077
          dir=$(mktemp -d "${RUNNER_TEMP}/codeflow-rules.XXXXXX")
          printf 'Authorization: Bearer %s\nAccept: application/vnd.github+json\nX-GitHub-Api-Version: 2022-11-28\n' "$GH_TOKEN" > "${dir}/headers"
          branch=$(jq -rn --arg v "$DEFAULT_BRANCH" '$v | @uri')
          out="${RUNNER_TEMP}/codeflow-host-rules.json"
          if curl -fsS --retry 3 --max-time 60 -H @"${dir}/headers" -o "${dir}/rules.json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/rules/branches/${branch}?per_page=100" \
            && curl -fsS --retry 3 --max-time 60 -H @"${dir}/headers" -o "${dir}/rulesets.json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/rulesets?includes_parents=true&per_page=100" \
            && jq -n --arg branch "$DEFAULT_BRANCH" --arg sha "$AUTHORITY_SHA" \
              --slurpfile rules "${dir}/rules.json" --slurpfile rulesets "${dir}/rulesets.json" \
              '{branch: $branch, authority: $sha, rules: $rules[0], rulesets: $rulesets[0]}' > "$out"; then
            echo "host rules read for ${DEFAULT_BRANCH}"
          else
            jq -n --arg branch "$DEFAULT_BRANCH" --arg sha "$AUTHORITY_SHA" \
              '{branch: $branch, authority: $sha, unreadable: "the host rules could not be read with this token"}' > "$out"
            echo "::warning::the host rules for ${DEFAULT_BRANCH} could not be read; the report's authority line says so and the verdict is unchanged"
          fi
          rm -rf "$dir"

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      # The PR body reaches `codeflow ci` as a file, never interpolated into
      # the script and never through `env:` (the runner logs those values), so
      # an untrusted body can neither inject shell nor reach the log. The
      # policy and the work-record baseline are the authority's
      # (--policy-from, --baseline-from), never the target's.
      - name: codeflow ci (commit + branch + PR-body standards)
        env:
          AUTHORITY_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BODY_FILE: ${{ runner.temp }}/pr-body.md
          ACTOR: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor || 'unknown' }}
          CODEFLOW_HOST_RULES: ${{ runner.temp }}/codeflow-host-rules.json
        # The authority must carry its policy: judging with defaults where it
        # has none would pass what the project never chose (TSK-336).
        run: |
          if ! git cat-file -e "${AUTHORITY_SHA}:.codeflow/policy.json" 2>/dev/null; then
            echo "::error::the default branch at ${AUTHORITY_SHA} has no .codeflow/policy.json, so nothing is judged; land the policy on the default branch first (the adoption pull request that adds it fails this check by design)"
            exit 1
          fi
          codeflow ci --base "$BASE_SHA" --head "$HEAD_SHA" --branch "$HEAD_REF" --actor "$ACTOR" --policy-from "$AUTHORITY_SHA" --baseline-from "$AUTHORITY_SHA" --pr-body-file "$BODY_FILE"

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      # The registry is fetched explicitly with full history, never forced
      # (R-20).
      - name: Fetch the shared registry
        run: |
          if git ls-remote --exit-code --heads origin codeflow/registry >/dev/null; then
            git fetch --no-tags origin refs/heads/codeflow/registry:refs/remotes/origin/codeflow/registry
          else
            echo "codeflow/registry is not on origin; the check reports it when records are tracked"
          fi

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      - name: codeflow ids check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: codeflow ids check --base "$BASE_SHA" --head refs/codeflow/pr-head

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      # Merge admission (TSK-449 AC-6, TSK-1239). A draft's codeflow-ci
      # verdicts are skipped, which a required-check rule reads as passing,
      # so this required check passes only when the pull request is open,
      # ready, at this head and on this target, the newest codeflow-ci
      # pull_request run at exactly this head completed with success and
      # both verdicts succeeded, and the pull request was not retargeted
      # after that run was created. It judges once and never waits: a run
      # still pending refuses at once, and when that run completes,
      # codeflow-admission.yml re-runs this job, which then judges the
      # completed run, so no runner is held while codeflow-ci runs. A draft,
      # a cancelled or failed run, a run only for another head or pull
      # request, a skipped verdict, a retarget and any API error refuse.
      # The script comes from the authority checkout above, never from the
      # pull request or its target.
      - name: the exact head's ready codeflow-ci run passed
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          python3 -I scripts/policy-admission.py admit --repo "$REPOSITORY" --head "$HEAD_SHA" --pull "$PR_NUMBER" \
            --base "$BASE_REF" --workflow .github/workflows/codeflow-ci.yml --require "codeflow gates" --require windows

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      # Just before the last read, this step refuses another producer of a
      # trusted name that is on the head when it runs (ADR-0091, Mode B). It reads once: a producer
      # that runs later is not seen, and GitHub takes the newest check run
      # of a name, so Mode B does not close forgery by a later producer;
      # only Mode A, the App authority, does.
      # A check run of a trusted name counts only when GitHub Actions
      # created it in a pull_request_target run of this workflow's own path,
      # which only the default branch's file can start. A job of that name
      # in another workflow or event (skipped, sleeping or built from an
      # expression), a check run from any other app and any commit status
      # of a trusted or authority name fail this job, and so does an API
      # error (TSK-1177 AC-1).
      - name: Refuse another producer of a trusted name
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TRUSTED_NAMES: |
            commit standards
            trusted: release impact
        run: |
          set -euo pipefail
          umask 077
          if ! printf '%s\n' "$HEAD_SHA" | grep -Eqx '[0-9a-f]{40}'; then
            echo "::error::the pull request head '${HEAD_SHA}' is not a full commit id; nothing is judged"; exit 1
          fi
          work=$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/codeflow-producers.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          printf 'Authorization: Bearer %s\nAccept: application/vnd.github+json\nX-GitHub-Api-Version: 2022-11-28\n' "$GH_TOKEN" > "${work}/headers"
          api() { curl -fsS --retry 3 --max-time 60 -H @"${work}/headers" "$@"; }
          repo="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          workflow=${GITHUB_WORKFLOW_REF#"${GITHUB_REPOSITORY}/"}
          workflow=${workflow%%@*}
          found=0
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            encoded=$(jq -rn --arg v "$name" '$v | @uri')
            page=1
            while :; do
              api "${repo}/commits/${HEAD_SHA}/check-runs?check_name=${encoded}&filter=all&per_page=100&page=${page}" > "${work}/runs.json"
              count=$(jq -e '.check_runs | if type == "array" then length else error("no check_runs list") end' "${work}/runs.json")
              jq -r '.check_runs[] | [(.id | tostring), (.app.id // 0 | tostring), (.check_suite.id // 0 | tostring)] | @tsv' "${work}/runs.json" > "${work}/runs.tsv"
              while IFS=$'\t' read -r id app suite; do
                why=
                if [ "$app" != 15368 ]; then
                  why="app ${app} created it, not GitHub Actions"
                else
                  case "$suite" in
                    '' | *[!0-9]*) echo "::error::check run ${id} names no readable check suite"; exit 1 ;;
                  esac
                  if [ ! -f "${work}/suite-${suite}" ]; then
                    api "${repo}/actions/runs?check_suite_id=${suite}&per_page=1" > "${work}/suite.json"
                    jq -r 'def clean: gsub("[^ -~]"; "?"); [(.workflow_runs[0].event // "(no run)" | clean), (.workflow_runs[0].path // "(no run)" | clean)] | @tsv' "${work}/suite.json" > "${work}/suite-${suite}"
                  fi
                  IFS=$'\t' read -r event path < "${work}/suite-${suite}"
                  if [ "$event" != pull_request_target ] || [ "$path" != "$workflow" ]; then
                    why="a ${event} run of ${path} created it, not a pull_request_target run of ${workflow}"
                  fi
                fi
                if [ -n "$why" ]; then
                  echo "::error::check run ${id} named '${name}' is on ${HEAD_SHA}: ${why}"
                  found=1
                fi
              done < "${work}/runs.tsv"
              [ "$count" -ge 100 ] || break
              page=$((page + 1))
            done
          done <<< "$TRUSTED_NAMES"
          page=1
          while :; do
            api "${repo}/commits/${HEAD_SHA}/statuses?per_page=100&page=${page}" > "${work}/statuses.json"
            count=$(jq -e 'if type == "array" then length else error("not a list of statuses") end' "${work}/statuses.json")
            jq -r --arg names "$TRUSTED_NAMES" 'def clean: gsub("[^ -~]"; "?");
              ($names | split("\n") | map(select(length > 0))) as $trusted
              | ($trusted + ($trusted | map("authority: " + ltrimstr("trusted: ")))) as $all
              | .[] | select(.context as $c | any($all[]; . == $c))
              | [(.id | tostring), (.context | clean), (.state // "?" | clean), (.creator.login // "?" | clean)] | @tsv' "${work}/statuses.json" > "${work}/statuses.tsv"
            while IFS=$'\t' read -r id context state creator; do
              echo "::error::commit status ${id} named '${context}' (${state}, set by ${creator}) is on ${HEAD_SHA}; no status may carry a trusted or authority name"
              found=1
            done < "${work}/statuses.tsv"
            [ "$count" -ge 100 ] || break
            page=$((page + 1))
          done
          if [ "$found" -ne 0 ]; then
            echo "::error::another producer of a trusted name is on ${HEAD_SHA}, so this check fails; remove the workflow, job or status that produced it, then add a new commit to the pull request, since a re-run on this head reads the same check runs and fails again"
            exit 1
          fi
          echo "no other producer of a trusted or authority name is on ${HEAD_SHA} now; Mode B does not see one that runs later"

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      # The last read. The run judged the head, base branch and body it read
      # above; if any changed while it ran, this run fails with its own
      # message and the run queued by that change decides. The base commit is
      # not compared, since a push to the base branch fires no pull request
      # event. A failed or unreadable read fails the run, never passes it.
      - name: the pull request is unchanged since it was judged
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          JUDGED_HEAD: ${{ github.event.pull_request.head.sha }}
          JUDGED_BASE: ${{ github.event.pull_request.base.ref }}
          JUDGED_DIGEST: ${{ steps.body.outputs.digest }}
        run: |
          set -euo pipefail
          if ! curl -fsSL --retry 3 --max-time 60 \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" -o "${RUNNER_TEMP}/pull-after.json"; then
            echo "::error::cannot read the pull request again, so this run cannot show that what it judged is current; it fails closed; re-run the check"; exit 1
          fi
          if ! head=$(jq -er '.head.sha' "${RUNNER_TEMP}/pull-after.json") \
            || ! base=$(jq -er '.base.ref' "${RUNNER_TEMP}/pull-after.json") \
            || ! body=$(jq -r '.body // ""' "${RUNNER_TEMP}/pull-after.json" | { sha256sum 2>/dev/null || shasum -a 256; } | cut -d ' ' -f 1); then
            echo "::error::the pull request read at the end of this run is unreadable, so this run fails closed; re-run the check"; exit 1
          fi
          if [ -z "$JUDGED_DIGEST" ]; then
            echo "::error::this run recorded no body digest, so it cannot show that the body is unchanged; it fails closed; re-run the check"; exit 1
          fi
          if [ "$head" != "$JUDGED_HEAD" ]; then
            echo "::error::the pull request head changed while this run judged it (judged ${JUDGED_HEAD}, now ${head}); the run queued by the new head decides"; exit 1
          fi
          if [ "$base" != "$JUDGED_BASE" ]; then
            echo "::error::the pull request base branch changed while this run judged it (judged ${JUDGED_BASE}, now ${base}); the run queued by that change decides"; exit 1
          fi
          if [ "$body" != "$JUDGED_DIGEST" ]; then
            echo "::error::the pull request body changed while this run judged it (judged sha256 ${JUDGED_DIGEST}, now ${body}); the run queued by that edit decides"; exit 1
          fi
          echo "the pull request head, base branch and body are unchanged since this run judged them"

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

  # The release-impact verdict (ADR-0062, SPC-013 R-94): the pull request's
  # declared impact against the proposed merge tree and the host's
  # published state, judged by scripts/release.py and the codeflow built
  # from the authority, with the body, the base and the head as data. The
  # head-built `release impact` job in codeflow-release.yml stays until the
  # last change before main removes it (TSK-336 AC-9, amended 2026-11-03).
  release-impact:
    name: "trusted: release impact"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Read access to pull requests serves the body step; the read-only
    # token also reads the host's published releases, and actions, checks
    # and statuses for the last step.
    permissions:
      contents: read
      pull-requests: read
      actions: read
      checks: read
      statuses: read
    steps:
      # The authority is the default branch at the one commit this run was
      # started for. A run whose ref is not the default branch (an older
      # host's pull_request_target semantics, or any other event) fails
      # closed rather than judge with another branch's code.
      - name: Resolve the authority
        env:
          EVENT: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request_target ] || [ -z "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "::error::this run is for ${GITHUB_REF} on ${EVENT}, not the default branch ${DEFAULT_BRANCH:-(unknown)} on pull_request_target; nothing is judged"; exit 1
          fi
          if ! printf '%s\n' "$AUTHORITY_SHA" | grep -Eqx '[0-9a-f]{40}'; then
            echo "::error::the run's commit '${AUTHORITY_SHA}' is not a full commit id; nothing is judged"; exit 1
          fi
          echo "judged by ${DEFAULT_BRANCH}@${AUTHORITY_SHA}" | tee -a "$GITHUB_STEP_SUMMARY"

      # The authority, never the pull request's head or its target. The
      # binary, the pin and the policy all come from this checkout.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      # This repository IS codeflow, so it builds the authority's own source
      # instead of installing a pinned release. The pull request's base and
      # head are never checked out or built. The toolchain is pinned in the
      # authority's rust-toolchain.toml.
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      # The cache key names the default branch's exact commit and the build
      # environment. It is computed from this checkout before any pull
      # request data is fetched, so nothing a pull request controls reaches
      # it.
      - name: Identify the authority build
        id: authority-build
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse HEAD)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]]
          [ "$sha" = "$AUTHORITY_SHA" ]
          git diff --quiet
          git diff --cached --quiet
          identity=$({
            rustc -vV
            cargo -V
            cc --version
            printf '%s\n' "${ImageOS:?}" "${ImageVersion:?}" "${RUNNER_ARCH:?}"
            printf '%s\n' "${RUSTFLAGS-}" "${CARGO_ENCODED_RUSTFLAGS-}" "${CC-}" "${CFLAGS-}" "${LDFLAGS-}"
          } | sha256sum | cut -d ' ' -f 1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "key=codeflow-policy-main-binary-v3-$sha-$identity" >> "$GITHUB_OUTPUT"

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      # The limit of this design: the attestation covers the bytes that run, and
      # nothing else. actions/cache extracts an archive (tar -P) before any
      # check can run, so restoring an entry is not made safe by it; the
      # restore goes to a fresh directory off PATH and is deleted unless the
      # attestation verifies. On a miss the job builds with the dependency
      # cache restored from the default branch's scope, whose trust is its
      # single writer (codeflow-registry.yml, job cache-main-build).
      # Read only: a verdict run restores the binary that a push to the
      # default branch saved and attested (codeflow-registry.yml, job
      # cache-main-build). The exact key only; no fallback key and no save.
      - name: Restore the authority binary
        id: authority-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/codeflow-main-binary
          key: ${{ steps.authority-build.outputs.key }}

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      # The restored file is used only when its attestation verifies against
      # the default branch's workflow identity and commit, and it then reports
      # the authority's commit and a clean tree. Anything else deletes the
      # restored directory and the job builds.
      - name: Verify the authority binary
        id: authority-verify
        env:
          AUTHORITY_SHA: ${{ github.sha }}
          CACHE_HIT: ${{ steps.authority-cache.outputs.cache-hit }}
          BINARY_DIR: ${{ runner.temp }}/codeflow-main-binary
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          binary="$BINARY_DIR/codeflow"
          verified=false
          if [ "$CACHE_HIT" = true ]; then
            if [ -f "$binary" ] && [ ! -L "$binary" ] && [ -x "$binary" ] \
              && timeout 60 gh attestation verify "$binary" \
                --repo "$GITHUB_REPOSITORY" \
                --cert-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/codeflow-registry.yml@refs/heads/main" \
                --source-ref refs/heads/main \
                --source-digest "$AUTHORITY_SHA" \
                --signer-digest "$AUTHORITY_SHA" \
                --deny-self-hosted-runners > /dev/null \
              && version=$(timeout 30 env -i "$binary" --version) \
              && [[ "$version" =~ ^codeflow\ [^[:space:]]+\ source=$AUTHORITY_SHA\ dirty=false\ inputs=[0-9a-f]+$ ]]; then
              verified=true
            else
              echo "::warning::the cache entry for $AUTHORITY_SHA did not verify; deleting it from this job and building instead"
            fi
          fi
          if [ "$verified" = true ]; then
            mkdir -p target/release
            cp "$binary" target/release/codeflow
            echo "${GITHUB_WORKSPACE}/target/release" >> "$GITHUB_PATH"
          else
            rm -rf "$BINARY_DIR"
          fi
          echo "verified=$verified" >> "$GITHUB_OUTPUT"

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: steps.authority-verify.outputs.verified != 'true'
        with:
          prefix-key: codeflow-policy-main-deps-v3
          shared-key: authority
          save-if: false

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      - name: Build the authority binary
        if: steps.authority-verify.outputs.verified != 'true'
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cargo build --release --locked -p codeflow-cli
          version=$(target/release/codeflow --version)
          if ! [[ "$version" =~ ^codeflow\ [^[:space:]]+\ source=$AUTHORITY_SHA\ dirty=false\ inputs=[0-9a-f]+$ ]]; then
            echo "::error::the rebuilt authority binary does not report $AUTHORITY_SHA with a clean tree"; exit 1
          fi
          echo "${GITHUB_WORKSPACE}/target/release" >> "$GITHUB_PATH"

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      # The base and the head are git data: fetched to refs, never checked
      # out or run. Each must be the commit the event names.
      - name: Fetch the pull request's base and head as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/codeflow/pr-head"
          fetched=$(git rev-parse refs/codeflow/pr-head)
          if [ "$fetched" != "$HEAD_SHA" ]; then
            echo "::error::the pull request head moved (${fetched}, event ${HEAD_SHA}); this run belongs to an older event, so it fails; re-run the check for the current head"; exit 1
          fi
          git fetch --no-tags origin "+${BASE_SHA}:refs/codeflow/pr-base"
          if [ "$(git rev-parse refs/codeflow/pr-base)" != "$BASE_SHA" ]; then
            echo "::error::cannot fetch the pull request's base ${BASE_SHA}; nothing is judged"; exit 1
          fi

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      - name: Fetch the pull request's target as data
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      # The body is read when the job runs, never taken from the event. An
      # event carries the body as it was when the event fired, and a run can
      # start long after that (one that waited in the queue, one delivered
      # late, or a re-run), so only the current body is the newest.
      # The text is written to a file in the runner's temp directory, never to
      # a step output, an `env:` value or an argument, so it cannot reach the
      # log. The path is fixed (`pr-body.md` in the runner's temp directory)
      # and the step's only output is the file's sha256 digest.
      - name: Read the pull request's current body
        id: body
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 60 \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" -o "${RUNNER_TEMP}/pull.json"
          jq -r '.body // ""' "${RUNNER_TEMP}/pull.json" > "${RUNNER_TEMP}/pr-body.md"
          # The body is logged as a digest of the file's bytes, never as
          # text; the last read compares a new digest with this one.
          if command -v sha256sum >/dev/null 2>&1; then
            digest=$(sha256sum "${RUNNER_TEMP}/pr-body.md" | cut -d ' ' -f 1)
          else
            digest=$(shasum -a 256 "${RUNNER_TEMP}/pr-body.md" | cut -d ' ' -f 1)
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "pull request body judged: sha256 ${digest}"

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      # The PR body reaches the script as a file, never interpolated into the
      # script and never through `env:` (the runner logs those values), so an
      # untrusted body can neither inject shell nor reach the log.
      - name: Validate reviewed release intent
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BODY_FILE: ${{ runner.temp }}/pr-body.md
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I scripts/release.py check-pr \
            --base "$BASE_SHA" --head "$HEAD_SHA" \
            --target-ref "origin/$BASE_REF" --body-file "$BODY_FILE" \
            --codeflow-bin target/release/codeflow

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      # Just before the last read, this step refuses another producer of a
      # trusted name that is on the head when it runs (ADR-0091, Mode B). It reads once: a producer
      # that runs later is not seen, and GitHub takes the newest check run
      # of a name, so Mode B does not close forgery by a later producer;
      # only Mode A, the App authority, does.
      # A check run of a trusted name counts only when GitHub Actions
      # created it in a pull_request_target run of this workflow's own path,
      # which only the default branch's file can start. A job of that name
      # in another workflow or event (skipped, sleeping or built from an
      # expression), a check run from any other app and any commit status
      # of a trusted or authority name fail this job, and so does an API
      # error (TSK-1177 AC-1).
      - name: Refuse another producer of a trusted name
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TRUSTED_NAMES: |
            commit standards
            trusted: release impact
        run: |
          set -euo pipefail
          umask 077
          if ! printf '%s\n' "$HEAD_SHA" | grep -Eqx '[0-9a-f]{40}'; then
            echo "::error::the pull request head '${HEAD_SHA}' is not a full commit id; nothing is judged"; exit 1
          fi
          work=$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/codeflow-producers.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          printf 'Authorization: Bearer %s\nAccept: application/vnd.github+json\nX-GitHub-Api-Version: 2022-11-28\n' "$GH_TOKEN" > "${work}/headers"
          api() { curl -fsS --retry 3 --max-time 60 -H @"${work}/headers" "$@"; }
          repo="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          workflow=${GITHUB_WORKFLOW_REF#"${GITHUB_REPOSITORY}/"}
          workflow=${workflow%%@*}
          found=0
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            encoded=$(jq -rn --arg v "$name" '$v | @uri')
            page=1
            while :; do
              api "${repo}/commits/${HEAD_SHA}/check-runs?check_name=${encoded}&filter=all&per_page=100&page=${page}" > "${work}/runs.json"
              count=$(jq -e '.check_runs | if type == "array" then length else error("no check_runs list") end' "${work}/runs.json")
              jq -r '.check_runs[] | [(.id | tostring), (.app.id // 0 | tostring), (.check_suite.id // 0 | tostring)] | @tsv' "${work}/runs.json" > "${work}/runs.tsv"
              while IFS=$'\t' read -r id app suite; do
                why=
                if [ "$app" != 15368 ]; then
                  why="app ${app} created it, not GitHub Actions"
                else
                  case "$suite" in
                    '' | *[!0-9]*) echo "::error::check run ${id} names no readable check suite"; exit 1 ;;
                  esac
                  if [ ! -f "${work}/suite-${suite}" ]; then
                    api "${repo}/actions/runs?check_suite_id=${suite}&per_page=1" > "${work}/suite.json"
                    jq -r 'def clean: gsub("[^ -~]"; "?"); [(.workflow_runs[0].event // "(no run)" | clean), (.workflow_runs[0].path // "(no run)" | clean)] | @tsv' "${work}/suite.json" > "${work}/suite-${suite}"
                  fi
                  IFS=$'\t' read -r event path < "${work}/suite-${suite}"
                  if [ "$event" != pull_request_target ] || [ "$path" != "$workflow" ]; then
                    why="a ${event} run of ${path} created it, not a pull_request_target run of ${workflow}"
                  fi
                fi
                if [ -n "$why" ]; then
                  echo "::error::check run ${id} named '${name}' is on ${HEAD_SHA}: ${why}"
                  found=1
                fi
              done < "${work}/runs.tsv"
              [ "$count" -ge 100 ] || break
              page=$((page + 1))
            done
          done <<< "$TRUSTED_NAMES"
          page=1
          while :; do
            api "${repo}/commits/${HEAD_SHA}/statuses?per_page=100&page=${page}" > "${work}/statuses.json"
            count=$(jq -e 'if type == "array" then length else error("not a list of statuses") end' "${work}/statuses.json")
            jq -r --arg names "$TRUSTED_NAMES" 'def clean: gsub("[^ -~]"; "?");
              ($names | split("\n") | map(select(length > 0))) as $trusted
              | ($trusted + ($trusted | map("authority: " + ltrimstr("trusted: ")))) as $all
              | .[] | select(.context as $c | any($all[]; . == $c))
              | [(.id | tostring), (.context | clean), (.state // "?" | clean), (.creator.login // "?" | clean)] | @tsv' "${work}/statuses.json" > "${work}/statuses.tsv"
            while IFS=$'\t' read -r id context state creator; do
              echo "::error::commit status ${id} named '${context}' (${state}, set by ${creator}) is on ${HEAD_SHA}; no status may carry a trusted or authority name"
              found=1
            done < "${work}/statuses.tsv"
            [ "$count" -ge 100 ] || break
            page=$((page + 1))
          done
          if [ "$found" -ne 0 ]; then
            echo "::error::another producer of a trusted name is on ${HEAD_SHA}, so this check fails; remove the workflow, job or status that produced it, then add a new commit to the pull request, since a re-run on this head reads the same check runs and fails again"
            exit 1
          fi
          echo "no other producer of a trusted or authority name is on ${HEAD_SHA} now; Mode B does not see one that runs later"

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      # The last read, as in the commit standards job: this job read the body
      # and judged the event's head and base branch, so it fails when any of
      # them changed while it ran, and the run queued by that change decides.
      - name: the pull request is unchanged since it was judged
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          JUDGED_HEAD: ${{ github.event.pull_request.head.sha }}
          JUDGED_BASE: ${{ github.event.pull_request.base.ref }}
          JUDGED_DIGEST: ${{ steps.body.outputs.digest }}
        run: |
          set -euo pipefail
          if ! curl -fsSL --retry 3 --max-time 60 \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" -o "${RUNNER_TEMP}/pull-after.json"; then
            echo "::error::cannot read the pull request again, so this run cannot show that what it judged is current; it fails closed; re-run the check"; exit 1
          fi
          if ! head=$(jq -er '.head.sha' "${RUNNER_TEMP}/pull-after.json") \
            || ! base=$(jq -er '.base.ref' "${RUNNER_TEMP}/pull-after.json") \
            || ! body=$(jq -r '.body // ""' "${RUNNER_TEMP}/pull-after.json" | { sha256sum 2>/dev/null || shasum -a 256; } | cut -d ' ' -f 1); then
            echo "::error::the pull request read at the end of this run is unreadable, so this run fails closed; re-run the check"; exit 1
          fi
          if [ -z "$JUDGED_DIGEST" ]; then
            echo "::error::this run recorded no body digest, so it cannot show that the body is unchanged; it fails closed; re-run the check"; exit 1
          fi
          if [ "$head" != "$JUDGED_HEAD" ]; then
            echo "::error::the pull request head changed while this run judged it (judged ${JUDGED_HEAD}, now ${head}); the run queued by the new head decides"; exit 1
          fi
          if [ "$base" != "$JUDGED_BASE" ]; then
            echo "::error::the pull request base branch changed while this run judged it (judged ${JUDGED_BASE}, now ${base}); the run queued by that change decides"; exit 1
          fi
          if [ "$body" != "$JUDGED_DIGEST" ]; then
            echo "::error::the pull request body changed while this run judged it (judged sha256 ${JUDGED_DIGEST}, now ${body}); the run queued by that edit decides"; exit 1
          fi
          echo "the pull request head, base branch and body are unchanged since this run judged them"

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

  # The authority job (ADR-0091 "Check identity", TSK-1177). It runs only
  # for a pull request into the default branch, after the verdict jobs, and
  # is the only job in the repository that references the environment
  # `codeflow-authority`, whose deployment-branch rule admits only the
  # default branch. It checks out nothing, runs no action and executes no
  # file from any branch; every event field reaches a script through `env:`.
  #
  # Mode A: with the App configured in that environment (the variable
  # CODEFLOW_AUTHORITY_APP_ID and the secret CODEFLOW_AUTHORITY_APP_KEY),
  # one step mints the App's installation token, masked, scoped to this
  # repository and Checks write, never an output, and revoked when the step
  # ends. It creates the `authority:` check runs on the head SHA
  # `in_progress`, then concludes each from its verdict job through
  # `needs`: success only when that job succeeded. Ruleset B pins the
  # `authority:` names to the App, so no workflow, and no token an agent
  # holds, can produce them.
  #
  # Mode B, the lower tier: with no App configured, the job creates no
  # check, and its refusal step reads the producers of the trusted names
  # once, as each verdict job's last step does. Mode B does not close
  # forgery by a later producer; only Mode A does.
  authority:
    name: authority checks
    needs: [commit-lint, release-impact]
    if: ${{ !cancelled() && github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == github.event.repository.default_branch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: codeflow-authority
    # The workflow token only reads, for the refusal step; the App token is
    # minted inside the step that creates the checks.
    permissions:
      actions: read
      checks: read
      statuses: read
    steps:
      - name: Resolve the authority
        env:
          EVENT: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          AUTHORITY_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request_target ] || [ -z "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ] || [ "$BASE_REF" != "$DEFAULT_BRANCH" ]; then
            echo "::error::this run is for ${GITHUB_REF} on ${EVENT} into ${BASE_REF}, not a pull request into the default branch ${DEFAULT_BRANCH:-(unknown)} on pull_request_target; no authority check is created"; exit 1
          fi
          for sha in "$AUTHORITY_SHA" "$HEAD_SHA"; do
            if ! printf '%s\n' "$sha" | grep -Eqx '[0-9a-f]{40}'; then
              echo "::error::'${sha}' is not a full commit id; no authority check is created"; exit 1
            fi
          done
          echo "judged by ${DEFAULT_BRANCH}@${AUTHORITY_SHA}" | tee -a "$GITHUB_STEP_SUMMARY"

      # Before any check is created, this job refuses another producer of a
      # trusted name that is on the head now (ADR-0091, Mode B), so in
      # Mode A a refusal leaves the authority: checks uncreated and the
      # merge blocked. It reads once: a producer that runs later is not
      # seen, so Mode B does not close forgery by a later producer; only
      # Mode A, the App authority, does.
      # A check run of a trusted name counts only when GitHub Actions
      # created it in a pull_request_target run of this workflow's own path,
      # which only the default branch's file can start. A job of that name
      # in another workflow or event (skipped, sleeping or built from an
      # expression), a check run from any other app and any commit status
      # of a trusted or authority name fail this job, and so does an API
      # error (TSK-1177 AC-1).
      - name: Refuse another producer of a trusted name
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TRUSTED_NAMES: |
            commit standards
            trusted: release impact
        run: |
          set -euo pipefail
          umask 077
          if ! printf '%s\n' "$HEAD_SHA" | grep -Eqx '[0-9a-f]{40}'; then
            echo "::error::the pull request head '${HEAD_SHA}' is not a full commit id; nothing is judged"; exit 1
          fi
          work=$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/codeflow-producers.XXXXXX")
          trap 'rm -rf "$work"' EXIT
          printf 'Authorization: Bearer %s\nAccept: application/vnd.github+json\nX-GitHub-Api-Version: 2022-11-28\n' "$GH_TOKEN" > "${work}/headers"
          api() { curl -fsS --retry 3 --max-time 60 -H @"${work}/headers" "$@"; }
          repo="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}"
          workflow=${GITHUB_WORKFLOW_REF#"${GITHUB_REPOSITORY}/"}
          workflow=${workflow%%@*}
          found=0
          while IFS= read -r name; do
            [ -n "$name" ] || continue
            encoded=$(jq -rn --arg v "$name" '$v | @uri')
            page=1
            while :; do
              api "${repo}/commits/${HEAD_SHA}/check-runs?check_name=${encoded}&filter=all&per_page=100&page=${page}" > "${work}/runs.json"
              count=$(jq -e '.check_runs | if type == "array" then length else error("no check_runs list") end' "${work}/runs.json")
              jq -r '.check_runs[] | [(.id | tostring), (.app.id // 0 | tostring), (.check_suite.id // 0 | tostring)] | @tsv' "${work}/runs.json" > "${work}/runs.tsv"
              while IFS=$'\t' read -r id app suite; do
                why=
                if [ "$app" != 15368 ]; then
                  why="app ${app} created it, not GitHub Actions"
                else
                  case "$suite" in
                    '' | *[!0-9]*) echo "::error::check run ${id} names no readable check suite"; exit 1 ;;
                  esac
                  if [ ! -f "${work}/suite-${suite}" ]; then
                    api "${repo}/actions/runs?check_suite_id=${suite}&per_page=1" > "${work}/suite.json"
                    jq -r 'def clean: gsub("[^ -~]"; "?"); [(.workflow_runs[0].event // "(no run)" | clean), (.workflow_runs[0].path // "(no run)" | clean)] | @tsv' "${work}/suite.json" > "${work}/suite-${suite}"
                  fi
                  IFS=$'\t' read -r event path < "${work}/suite-${suite}"
                  if [ "$event" != pull_request_target ] || [ "$path" != "$workflow" ]; then
                    why="a ${event} run of ${path} created it, not a pull_request_target run of ${workflow}"
                  fi
                fi
                if [ -n "$why" ]; then
                  echo "::error::check run ${id} named '${name}' is on ${HEAD_SHA}: ${why}"
                  found=1
                fi
              done < "${work}/runs.tsv"
              [ "$count" -ge 100 ] || break
              page=$((page + 1))
            done
          done <<< "$TRUSTED_NAMES"
          page=1
          while :; do
            api "${repo}/commits/${HEAD_SHA}/statuses?per_page=100&page=${page}" > "${work}/statuses.json"
            count=$(jq -e 'if type == "array" then length else error("not a list of statuses") end' "${work}/statuses.json")
            jq -r --arg names "$TRUSTED_NAMES" 'def clean: gsub("[^ -~]"; "?");
              ($names | split("\n") | map(select(length > 0))) as $trusted
              | ($trusted + ($trusted | map("authority: " + ltrimstr("trusted: ")))) as $all
              | .[] | select(.context as $c | any($all[]; . == $c))
              | [(.id | tostring), (.context | clean), (.state // "?" | clean), (.creator.login // "?" | clean)] | @tsv' "${work}/statuses.json" > "${work}/statuses.tsv"
            while IFS=$'\t' read -r id context state creator; do
              echo "::error::commit status ${id} named '${context}' (${state}, set by ${creator}) is on ${HEAD_SHA}; no status may carry a trusted or authority name"
              found=1
            done < "${work}/statuses.tsv"
            [ "$count" -ge 100 ] || break
            page=$((page + 1))
          done
          if [ "$found" -ne 0 ]; then
            echo "::error::another producer of a trusted name is on ${HEAD_SHA}, so this check fails; remove the workflow, job or status that produced it, then add a new commit to the pull request, since a re-run on this head reads the same check runs and fails again"
            exit 1
          fi
          echo "no other producer of a trusted or authority name is on ${HEAD_SHA} now; Mode B does not see one that runs later"

      - name: Create the authority checks
        env:
          APP_ID: ${{ vars.CODEFLOW_AUTHORITY_APP_ID }}
          APP_KEY: ${{ secrets.CODEFLOW_AUTHORITY_APP_KEY }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          AUTHORITY_SHA: ${{ github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          VERDICTS: |
            authority: commit standards=${{ needs.commit-lint.result }}
            authority: release impact=${{ needs.release-impact.result }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "$APP_ID" ] && [ -z "$APP_KEY" ]; then
            echo "Mode B: no authority App is configured, so no authority: check is created; Mode B does not close forgery by a later producer, and only Mode A, the App authority, does" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error::the authority App is half configured: set both the variable CODEFLOW_AUTHORITY_APP_ID and the secret CODEFLOW_AUTHORITY_APP_KEY in codeflow-authority, or neither"; exit 1
          fi
          if ! printf '%s\n' "$APP_ID" | grep -Eqx '[0-9]+|Iv[0-9A-Za-z._-]+'; then
            echo "::error::CODEFLOW_AUTHORITY_APP_ID is not an App id or client id"; exit 1
          fi
          work=$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/codeflow-authority.XXXXXX")
          token=
          finish() {
            if [ -n "$token" ]; then
              curl -fsS --max-time 30 -X DELETE -H @"${work}/token-headers" "${GITHUB_API_URL}/installation/token" >/dev/null \
                || echo "::warning::the installation token could not be revoked; it expires within the hour"
            fi
            rm -rf "$work"
          }
          trap finish EXIT
          headers() {
            printf 'Authorization: Bearer %s\nAccept: application/vnd.github+json\nX-GitHub-Api-Version: 2022-11-28\n' "$1"
          }
          b64url() { openssl base64 -A | tr '+/' '-_' | tr -d '='; }
          # The App's JWT, as GitHub documents it for Bash: issued a minute
          # in the past for clock drift, valid for at most ten minutes.
          printf '%s\n' "$APP_KEY" > "${work}/key.pem"
          unset APP_KEY
          now=$(date +%s)
          header=$(printf '%s' '{"typ":"JWT","alg":"RS256"}' | b64url)
          payload=$(jq -cjn --arg iss "$APP_ID" --argjson iat "$((now - 60))" --argjson exp "$((now + 540))" '{iat: $iat, exp: $exp, iss: $iss}' | b64url)
          signature=$(printf '%s.%s' "$header" "$payload" | openssl dgst -sha256 -sign "${work}/key.pem" -binary | b64url)
          rm -f "${work}/key.pem"
          jwt="${header}.${payload}.${signature}"
          echo "::add-mask::${jwt}"
          headers "$jwt" > "${work}/app-headers"
          installation=$(curl -fsS --retry 3 --max-time 60 -H @"${work}/app-headers" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/installation" | jq -r '.id // empty')
          if ! printf '%s\n' "$installation" | grep -Eqx '[0-9]+'; then
            echo "::error::the authority App is not installed on ${GITHUB_REPOSITORY}; no authority check is created"; exit 1
          fi
          jq -cn --arg repo "${GITHUB_REPOSITORY#*/}" '{repositories: [$repo], permissions: {checks: "write"}}' > "${work}/scope.json"
          curl -fsS --retry 3 --max-time 60 -X POST -H @"${work}/app-headers" --data @"${work}/scope.json" \
            "${GITHUB_API_URL}/app/installations/${installation}/access_tokens" > "${work}/token.json"
          token=$(jq -r '.token // empty' "${work}/token.json")
          rm -f "${work}/token.json" "${work}/app-headers"
          if [ -z "$token" ]; then
            echo "::error::GitHub returned no installation token; no authority check is created"; exit 1
          fi
          echo "::add-mask::${token}"
          headers "$token" > "${work}/token-headers"
          api() { curl -fsS --retry 3 --max-time 60 -H @"${work}/token-headers" "$@"; }
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          : > "${work}/created.tsv"
          while IFS='=' read -r name result; do
            [ -n "$name" ] || continue
            case "$name" in
              "authority: "?*) ;;
              *) echo "::error::'${name}' in VERDICTS is not an authority: name"; exit 1 ;;
            esac
            jq -cn --arg name "$name" --arg sha "$HEAD_SHA" --arg url "$run_url" \
              '{name: $name, head_sha: $sha, status: "in_progress", details_url: $url}' > "${work}/create.json"
            id=$(api -X POST --data @"${work}/create.json" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/check-runs" | jq -r '.id // empty')
            if ! printf '%s\n' "$id" | grep -Eqx '[0-9]+'; then
              echo "::error::GitHub did not create ${name}"; exit 1
            fi
            printf '%s\t%s\t%s\n' "$id" "$name" "$result" >> "${work}/created.tsv"
          done <<< "$VERDICTS"
          while IFS=$'\t' read -r id name result; do
            # The verdict job the check reports on, by its own name.
            case "$name" in
              "authority: commit standards") verdict="commit standards" ;;
              *) verdict="trusted: ${name#"authority: "}" ;;
            esac
            conclusion=failure
            if [ "$result" = success ]; then conclusion=success; fi
            jq -cn --arg conclusion "$conclusion" --arg title "${verdict} ${result}" \
              --arg summary "${verdict} ended ${result} in ${run_url}; judged by ${DEFAULT_BRANCH}@${AUTHORITY_SHA}" \
              '{status: "completed", conclusion: $conclusion, output: {title: $title, summary: $summary}}' > "${work}/conclude.json"
            api -X PATCH --data @"${work}/conclude.json" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/check-runs/${id}" >/dev/null
            echo "${name}: ${conclusion}" | tee -a "$GITHUB_STEP_SUMMARY"
          done < "${work}/created.tsv"
