# codeflow policy: the enforcing CodeFlow check for pull requests. Written by
# `codeflow init` and managed by `codeflow update`.
#
# The verdict job, `trusted: commit standards`, runs on `pull_request_target`
# for every pull request, whatever it targets. GitHub runs this file from the
# repository's default branch, never from the pull request or its target,
# and sets GITHUB_REF to that branch and GITHUB_SHA to its tip. The job
# checks that, checks out exactly GITHUB_SHA (the authority), installs the
# codeflow version the authority pins in .codeflow/project.toml
# (`scaffold_version`), verified against the archive digests pinned beside it
# ([scaffold_sha256]) and the release's published sha256.sum (SPC-013
# R-113), and judges with the authority's policy, never the target's. The
# pull request's base and head are fetched only as git data and never run.
# After every step the job asserts that the checkout is still the authority.
# The token is read-only and no secret is used. Builds and tests of the head
# run in codeflow-ci.yml on `pull_request`.
#
# `codeflow ci` runs the SAME commit-format, no-AI-attribution, no-emoji,
# breaking-footer, branch-naming and PR-body checks as the git hooks and the
# Claude git-guard, reading the authority's .codeflow/policy.json (CodeFlow
# ADR-0017, ADR-0091). `edited` reruns it when the PR body changes. Trusted
# automation profiles (git.automation_profiles) apply only for the actor
# passed here, and never on a fork pull request.
#
# The verdict job is also the enforcing check of the shared id registry for
# the pull request (SPC-013 R-14, R-20, R-109; ADR-0072); with durable work
# tracking off, `codeflow ids check` passes with a note. This workflow has
# no other trigger: pushes, the schedule and manual runs check the registry
# in codeflow-registry.yml, so they create no check under a `trusted:` name,
# not even a skipped one, which GitHub would count as passing.
#
# Pull request runs share one concurrency group per pull request, and no
# event cancels or replaces a run: `cancel-in-progress` is false and
# `queue: max` keeps every pending run, so a push followed by a body edit
# seconds later leaves both runs to finish and the push's required "commit
# standards" check completed, never cancelled. (`cancel-in-progress: false`
# alone is not enough: the default queue holds one pending run and cancels
# it when a newer one arrives.) Limits: a group queues at most 100 runs, and
# a run that arrives past that is cancelled, so the newest push fails closed
# until the check is re-run; `queue` is a 2026 key that some linters reject
# (actionlint releases up to 1.7.12), so ignore that message in the linter's
# configuration rather than removing the key.
#
# The event pins the head and the base commit: the job fetches both as data
# and refuses a head that is not the event's. Only the body comes from the
# API, read when the job runs, so a queued run can judge a newer body than
# its event. The job's last read of the pull request, after the checks, fails
# the run, with its own message, when the head, the base branch or the body
# differs from what the run judged; the run queued by that change decides. It
# fails closed when that read fails. A change made after that last read,
# before the run ends, is judged by the run that change queued.
# The body is logged as a sha256 digest, never as text: it is written to a
# file in the runner's temp directory and handed to `codeflow ci` as a file,
# never through `env:` or an argument, because the runner prints a step's
# `env:` values in its log. Each run makes three API reads on the job's
# token. The first, before anything is checked out, stops a run whose head
# the pull request has moved past, so superseded runs in the queue clear
# quickly; it fails such a run, never passes it, and an unclear read judges
# in full.
#
# This repository's copy: CodeFlow is its own first consumer, so the verdict
# jobs build the authority's own source in place of the pinned release, and
# a second verdict job, `trusted: release impact`, runs scripts/release.py
# check-pr from the authority with the authority's binary, the pull request
# body and its range as data. That job reads, logs and rechecks the body as the
# commit standards job does, with its own three API reads. `codeflow update` keeps
# it as a user-modified file.
name: codeflow-policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) }}
  cancel-in-progress: false
  queue: max

jobs:
  commit-lint:
    name: "trusted: commit standards"
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Read access to pull requests serves the body step, and read access
    # to actions the merge admission; the token stays read-only.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      # The authority is the default branch at the one commit this run was
      # started for. A run whose ref is not the default branch (an older
      # host's pull_request_target semantics, or any other event) fails
      # closed rather than judge with another branch's code.
      #
      # A run started for a head the pull request has since moved past
      # stops here, before anything is checked out, so the superseded runs
      # the queue keeps (never cancelled) clear in seconds and the current
      # head's run starts sooner. It fails, never passes: the run for the
      # current head decides. A read that fails, or an answer that is not
      # one full commit id, is unclear, and the run judges in full.
      - name: Resolve the authority
        env:
          EVENT: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          AUTHORITY_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request_target ] || [ -z "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "::error::this run is for ${GITHUB_REF} on ${EVENT}, not the default branch ${DEFAULT_BRANCH:-(unknown)} on pull_request_target; nothing is judged"; exit 1
          fi
          if ! printf '%s\n' "$AUTHORITY_SHA" | grep -Eqx '[0-9a-f]{40}'; then
            echo "::error::the run's commit '${AUTHORITY_SHA}' is not a full commit id; nothing is judged"; exit 1
          fi
          now=""
          if [ -n "${GH_TOKEN:-}" ] && [ -n "${PR_NUMBER:-}" ] && [ -n "${GITHUB_API_URL:-}" ]; then
            now=$(curl -fsS --retry 2 --max-time 30 \
              -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" | jq -r '.head.sha // empty') || now=""
          fi
          if [[ "$now" =~ ^[0-9a-f]{40}$ ]] && [[ "${EVENT_HEAD:-}" =~ ^[0-9a-f]{40}$ ]] && [ "$now" != "$EVENT_HEAD" ]; then
            echo "::error::this run is for head ${EVENT_HEAD}, but the pull request head is now ${now}; it stops before judging, and the run queued by the new head decides"; exit 1
          fi
          if [ "$now" != "${EVENT_HEAD:-}" ]; then
            echo "the pull request's current head could not be read clearly, so this run judges in full"
          fi
          echo "judged by ${DEFAULT_BRANCH}@${AUTHORITY_SHA}" | tee -a "$GITHUB_STEP_SUMMARY"

      # The authority, never the pull request's head or its target. The
      # binary, the pin and the policy all come from this checkout.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      # This repository IS codeflow, so it builds the authority's own source
      # instead of installing a pinned release. The pull request's base and
      # head are never checked out or built. The toolchain is pinned in the
      # authority's rust-toolchain.toml.
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      - name: Build codeflow from the authority's source
        run: |
          cargo build --release --locked -p codeflow-cli
          echo "${GITHUB_WORKSPACE}/target/release" >> "$GITHUB_PATH"

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      # The base and the head are git data: fetched to refs, never checked
      # out or run. Each must be the commit the event names.
      - name: Fetch the pull request's base and head as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/codeflow/pr-head"
          fetched=$(git rev-parse refs/codeflow/pr-head)
          if [ "$fetched" != "$HEAD_SHA" ]; then
            echo "::error::the pull request head moved (${fetched}, event ${HEAD_SHA}); this run belongs to an older event, so it fails; re-run the check for the current head"; exit 1
          fi
          git fetch --no-tags origin "+${BASE_SHA}:refs/codeflow/pr-base"
          if [ "$(git rev-parse refs/codeflow/pr-base)" != "$BASE_SHA" ]; then
            echo "::error::cannot fetch the pull request's base ${BASE_SHA}; nothing is judged"; exit 1
          fi

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      # The body is read when the job runs, never taken from the event. An
      # event carries the body as it was when the event fired, and a run can
      # start long after that (one that waited in the queue, one delivered
      # late, or a re-run), so only the current body is the newest.
      # The text is written to a file in the runner's temp directory, never to
      # a step output, an `env:` value or an argument, so it cannot reach the
      # log. The path is fixed (`pr-body.md` in the runner's temp directory)
      # and the step's only output is the file's sha256 digest.
      - name: Read the pull request's current body
        id: body
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 60 \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" -o "${RUNNER_TEMP}/pull.json"
          jq -r '.body // ""' "${RUNNER_TEMP}/pull.json" > "${RUNNER_TEMP}/pr-body.md"
          # The body is logged as a digest of the file's bytes, never as
          # text; the last read compares a new digest with this one.
          if command -v sha256sum >/dev/null 2>&1; then
            digest=$(sha256sum "${RUNNER_TEMP}/pr-body.md" | cut -d ' ' -f 1)
          else
            digest=$(shasum -a 256 "${RUNNER_TEMP}/pr-body.md" | cut -d ' ' -f 1)
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "pull request body judged: sha256 ${digest}"

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      # The PR body reaches `codeflow ci` as a file, never interpolated into
      # the script and never through `env:` (the runner logs those values), so
      # an untrusted body can neither inject shell nor reach the log. The
      # policy and the work-record baseline are the authority's
      # (--policy-from, --baseline-from), never the target's.
      - name: codeflow ci (commit + branch + PR-body standards)
        env:
          AUTHORITY_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BODY_FILE: ${{ runner.temp }}/pr-body.md
          ACTOR: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.actor || 'unknown' }}
        # The authority must carry its policy: judging with defaults where it
        # has none would pass what the project never chose (TSK-336).
        run: |
          if ! git cat-file -e "${AUTHORITY_SHA}:.codeflow/policy.json" 2>/dev/null; then
            echo "::error::the default branch at ${AUTHORITY_SHA} has no .codeflow/policy.json, so nothing is judged; land the policy on the default branch first (the adoption pull request that adds it fails this check by design)"
            exit 1
          fi
          codeflow ci --base "$BASE_SHA" --head "$HEAD_SHA" --branch "$HEAD_REF" --actor "$ACTOR" --policy-from "$AUTHORITY_SHA" --baseline-from "$AUTHORITY_SHA" --pr-body-file "$BODY_FILE"

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      # The registry is fetched explicitly with full history, never forced
      # (R-20).
      - name: Fetch the shared registry
        run: |
          if git ls-remote --exit-code --heads origin codeflow/registry >/dev/null; then
            git fetch --no-tags origin refs/heads/codeflow/registry:refs/remotes/origin/codeflow/registry
          else
            echo "codeflow/registry is not on origin; the check reports it when records are tracked"
          fi

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      - name: codeflow ids check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: codeflow ids check --base "$BASE_SHA" --head refs/codeflow/pr-head

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      # Merge admission (TSK-449 AC-6). A draft's codeflow-ci verdicts are
      # skipped, which a required-check rule reads as passing, so this
      # required check passes only when the newest codeflow-ci pull_request
      # run at exactly this head completed with success and both verdicts
      # succeeded. A ready pull request waits for that run, 35 minutes at
      # most so the job stays inside the 45-minute job bound; a run still
      # pending then refuses and names the re-run that admits it. A draft,
      # a cancelled or failed run, a run only for another head or a skipped
      # verdict refuses at once. `ready_for_review` and a new push start
      # this job again at the new head. The script comes from the authority
      # checkout above, never from the pull request or its target.
      - name: the exact head's ready codeflow-ci run passed
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          wait=2100
          if [ "$DRAFT" = true ]; then wait=0; fi
          python3 -I scripts/ci-reuse.py admit --repo "$REPOSITORY" --head "$HEAD_SHA" --pull "$PR_NUMBER" \
            --workflow .github/workflows/codeflow-ci.yml --require "codeflow gates" --require windows \
            --wait "$wait"

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      # The last read. The run judged the head, base branch and body it read
      # above; if any changed while it ran, this run fails with its own
      # message and the run queued by that change decides. The base commit is
      # not compared, since a push to the base branch fires no pull request
      # event. A failed or unreadable read fails the run, never passes it.
      - name: the pull request is unchanged since it was judged
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          JUDGED_HEAD: ${{ github.event.pull_request.head.sha }}
          JUDGED_BASE: ${{ github.event.pull_request.base.ref }}
          JUDGED_DIGEST: ${{ steps.body.outputs.digest }}
        run: |
          set -euo pipefail
          if ! curl -fsSL --retry 3 --max-time 60 \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" -o "${RUNNER_TEMP}/pull-after.json"; then
            echo "::error::cannot read the pull request again, so this run cannot show that what it judged is current; it fails closed; re-run the check"; exit 1
          fi
          if ! head=$(jq -er '.head.sha' "${RUNNER_TEMP}/pull-after.json") \
            || ! base=$(jq -er '.base.ref' "${RUNNER_TEMP}/pull-after.json") \
            || ! body=$(jq -r '.body // ""' "${RUNNER_TEMP}/pull-after.json" | { sha256sum 2>/dev/null || shasum -a 256; } | cut -d ' ' -f 1); then
            echo "::error::the pull request read at the end of this run is unreadable, so this run fails closed; re-run the check"; exit 1
          fi
          if [ -z "$JUDGED_DIGEST" ]; then
            echo "::error::this run recorded no body digest, so it cannot show that the body is unchanged; it fails closed; re-run the check"; exit 1
          fi
          if [ "$head" != "$JUDGED_HEAD" ]; then
            echo "::error::the pull request head changed while this run judged it (judged ${JUDGED_HEAD}, now ${head}); the run queued by the new head decides"; exit 1
          fi
          if [ "$base" != "$JUDGED_BASE" ]; then
            echo "::error::the pull request base branch changed while this run judged it (judged ${JUDGED_BASE}, now ${base}); the run queued by that change decides"; exit 1
          fi
          if [ "$body" != "$JUDGED_DIGEST" ]; then
            echo "::error::the pull request body changed while this run judged it (judged sha256 ${JUDGED_DIGEST}, now ${body}); the run queued by that edit decides"; exit 1
          fi
          echo "the pull request head, base branch and body are unchanged since this run judged them"

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

  # The release-impact verdict (ADR-0062, SPC-013 R-94): the pull request's
  # declared impact against the proposed merge tree and the host's
  # published state, judged by scripts/release.py and the codeflow built
  # from the authority, with the body, the base and the head as data. The
  # head-built `release impact` job in codeflow-release.yml stays until the
  # last change before main removes it (TSK-336 AC-9, amended 2026-11-03).
  release-impact:
    name: "trusted: release impact"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Read access to pull requests serves the body step; the read-only
    # token also reads the host's published releases.
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The authority is the default branch at the one commit this run was
      # started for. A run whose ref is not the default branch (an older
      # host's pull_request_target semantics, or any other event) fails
      # closed rather than judge with another branch's code.
      #
      # A run started for a head the pull request has since moved past
      # stops here, before anything is checked out, so the superseded runs
      # the queue keeps (never cancelled) clear in seconds and the current
      # head's run starts sooner. It fails, never passes: the run for the
      # current head decides. A read that fails, or an answer that is not
      # one full commit id, is unclear, and the run judges in full.
      - name: Resolve the authority
        env:
          EVENT: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          AUTHORITY_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request_target ] || [ -z "$DEFAULT_BRANCH" ] || [ "$GITHUB_REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "::error::this run is for ${GITHUB_REF} on ${EVENT}, not the default branch ${DEFAULT_BRANCH:-(unknown)} on pull_request_target; nothing is judged"; exit 1
          fi
          if ! printf '%s\n' "$AUTHORITY_SHA" | grep -Eqx '[0-9a-f]{40}'; then
            echo "::error::the run's commit '${AUTHORITY_SHA}' is not a full commit id; nothing is judged"; exit 1
          fi
          now=""
          if [ -n "${GH_TOKEN:-}" ] && [ -n "${PR_NUMBER:-}" ] && [ -n "${GITHUB_API_URL:-}" ]; then
            now=$(curl -fsS --retry 2 --max-time 30 \
              -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" | jq -r '.head.sha // empty') || now=""
          fi
          if [[ "$now" =~ ^[0-9a-f]{40}$ ]] && [[ "${EVENT_HEAD:-}" =~ ^[0-9a-f]{40}$ ]] && [ "$now" != "$EVENT_HEAD" ]; then
            echo "::error::this run is for head ${EVENT_HEAD}, but the pull request head is now ${now}; it stops before judging, and the run queued by the new head decides"; exit 1
          fi
          if [ "$now" != "${EVENT_HEAD:-}" ]; then
            echo "the pull request's current head could not be read clearly, so this run judges in full"
          fi
          echo "judged by ${DEFAULT_BRANCH}@${AUTHORITY_SHA}" | tee -a "$GITHUB_STEP_SUMMARY"

      # The authority, never the pull request's head or its target. The
      # binary, the pin and the policy all come from this checkout.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      # This repository IS codeflow, so it builds the authority's own source
      # instead of installing a pinned release. The pull request's base and
      # head are never checked out or built. The toolchain is pinned in the
      # authority's rust-toolchain.toml.
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      - name: Build codeflow from the authority's source
        run: |
          cargo build --release --locked -p codeflow-cli
          echo "${GITHUB_WORKSPACE}/target/release" >> "$GITHUB_PATH"

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      # The base and the head are git data: fetched to refs, never checked
      # out or run. Each must be the commit the event names.
      - name: Fetch the pull request's base and head as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/codeflow/pr-head"
          fetched=$(git rev-parse refs/codeflow/pr-head)
          if [ "$fetched" != "$HEAD_SHA" ]; then
            echo "::error::the pull request head moved (${fetched}, event ${HEAD_SHA}); this run belongs to an older event, so it fails; re-run the check for the current head"; exit 1
          fi
          git fetch --no-tags origin "+${BASE_SHA}:refs/codeflow/pr-base"
          if [ "$(git rev-parse refs/codeflow/pr-base)" != "$BASE_SHA" ]; then
            echo "::error::cannot fetch the pull request's base ${BASE_SHA}; nothing is judged"; exit 1
          fi

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      - name: Fetch the pull request's target as data
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      # The body is read when the job runs, never taken from the event. An
      # event carries the body as it was when the event fired, and a run can
      # start long after that (one that waited in the queue, one delivered
      # late, or a re-run), so only the current body is the newest.
      # The text is written to a file in the runner's temp directory, never to
      # a step output, an `env:` value or an argument, so it cannot reach the
      # log. The path is fixed (`pr-body.md` in the runner's temp directory)
      # and the step's only output is the file's sha256 digest.
      - name: Read the pull request's current body
        id: body
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --max-time 60 \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" -o "${RUNNER_TEMP}/pull.json"
          jq -r '.body // ""' "${RUNNER_TEMP}/pull.json" > "${RUNNER_TEMP}/pr-body.md"
          # The body is logged as a digest of the file's bytes, never as
          # text; the last read compares a new digest with this one.
          if command -v sha256sum >/dev/null 2>&1; then
            digest=$(sha256sum "${RUNNER_TEMP}/pr-body.md" | cut -d ' ' -f 1)
          else
            digest=$(shasum -a 256 "${RUNNER_TEMP}/pr-body.md" | cut -d ' ' -f 1)
          fi
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "pull request body judged: sha256 ${digest}"

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      # The PR body reaches the script as a file, never interpolated into the
      # script and never through `env:` (the runner logs those values), so an
      # untrusted body can neither inject shell nor reach the log.
      - name: Validate reviewed release intent
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BODY_FILE: ${{ runner.temp }}/pr-body.md
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I scripts/release.py check-pr \
            --base "$BASE_SHA" --head "$HEAD_SHA" \
            --target-ref "origin/$BASE_REF" --body-file "$BODY_FILE" \
            --codeflow-bin target/release/codeflow

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi

      # The last read, as in the commit standards job: this job read the body
      # and judged the event's head and base branch, so it fails when any of
      # them changed while it ran, and the run queued by that change decides.
      - name: the pull request is unchanged since it was judged
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          JUDGED_HEAD: ${{ github.event.pull_request.head.sha }}
          JUDGED_BASE: ${{ github.event.pull_request.base.ref }}
          JUDGED_DIGEST: ${{ steps.body.outputs.digest }}
        run: |
          set -euo pipefail
          if ! curl -fsSL --retry 3 --max-time 60 \
            -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" -o "${RUNNER_TEMP}/pull-after.json"; then
            echo "::error::cannot read the pull request again, so this run cannot show that what it judged is current; it fails closed; re-run the check"; exit 1
          fi
          if ! head=$(jq -er '.head.sha' "${RUNNER_TEMP}/pull-after.json") \
            || ! base=$(jq -er '.base.ref' "${RUNNER_TEMP}/pull-after.json") \
            || ! body=$(jq -r '.body // ""' "${RUNNER_TEMP}/pull-after.json" | { sha256sum 2>/dev/null || shasum -a 256; } | cut -d ' ' -f 1); then
            echo "::error::the pull request read at the end of this run is unreadable, so this run fails closed; re-run the check"; exit 1
          fi
          if [ -z "$JUDGED_DIGEST" ]; then
            echo "::error::this run recorded no body digest, so it cannot show that the body is unchanged; it fails closed; re-run the check"; exit 1
          fi
          if [ "$head" != "$JUDGED_HEAD" ]; then
            echo "::error::the pull request head changed while this run judged it (judged ${JUDGED_HEAD}, now ${head}); the run queued by the new head decides"; exit 1
          fi
          if [ "$base" != "$JUDGED_BASE" ]; then
            echo "::error::the pull request base branch changed while this run judged it (judged ${JUDGED_BASE}, now ${base}); the run queued by that change decides"; exit 1
          fi
          if [ "$body" != "$JUDGED_DIGEST" ]; then
            echo "::error::the pull request body changed while this run judged it (judged sha256 ${JUDGED_DIGEST}, now ${body}); the run queued by that edit decides"; exit 1
          fi
          echo "the pull request head, base branch and body are unchanged since this run judged them"

      - name: Assert the authority checkout
        env:
          AUTHORITY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          head=$(git rev-parse --verify HEAD)
          if [ "$head" != "$AUTHORITY_SHA" ] || ! git diff --quiet HEAD --; then
            echo "::error::the checkout is no longer the default branch's ${AUTHORITY_SHA} (HEAD ${head}, or a tracked file changed); nothing is judged"; exit 1
          fi
