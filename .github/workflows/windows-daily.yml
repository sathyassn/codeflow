# Disabled by the operator during the 2026-11-11 relaxation. The active
# full-suite daily run is codeflow-ci.yml on main; this declaration does not
# enable the separate dispatcher. AC-11's active-line scope remains owed.
#
# When restored by the operator, dispatch full Linux and Windows workers at
# each resolved main or active-line commit and its own ref. The worker checks
# the requested SHA and reports coverage totals; daily evidence is never
# merge evidence. A line left out has no daily evidence. Line pushes run no
# hosted workflow. windows-daily-verdict.yml judges the requested workers.
# DAILY_PROOF_MAX_AGE_DAYS bounds reuse of an exact-tip passing daily or
# full-suite run; the request records the proof and the verdict checks it.
name: daily Windows

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

# Each job names what it needs. Only the dispatch job can start runs.
permissions: {}

concurrency:
  group: daily-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sources:
    name: resolve daily Windows source commits
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      matrix: ${{ steps.sources.outputs.matrix }}
      runs: ${{ steps.sources.outputs.runs }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Discover main and each active integration line at immutable commits
        id: sources
        env:
          GH_TOKEN: ${{ github.token }}
          DAILY_PROOF_MAX_AGE_DAYS: "7"
        run: python3 -I -B scripts/windows-daily.py discover
      - name: Keep what was requested for the verdict
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: daily-windows-requested
          path: daily-windows-requested.json
          if-no-files-found: error
          retention-days: 7

  dispatch:
    name: start the daily Windows run for ${{ matrix.ref }}
    needs: sources
    # GitHub refuses an empty matrix, and every line may be skipped.
    if: ${{ needs.sources.outputs.runs == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.sources.outputs.matrix) }}
    steps:
      - name: Start the line's run at the line's own ref
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ matrix.ref }}
          SOURCE_SHA: ${{ matrix.sha }}
        run: gh workflow run windows-daily-run.yml --repo "$GITHUB_REPOSITORY" --ref "${SOURCE_REF#refs/heads/}" -f source-sha="$SOURCE_SHA"
