name: release main recheck
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
permissions:
  actions: read
  contents: write
  checks: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      # Every platform binary must be a clean build of the release commit
      # (sathyassn/codeflow#14). This runs on dry runs too, so a dry run
      # shows the problem before a real tag is cut.
      - name: Download the platform builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifacts-build-local-*
          path: /tmp/release-builds
          merge-multiple: true
      - name: Verify each binary is a clean build of the release commit
        run: python3 scripts/release.py verify-clean-builds --artifacts-dir /tmp/release-builds --source "$GITHUB_SHA"
      - name: Recheck selected main after platform builds
        if: github.event.inputs.tag != 'dry-run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: |
          for login in "$GITHUB_ACTOR" "$GITHUB_TRIGGERING_ACTOR"; do
            test "$(gh api "users/${login}" --jq .type)" = User
            case "$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${login}/permission" --jq .permission)" in
              write|maintain|admin) ;;
              *) echo "::error::${login} lacks current publication permission"; exit 1 ;;
            esac
          done
          main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?filter=all&per_page=100" \
            > /tmp/authority-checks.json
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/codeflow-ci.yml/runs?branch=main&event=push&head_sha=${GITHUB_SHA}&per_page=100" \
            > /tmp/authority-runs.json
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/codeflow-release.yml/runs?branch=main&event=push&head_sha=${GITHUB_SHA}&per_page=100" \
            > /tmp/authority-release-runs.json
          python3 scripts/release.py verify-checks --state /tmp/authority-checks.json \
            --runs-state /tmp/authority-runs.json \
            --runs-state /tmp/authority-release-runs.json --source "$GITHUB_SHA"
          python3 scripts/release.py verify-publication --source "$GITHUB_SHA" \
            --main-source "$main_sha" --tag "$REQUESTED_TAG" --drafts-visible
