name: release main recheck
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
permissions:
  contents: write
  checks: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck selected main after platform builds
        if: github.event.inputs.tag != 'dry-run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: |
          for login in "$GITHUB_ACTOR" "$GITHUB_TRIGGERING_ACTOR"; do
            test "$(gh api "users/${login}" --jq .type)" = User
            case "$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${login}/permission" --jq .permission)" in
              write|maintain|admin) ;;
              *) echo "::error::${login} lacks current publication permission"; exit 1 ;;
            esac
          done
          main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?filter=all&per_page=100" \
            > /tmp/authority-checks.json
          python3 scripts/release.py verify-checks --state /tmp/authority-checks.json \
            --source "$GITHUB_SHA"
          python3 scripts/release.py verify-publication --source "$GITHUB_SHA" \
            --main-source "$main_sha" --tag "$REQUESTED_TAG" --drafts-visible
