# Test Suite CI
#
# Runs the CodeFlow test suite with structural integrity checks and coverage enforcement
# on PRs and pushes to main.
# Enforces: structural validation (test-to-source mapping), test pass, per-file coverage.

name: Test Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create test venv with dependencies
        run: |
          python -m venv .codeflow/testing/.venv
          .codeflow/testing/.venv/bin/pip install --upgrade pip
          .codeflow/testing/.venv/bin/pip install pytest pytest-cov ruff

      - name: Run structural integrity check
        run: |
          source .codeflow/testing/lib/test-coverage.sh
          validate_structural_integrity

      - name: Run test suite with coverage
        run: |
          chmod +x ./codeflow
          ./codeflow test --coverage

      - name: Tests passed
        if: success()
        run: echo "All tests passed with structural integrity and coverage enforcement"

      - name: Tests failed
        if: failure()
        run: |
          echo "Test suite failed"
          echo ""
          echo "To reproduce locally:"
          echo "  bash .codeflow/testing/run-all-tests.sh --mode full  # Full suite + structural"
          echo "  ./codeflow test --coverage                           # Per-file coverage"
          exit 1
