# Test Suite CI
#
# Runs the CodeFlow test suite with structural integrity checks and coverage enforcement
# on PRs and pushes to main.
# Enforces: structural validation (test-to-source mapping), test pass, per-file coverage.

name: Test Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: llvm-tools-preview
          cache-shared-key: "ci"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Install mold linker
        run: sudo apt-get install -y mold

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "codeflow-cli -> target"
          shared-key: "ci"

      - name: Install codeflow binary
        working-directory: codeflow-cli
        run: cargo build --profile ci && cp target/ci/codeflow "$HOME/.cargo/bin/codeflow"
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

      - name: Run structural integrity check
        run: |
          source .codeflow/testing/lib/test-coverage.sh
          validate_structural_integrity

      - name: Run test suite
        run: bash .codeflow/testing/run-all-tests.sh --mode full
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: clang
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: "-C link-arg=-fuse-ld=mold"

      - name: Tests passed
        if: success()
        run: echo "All tests passed"

      - name: Tests failed
        if: failure()
        run: |
          echo "Test suite failed"
          echo ""
          echo "To reproduce locally:"
          echo "  bash .codeflow/testing/run-all-tests.sh --mode full"
          exit 1

  build-release:
    name: Build Release (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    if: vars.SKIP_RUST_BUILD != 'true'

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
            binary: codeflow
          - target: x86_64-apple-darwin
            runner: macos-latest
            binary: codeflow
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            binary: codeflow

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
          cache-shared-key: "release-${{ matrix.target }}"

      - name: Install mold linker (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y mold

      - name: Build release binary
        working-directory: codeflow-cli
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_LINKER: ${{ runner.os == 'Linux' && 'clang' || '' }}
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS: ${{ runner.os == 'Linux' && '-C link-arg=-fuse-ld=mold' || '' }}

      - name: Verify binary
        run: file codeflow-cli/target/${{ matrix.target }}/release/${{ matrix.binary }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeflow-${{ matrix.target }}
          path: codeflow-cli/target/${{ matrix.target }}/release/${{ matrix.binary }}
          retention-days: 7
