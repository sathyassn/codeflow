# Test Suite CI
#
# Runs the CodeFlow test suite with structural integrity checks and coverage enforcement
# on PRs and pushes to main.
# Enforces: structural validation (test-to-source mapping), test pass, per-file coverage.

name: Test Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: codeflow-cli/go.mod
          cache: true
          cache-dependency-path: codeflow-cli/go.sum

      - name: Install codeflow binary
        working-directory: codeflow-cli
        run: go install ./cmd/codeflow/

      - name: Run structural integrity check
        run: |
          source .codeflow/testing/lib/test-coverage.sh
          validate_structural_integrity

      - name: Run test suite
        run: bash .codeflow/testing/run-all-tests.sh --mode full

      - name: Tests passed
        if: success()
        run: echo "All tests passed with structural integrity enforcement"

      - name: Tests failed
        if: failure()
        run: |
          echo "Test suite failed"
          echo ""
          echo "To reproduce locally:"
          echo "  bash .codeflow/testing/run-all-tests.sh --mode full"
          exit 1

  test-go:
    name: Run Go CLI Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: codeflow-cli/go.mod
          cache: true
          cache-dependency-path: codeflow-cli/go.sum

      - name: Run Go tests with coverage
        working-directory: codeflow-cli
        run: make test-cover

      - name: Go tests passed
        if: success()
        run: echo "Go CLI tests passed with coverage enforcement"

      - name: Go tests failed
        if: failure()
        run: |
          echo "Go CLI tests failed"
          echo ""
          echo "To reproduce locally:"
          echo "  cd codeflow-cli && make test-cover"
          exit 1
