# CodeFlow's own release-state jobs (ADR-0062, SPC-013 R-94 and R-96). They
# run scripts/release.py, the calculator of this repository only, so they
# live here and not in codeflow-ci.yml, the managed CI file every adopter
# receives. No scaffold manifest entry installs this file.
#
# - release impact: every pull request's Release impact block against the
#   proposed merge tree and the host's published state. It blocks.
# - release state: the merged state on main and on every integration line,
#   without writes. Publication reads this job's result on main.
name: codeflow-release

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main, "integration/**"]

  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  release-impact:
    name: release impact
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Validate reviewed release intent
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          CODEFLOW_PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin "$BASE_REF"
          python3 scripts/release.py check-pr \
            --base "$BASE_SHA" --head "$HEAD_SHA" \
            --target-ref "origin/$BASE_REF" --body-env CODEFLOW_PR_BODY

  release-state:
    name: release state
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Validate merged release state without writes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release.py check-state --ref "$GITHUB_SHA"

  # This job runs after a landing, never on a task pull request. The explicit
  # release branch is this repository's configuration, not an adopter default.
  release-integration:
    name: release integration after landing
    if: github.event_name == 'schedule' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/integration/EPC-'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: codeflow-release-integration
      cancel-in-progress: false
    env:
      RELEASE_BRANCH: integration/release-3-0-0-r2
    steps:
      # Build automation from the default target, never from the pushed line.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Build repository release integration runner and judge
        run: |
          cargo build --locked -p codeflow-cli --bin codeflow --example release_integration
          echo "${GITHUB_WORKSPACE}/target/debug" >> "$GITHUB_PATH"
      - name: Integrate verified epic lines
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          LANDED_LINE: ${{ github.ref_name }}
        run: |
          gh auth setup-git
          if [ "$EVENT_NAME" = push ]; then
            target/debug/examples/release_integration --release "$RELEASE_BRANCH" --line "$LANDED_LINE" --push
          else
            target/debug/examples/release_integration --release "$RELEASE_BRANCH" --push
          fi
