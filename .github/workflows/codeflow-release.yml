# CodeFlow's own release-state jobs (ADR-0062, SPC-013 R-94 and R-96). They
# run scripts/release.py, the calculator of this repository only, so they
# live here and not in codeflow-ci.yml, the managed CI file every adopter
# receives. No scaffold manifest entry installs this file.
#
# - release impact: every pull request's declared impact against the
#   proposed merge tree and the host's published state. It blocks. The
#   block's own fields are judged by `codeflow ci`'s one evaluator, which
#   release.py calls; this job judges nothing of the block separately.
#   It runs on `pull_request_target`, so its definition, its release.py and
#   the codeflow it builds come from the protected target, never from the
#   pull request: the candidate is fetched as git data and judged, never
#   built or run (TSK-1001). The head, base and body it judged are pinned
#   before and rechecked after, so success names exactly what was judged.
# - release state: the merged state on main and on every integration line,
#   without writes. Publication reads this job's result on main.
name: codeflow-release

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main, "integration/**"]

concurrency:
  group: ${{ github.event_name == 'pull_request_target' && format('{0}-pr-{1}', github.workflow, github.event.pull_request.number) || format('{0}-run-{1}', github.workflow, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

permissions:
  contents: read

jobs:
  release-impact:
    name: release impact
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      # The target's base commit, never the pull request head: the
      # definition, release.py and the codeflow below all come from it.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      # release.py reads and judges the body with the codeflow built from
      # this same target checkout, the evaluator `codeflow ci` uses, so the
      # two cannot judge a body differently (TSK-147 F4, TSK-451). It never
      # takes a codeflow from PATH, and nothing of the candidate is built.
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Build the target's codeflow that reads the body
        run: cargo build --release --locked -p codeflow-cli
      - name: Fetch the pull request head as data
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/pull/${PR_NUMBER}/head:refs/codeflow/pr-head" "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          fetched=$(git rev-parse refs/codeflow/pr-head)
          if [ "$fetched" != "$HEAD_SHA" ]; then
            echo "::error::the pull request head moved (${fetched}, event ${HEAD_SHA}); this run belongs to an older event, so it fails; re-run the check for the current head"; exit 1
          fi
      - name: Pin the head, base and body judged
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python3 -I scripts/release.py pr-snapshot --repository "$REPOSITORY" --pull "$PR_NUMBER"
          --expect-head "$HEAD_SHA" --expect-base-ref "$BASE_REF" --expect-base-sha "$BASE_SHA"
          --output "$RUNNER_TEMP/release-snapshot.json" --body-out "$RUNNER_TEMP/release-body.md"
      - name: Validate reviewed release intent
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -I scripts/release.py check-pr
          --base "$BASE_SHA" --head "$HEAD_SHA"
          --target-ref "origin/$BASE_REF" --body-file "$RUNNER_TEMP/release-body.md"
          --codeflow-bin target/release/codeflow
      - name: Recheck the pinned snapshot before reporting
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          python3 -I scripts/release.py pr-snapshot --repository "$REPOSITORY" --pull "$PR_NUMBER"
          --expect "$RUNNER_TEMP/release-snapshot.json"

  release-state:
    name: release state
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Validate merged release state without writes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/release.py check-state --ref "$GITHUB_SHA"
