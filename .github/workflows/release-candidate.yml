name: maintain release candidate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: codeflow-release-candidate
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Guard reviewed candidate output
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}"
          echo "::add-mask::$GIT_CONFIG_VALUE_0"
          set +e
          git ls-remote --exit-code --heads origin refs/heads/chore/release-codeflow > /tmp/candidate-ref
          remote_rc=$?
          set -e
          if [ "$remote_rc" -eq 0 ]; then
            git fetch origin refs/heads/chore/release-codeflow:refs/remotes/origin/chore/release-codeflow
            python3 scripts/release.py guard-refresh --ref origin/chore/release-codeflow
          elif [ "$remote_rc" -eq 2 ]; then
            echo "No existing release candidate branch."
          else
            echo "::error::Could not inspect the remote release candidate; refusing to treat a network/auth error as absence."
            exit "$remote_rc"
          fi
          unset auth GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0

      - name: Check repository candidate-PR permission
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/actions/permissions/workflow" > /tmp/workflow-permissions.json; then
            echo "::warning::The workflow token cannot inspect the repository Actions setting. If PR creation fails, enable 'Allow GitHub Actions to create and approve pull requests'."
          elif ! jq -e '.can_approve_pull_request_reviews == true' /tmp/workflow-permissions.json >/dev/null; then
            echo "::error::Enable 'Allow GitHub Actions to create and approve pull requests' for this repository; no candidate was changed."
            exit 1
          fi

      - name: Install pinned git-cliff
        run: cargo install git-cliff --version 2.13.1 --locked

      - name: Install pinned cargo-dist
        run: cargo install cargo-dist --version 0.32.0 --locked

      - name: Fetch verified historical published source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          export GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}"
          echo "::add-mask::$GIT_CONFIG_VALUE_0"
          git fetch --no-tags origin 3c3efdb91009361e18b0fabad699b5e875d4e4dd
          unset auth GIT_CONFIG_COUNT GIT_CONFIG_KEY_0 GIT_CONFIG_VALUE_0

      - name: Exercise the pinned calculator contract
        env:
          CODEFLOW_REAL_GIT_CLIFF: "1"
        run: python3 -B scripts/test_release.py

      - name: Prepare candidate
        id: prepare
        run: |
          result=$(python3 scripts/release.py prepare)
          printf '%s\n' "$result"
          echo "status=$(printf '%s' "$result" | jq -r .status)" >> "$GITHUB_OUTPUT"
          echo "tag=$(printf '%s' "$result" | jq -r '.tag // empty')" >> "$GITHUB_OUTPUT"

      - name: Refresh coupled version state
        if: steps.prepare.outputs.status == 'prepared'
        run: |
          cargo check --workspace
          cargo build --release --locked -p codeflow-cli
          target/release/codeflow update --diff /tmp/codeflow-release-update.diff
          cargo dist generate --check
          python3 scripts/release.py finalize

      - name: Create or update candidate PR
        if: steps.prepare.outputs.status == 'prepared'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/release-codeflow
          base: main
          delete-branch: false
          draft: always-true
          commit-message: |
            chore(release): ${{ steps.prepare.outputs.tag }}

            - Promote the reviewed CodeFlow release candidate.
          title: "chore(release): ${{ steps.prepare.outputs.tag }}"
          body: |
            ## Summary

            - Prepare the continuously maintained CodeFlow release candidate from reviewed changes already landed on `main`.

            ## Changes

            - Promote curated notes and regenerate bounded version-coupled files for `${{ steps.prepare.outputs.tag }}`.

            ## Release impact

            - Unit: `codeflow`
            - Impact: `none`
            - Rationale: This PR materializes the version selected from the already reviewed landed commit markers; it does not add another product change.
            - Evidence: `CHANGELOG.md` contains the promoted curated release notes.
            - Contract: `compatible`
            - Migration: Not required for this derived bookkeeping change; underlying breaking changes retain their own migration notes.

            ## Testing

            - Required checks run against this exact generated head. Publication remains disabled until a human merges this PR.

            ## Linked work

            - CAP-012
            - EPC-010

      - name: Report held publication
        if: steps.prepare.outputs.status == 'pending-publication'
        run: echo "The merged candidate is awaiting publication; no replacement candidate was generated."
