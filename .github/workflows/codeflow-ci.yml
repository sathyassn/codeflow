# codeflow CI — the perimeter. Re-runs every gate that matters so nothing
# depends on local state. Written by `codeflow init` only if absent; after
# that it is yours.
name: codeflow-ci

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  gates:
    name: codeflow gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This repo IS codeflow, so it builds the binary from source rather than
      # using the release installer a consumer project would. These gates block.
      # Pinned to the dev toolchain so CI is reproducible and a new stable
      # clippy lint cannot break the build out from under a green local run.
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2

      - name: Build codeflow from source
        run: |
          cargo build --release -p codeflow-cli
          echo "${GITHUB_WORKSPACE}/target/release" >> "$GITHUB_PATH"

      - name: codeflow test --mode full
        run: codeflow test --mode full

      - name: codeflow validate --docs
        run: codeflow validate --docs

  rust:
    name: rust (test + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2

      - name: cargo test --workspace
        run: cargo test --workspace

      - name: cargo clippy --workspace --all-targets -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Run the gitleaks binary directly (pinned): the gitleaks-action wrapper
      # requires a GitHub token/license and crashed with a RequestError here.
      - name: gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --no-banner --exit-code 1

  commit-lint:
    name: commit standards
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint PR commits (format, no AI attribution, no emoji)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          fail=0
          types='feat|fix|docs|refactor|test|chore|ci|perf|build|revert'

          while IFS= read -r subject; do
            if ! printf '%s\n' "$subject" | grep -qE "^(${types})(\([a-zA-Z0-9._/-]+\))?!?: .+[^.]$"; then
              echo "::error::malformed commit subject: ${subject}"
              fail=1
            fi
          done < <(git log --no-merges --format=%s "${BASE_SHA}..${HEAD_SHA}")

          if git log --no-merges --format=%B "${BASE_SHA}..${HEAD_SHA}" \
            | grep -niE 'co-authored-by:.*(claude|anthropic|openai|gpt|copilot|gemini|codex|cursor|assistant|agent|\bai\b|bot)|generated (with|by)'; then
            echo "::error::AI attribution found in commit message(s)"
            fail=1
          fi

          if git log --no-merges --format=%B "${BASE_SHA}..${HEAD_SHA}" \
            | grep -P '[\x{1F000}-\x{1FAFF}]|[\x{2600}-\x{27BF}]|[\x{2B00}-\x{2BFF}]|\x{FE0F}'; then
            echo "::error::emoji found in commit message(s)"
            fail=1
          fi

          exit "$fail"

      - name: Lint PR body (no AI attribution, no emoji)
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -u
          fail=0

          if printf '%s\n' "${PR_BODY}" \
            | grep -niE 'co-authored-by:.*(claude|anthropic|openai|gpt|copilot|gemini|codex|cursor|assistant|agent|\bai\b|bot)|generated (with|by)'; then
            echo "::error::AI attribution found in PR body"
            fail=1
          fi

          if printf '%s\n' "${PR_BODY}" \
            | grep -P '[\x{1F000}-\x{1FAFF}]|[\x{2600}-\x{27BF}]|[\x{2B00}-\x{2BFF}]|\x{FE0F}'; then
            echo "::error::emoji found in PR body"
            fail=1
          fi

          exit "$fail"

  # warn-first; threshold gate later — report-only, never fails the build
  coverage:
    name: coverage report
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Coverage summary (printed to the job log)
        run: cargo llvm-cov --workspace --summary-only
