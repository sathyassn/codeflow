# codeflow CI — the perimeter. Re-runs every gate that matters so nothing
# depends on local state. Written by `codeflow init` and managed by `codeflow
# update` (charter §4.3): an unmodified copy is replaced on update; your edits
# are preserved via 3-way merge, never clobbered.
#
# The commit, branch and PR-body standards run in codeflow-policy.yml on
# `pull_request_target`, so a pull request cannot edit the job that judges it.
name: codeflow-ci

on:
  pull_request:
  push:
    branches: [main, master, "integration/**"]
  # The weekly and manual runs scan the full history of the default branch
  # for secrets and audit dependencies; every other job keeps to pull
  # requests and pushes through its own `if:`.
  schedule:
    - cron: "37 5 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Ubuntu jobs pin the runner image (ubuntu-24.04), so a move of the
  # ubuntu-latest label to a new Ubuntu release cannot change the toolchain
  # under these jobs without a commit here. Move the label deliberately, after
  # a green run on the new image. Actions are on the node24 runtime.
  # The Windows jobs keep windows-latest; this pin covers Ubuntu only.
  #
  # The full gate runs as parallel parts on separate runners. Each part runs
  # `codeflow test --mode full --strict --all --only <targets>`, which also
  # runs the named targets' prerequisites. Together the parts name every
  # full-mode target in .codeflow/test-config.json; scripts/gate-parity.py
  # refuses a target no part names. The `codeflow gates` job below is the one
  # verdict that branch rules and the release authority read.
  gates:
    if: github.event_name == 'pull_request' && contains(fromJSON('["main","master"]'), github.event.pull_request.base.ref) || github.event_name == 'push'
    name: codeflow gates (${{ matrix.part }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # The instrumented suite is the longest part; the journey gate
          # reads its results, so it runs on the same runner.
          - part: coverage
            only: rust-coverage,journey-gate
          # Exclusive: the benchmark times reads, so it runs alone.
          # visual-eval-controls sits here to balance the parts. Both portal
          # targets require docs-portal-deps, the one target that runs
          # `npm ci` for docs-portal, so a part installs it once (gate-parity
          # refuses a second installer).
          - part: benchmark
            only: read-benchmark,visual-eval-controls
          - part: present
            only: present-supply-chain,cf-present-qualification,present-browser,present-binary-delta
          - part: checks
            only: rust-format,rust-clippy,rust-doctest,rustdoc,release-automation,gate-parity,model-eval-kit,skill-triggers,herdr-delivery,docs-validation,docs-portal
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # This repo IS codeflow, so it builds the binary from source rather than
      # using the release installer a consumer project would. These gates block.
      # The toolchain is pinned in rust-toolchain.toml (the single source of
      # truth rustup honors locally and here); installing from it means a
      # floating stable clippy cannot break CI out from under a green local run.
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      # Each part builds different things (instrumented, release, debug), so
      # each keeps its own cache.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.part }}
      # Each Node target pins its version in a version file, and the full
      # gate runs it through scripts/with-node.py, which finds that version
      # here in the tool cache (TSK-142). gate-parity holds these pins to
      # the version files. The later setup is first on PATH.
      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: docs-portal/package-lock.json
      - uses: actions/setup-node@v6
        with:
          node-version: 26.4.0
          cache: npm
          cache-dependency-path: crates/codeflow-present/web/package-lock.json

      - name: Install exact npm for the owned presentation renderer
        run: npm install --global npm@11.17.0

      # The present browser checks launch Firefox and WebKit through
      # Playwright's own builds, which a clean runner does not have. The
      # renderer's locked playwright-core installs them, so the browsers match
      # the version both Node workspaces lock (checked equal here). Every part
      # gets the same environment the single gate had.
      - name: Read the locked Playwright version
        id: playwright
        run: |
          present=$(node -p "require('./crates/codeflow-present/web/package-lock.json').packages['node_modules/playwright-core'].version")
          portal=$(node -p "require('./docs-portal/package-lock.json').packages['node_modules/playwright-core'].version")
          test "$present" = "$portal" || { echo "playwright-core differs: present $present, portal $portal"; exit 1; }
          echo "version=$present" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Playwright browsers from the lockfile
        run: |
          npm ci --ignore-scripts --prefix crates/codeflow-present/web
          crates/codeflow-present/web/node_modules/.bin/playwright-core install --with-deps chromium firefox webkit

      # One instrumented suite owns Linux test and coverage evidence.
      - name: Install nextest and llvm-cov
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-nextest@0.9.129,cargo-llvm-cov@0.8.4

      - name: Build codeflow from source
        run: |
          cargo build --release -p codeflow-cli
          echo "${GITHUB_WORKSPACE}/target/release" >> "$GITHUB_PATH"

      # What adopters get passes their secret scan (TSK-206): fresh scaffolds
      # of every tier from the binary just built, and the adopter CI
      # template's own gitleaks step, with the pinned gitleaks.
      - name: Scaffold secret scan
        if: matrix.part == 'checks'
        run: |
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" -o "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          sh scripts/check-scaffold-gitleaks.sh "$RUNNER_TEMP/gitleaks" "$(command -v codeflow)"

      # The Linux candidate has one full gate, split into the parts above.
      # Windows independently runs raw Rust checks; Unix-only journeys and the
      # read benchmark remain Linux-only.
      # The coverage run starts about 31,000 instrumented processes.
      # One profile per process filled 27.5 GB on Linux, more than the
      # runner's free disk; a merge pool of four per binary keeps under 100 MB
      # with the same counters. cargo-llvm-cov reads this name.
      - name: codeflow test --mode full --strict
        shell: bash
        env:
          LLVM_PROFILE_FILE_NAME: codeflow-%4m.profraw
        run: codeflow test --mode full --strict --all --only ${{ matrix.only }}

  # The required check. It runs even when a part fails or is cancelled, so
  # the check is never skipped, and it passes only when every part passed.
  gates-verdict:
    if: always() && (github.event_name == 'pull_request' && contains(fromJSON('["main","master"]'), github.event.pull_request.base.ref) || github.event_name == 'push')
    name: codeflow gates
    needs: gates
    runs-on: ubuntu-24.04
    steps:
      - name: Every part of the full gate passed
        shell: bash
        env:
          PARTS: ${{ needs.gates.result }}
        run: |
          if [ "$PARTS" != success ]; then
            echo "::error::the full gate's parts concluded ${PARTS}; see the codeflow gates (part) jobs"
            exit 1
          fi
          echo "every part of the full gate passed"

  # Native Windows is a release target again (TSK-197). The raw referee is
  # split in three: the nextest suite in partitions that together run every
  # test once, the other Rust and Node checks beside them, and the journey
  # gate over every partition's results. The `windows` verdict below is the
  # one check branch rules and .release/config.json read.
  windows-tests:
    if: github.event_name == 'pull_request' && contains(fromJSON('["main","master"]'), github.event.pull_request.base.ref) || github.event_name == 'push'
    name: windows tests (${{ matrix.partition }} of 6)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        partition: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      # Saved even when tests fail, so a red run does not force the next one
      # to rebuild the dependencies from scratch. The cache holds
      # dependencies only, never workspace crates.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-nextest@0.9.129

      - name: cargo nextest run (one partition)
        run: cargo nextest run --workspace --no-fail-fast --profile codeflow --partition count:${{ matrix.partition }}/6

      - name: Keep this partition's results for the journey gate
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-junit-${{ matrix.partition }}
          path: target/nextest/codeflow/junit.xml
          if-no-files-found: ignore
          retention-days: 7

  windows:
    if: github.event_name == 'pull_request' && contains(fromJSON('["main","master"]'), github.event.pull_request.base.ref) || github.event_name == 'push'
    name: windows checks (fmt, doc, clippy, Node)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: cargo fmt --all --check
        run: cargo fmt --all -- --check

      - name: cargo doctests
        run: cargo test --workspace --doc

      - name: cargo rustdoc
        shell: bash
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

      - name: cargo clippy --workspace --all-targets -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

      - uses: actions/setup-node@v6
        with:
          node-version: 24.18.0
          cache: npm
          cache-dependency-path: docs-portal/package-lock.json

      - name: docs portal JavaScript authority suite
        run: |
          npm run deps:install --prefix docs-portal
          node --test docs-portal/tests/adapter.test.mjs docs-portal/tests/composition.test.mjs docs-portal/tests/figure-grammar.test.mjs

      # The docs-portal target ends by validating the portal with codeflow,
      # so the cmd.exe check needs a built binary.
      - name: Build codeflow for the portal target
        run: cargo build --locked -p codeflow-cli

      - name: Windows Node target through cmd.exe
        shell: bash
        run: CODEFLOW_BIN="$(cygpath -m "$PWD")/target/debug/codeflow.exe" python scripts/test_gate_parity.py

  # Consume this raw run's exact results from every partition. Unix-only
  # journeys and the own read-benchmark target are disclosed as skipped on
  # Windows. It runs when a partition fails, so the journeys still report.
  windows-journeys:
    if: always() && (github.event_name == 'pull_request' && contains(fromJSON('["main","master"]'), github.event.pull_request.base.ref) || github.event_name == 'push')
    name: windows journeys
    needs: windows-tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Begin journey check
        shell: bash
        run: |
          rm -rf target/nextest/partitions
          echo "CODEFLOW_GATE_STARTED_AT=$(python -c 'import time; print(time.time())')" >> "$GITHUB_ENV"

      - name: Fetch every partition's results from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: windows-junit-*
          path: target/nextest/partitions

      - name: journey gate
        shell: bash
        run: python scripts/test_journey_gate.py && python scripts/journey-gate.py --results target/nextest/partitions --skip-benchmark

  # The required Windows check. Like `codeflow gates`, it runs even when a
  # job fails or is cancelled, so it is never skipped, and it passes only
  # when the checks, every test partition and the journey gate passed.
  windows-verdict:
    if: always() && (github.event_name == 'pull_request' && contains(fromJSON('["main","master"]'), github.event.pull_request.base.ref) || github.event_name == 'push')
    name: windows
    needs: [windows, windows-tests, windows-journeys]
    runs-on: ubuntu-24.04
    steps:
      - name: Every Windows job passed
        shell: bash
        env:
          CHECKS: ${{ needs.windows.result }}
          TESTS: ${{ needs.windows-tests.result }}
          JOURNEYS: ${{ needs.windows-journeys.result }}
        run: |
          if [ "$CHECKS" != success ] || [ "$TESTS" != success ] || [ "$JOURNEYS" != success ]; then
            echo "::error::Windows concluded checks=${CHECKS} tests=${TESTS} journeys=${JOURNEYS}; see the windows jobs"
            exit 1
          fi
          echo "every Windows job passed"

  secret-scan:
    name: secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The gitleaks step is the adopter template's (TSK-210);
      # scripts/check-scaffold-gitleaks.sh keeps the two the same.
      # Run the gitleaks binary directly (pinned) rather than the
      # gitleaks-action wrapper, which requires a GitHub token/license. The
      # archive is downloaded and unpacked under the runner's temp directory,
      # never in the checkout, so a file or link a pull request commits at
      # that name is not written through.
      #
      # Every exemption comes from the trusted commit: the pull request's
      # base, or the pushed commit on a push. A pull request cannot exempt
      # the leak it adds; a new exemption takes effect once its own pull
      # request merges. The step fails before it scans when that commit is
      # not in the checkout. It deletes the checkout's .gitleaksignore,
      # .gitleaks.toml and .gitleaks.json (a link is removed, never
      # followed) and gives gitleaks the trusted commit's copies, choosing
      # the configuration as gitleaks does: GITLEAKS_CONFIG, then
      # GITLEAKS_CONFIG_TOML, then .gitleaks.json beside .gitleaks.toml, then
      # .gitleaks.toml, else the default rules. An inline gitleaks:allow
      # comment counts only on a commit the trusted commit already holds.
      #
      # gitleaks resolves an [extend] path, and a relative GITLEAKS_CONFIG,
      # against its working directory. It runs from a directory that holds
      # the trusted commit's copy of each file the configuration extends and
      # nothing else, so the pull request's copy is never read and a file the
      # trusted commit lacks fails the step. Copying the chain keeps an
      # existing extended configuration working, which refusing every
      # [extend] path would break. An absolute path into the checkout is
      # refused; name the file relative to the repository root instead. A
      # file outside the checkout is read where it is, and
      # [extend] useDefault = true needs no file.
      #
      # Nothing from the checkout runs or steers the scan. The Python
      # helpers run isolated (python3 -I), so a module the pull request
      # commits beside them is never imported; they need Python 3.11 or
      # later, for tomllib. git reads .gitattributes from the trusted commit
      # (GIT_ATTR_SOURCE, git 2.41 or later), so a pull request cannot mark
      # its own files -diff to hide their changes.
      # No step before this one runs code from the checkout: a step that
      # did could write GITHUB_ENV or GITHUB_PATH for this one, so
      # GITLEAKS_CONFIG and GITLEAKS_CONFIG_TOML here can only come from
      # this workflow's own env. Keep it that way when you add steps. A
      # workflow you customised before this protection may already run such
      # a step; codeflow update keeps it and warns until you move it after
      # this step or into another job.
      #
      # gitleaks' default git log leaves out what a merge itself adds, any
      # file whose type changes and any file git judges binary, so a secret
      # added in a merge resolution, in a file that replaces a link, or
      # after a NUL byte would go unread. The scan names its own log
      # options: --remerge-diff shows only what each merge adds beyond its
      # automatic result, so a branch's commits are not reported twice; the
      # diff filter keeps type changes; --text shows every file as text; and
      # no external diff or textconv filter rewrites what git shows.
      # gitleaks runs git from PATH, and the git it finds there drops the
      # "remerge" notes that --remerge-diff writes into a conflicted file's
      # header. gitleaks' patch parser does not know them and would name the
      # file b/<path>, so an exemption for a real b/ path could apply to it.
      # That git also pins the patch format whatever the runner's git
      # configuration says: the a/ and b/ prefixes, quoted names, no colour,
      # the medium format with full hashes and the root commit's diff. With
      # diff.noprefix, for one, gitleaks would drop each path's first
      # directory, and an exemption for leak.txt would cover dir/leak.txt.
      #
      # gitleaks reads only the commits the event brings (SCAN_FROM..HEAD):
      # on a pull request, what the pull request merged into its base holds
      # and the base does not; on a push, what the pushed commit holds and
      # the previous tip did not. A finding already in the base, or on a
      # branch the pull request does not bring, is not this change's to fix
      # and does not fail it. The weekly and manual runs, a push that
      # creates the branch and a push whose previous tip is not in the
      # checkout (a force push) read the whole history of HEAD instead, so
      # every commit on the default branch is scanned once as it arrives
      # and again each week. No run reads a branch or tag that HEAD does
      # not reach, so an unrelated ref can neither fail this scan nor hide a
      # leak from it. The step prints which history it read. A range that
      # changes no file has nothing to scan and passes. Before gitleaks
      # runs, the step checks only the
      # history the pull request brings, the commits HEAD holds and the
      # trusted commit does not, for what gitleaks cannot read reliably, and
      # names the commit and the refs that hold it. On a push that range is
      # empty, since the pushed commit is the trusted commit, so a push scan
      # reads its history without these refusals. git cannot show what an octopus merge (three or more
      # parents) adds, so one in that range is refused; merge the branches one
      # at a time. gitleaks' patch parser misreads some names that git
      # quotes: it skips one that ends in a backslash without an error, and a
      # newline in a name splits a conflicted merge's header into lines the
      # wrapper cannot tell apart. So the step refuses a path with a
      # backslash, a double quote or a control character that a commit in the
      # range adds, changes, renames or copies, or that a merge in it changes
      # beyond its automatic result. A conflicted merge's header can also name
      # a file either side renamed or deleted, the trusted side included, so
      # each merge's own sides count too: every path that differs between a
      # merge base and either parent. Renaming the file in a later commit
      # leaves the name in the earlier one, so the fix is to rewrite the pull
      # request's commits, or, for a change on the trusted side, to rebase
      # onto the base instead of merging it in. Names with spaces or
      # non-ASCII letters are read correctly and pass, and gitleaks is not
      # shown deleted files, so a pull request that merges nothing may delete
      # such a file. History the trusted commit holds is not checked: it met
      # these checks, or predates them, when it merged.
      #
      # The step then drops one known false positive from the report: the
      # security-stage prose CodeFlow 3.0.0 seeded on line 209 of the
      # pipeline workflow ("vulnerable/malicious deps"), which the
      # generic-api-key rule mistakes for a key. Only a generic-api-key
      # finding whose value and matched text are exactly that prose, in one
      # of those two paths exactly, is dropped; anything else, on the same
      # line included, fails the job. So does a scan that logs an error or
      # reads no commit.
      - name: gitleaks
        env:
          TRUSTED_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
          SCAN_FROM: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          case ${TRUSTED_SHA:-} in
            '' | *[!0-9a-f]*)
              echo "::error::no trusted commit to read exemptions from; refusing to scan"; exit 1 ;;
          esac
          if ! git cat-file -e "${TRUSTED_SHA}^{commit}" 2>/dev/null; then
            echo "::error::trusted commit ${TRUSTED_SHA} is not in the checkout; refusing to scan"; exit 1
          fi
          # The history the scan reads: the event's own commits when it
          # names a start the checkout holds, else all of HEAD's.
          scan=HEAD
          case ${SCAN_FROM:-} in
            '') scope="the full history of HEAD (a scheduled or manual run)" ;;
            *[!0-9a-f]*)
              echo "::error::scan start ${SCAN_FROM} is not a commit id; refusing to scan"; exit 1 ;;
            *[!0]*)
              if git cat-file -e "${SCAN_FROM}^{commit}" 2>/dev/null; then
                scan="${SCAN_FROM}..HEAD"
                scope="the $(git rev-list --count HEAD --not "$SCAN_FROM") commit(s) HEAD holds and ${SCAN_FROM} does not"
              else
                scope="the full history of HEAD (the previous tip ${SCAN_FROM} is not in the checkout)"
              fi ;;
            *) scope="the full history of HEAD (the push created the branch)" ;;
          esac
          echo "Secret scan reads ${scope}."
          if ! git version | awk '{ split($3, v, "."); exit !(v[1] > 2 || (v[1] == 2 && v[2] >= 41)) }'; then
            echo "::error::$(git version) cannot read .gitattributes from the trusted commit; upgrade git to 2.41 or later; refusing to scan"; exit 1
          fi
          export GIT_ATTR_SOURCE="$TRUSTED_SHA"
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tool=$(mktemp -d "$RUNNER_TEMP/gitleaks-tool.XXXXXX")
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" -o "$tool/$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$tool/$archive" | sha256sum -c -
          tar -xzf "$tool/$archive" -C "$tool" gitleaks
          workspace=$(pwd -P)
          trusted=$(mktemp -d "$RUNNER_TEMP/gitleaks-trusted.XXXXXX")
          mkdir "$trusted/tree"
          real_git=$(command -v git)
          mkdir "$trusted/bin"
          cat >"$trusted/bin/git" <<GIT
          #!/bin/bash
          set -o pipefail
          pin=(-c core.quotePath=true -c diff.noprefix=false -c diff.mnemonicPrefix=false
            -c diff.srcPrefix=a/ -c diff.dstPrefix=b/ -c diff.relative=false -c color.ui=false
            -c color.diff=false -c format.pretty=medium -c log.date=default -c log.decorate=false
            -c log.abbrevCommit=false -c log.showSignature=false -c log.showRoot=true)
          if [ "\$1" = -C ] && [ "\$3" = log ]; then
            "$real_git" "\${pin[@]}" "\$@" | sed '/^remerge /d'
            exit
          fi
          exec "$real_git" "\${pin[@]}" "\$@"
          GIT
          chmod +x "$trusted/bin/git"
          export PATH="$trusted/bin:$PATH"
          # Refuses what gitleaks cannot read reliably in the history the pull
          # request brings: what HEAD holds and the trusted commit does not.
          python3 -I - "$TRUSTED_SHA" <<'PY'
          import re
          import subprocess
          import sys

          sha = sys.argv[1]
          unreadable = "gitleaks cannot read a backslash, double quote or control character in a path reliably"
          rewrite = ("rewrite the pull request's commits so that none uses the name; "
                     "renaming it in a later commit leaves it in this one")


          def refuse(message):
              print(f"::error::{message}; refusing to scan")
              sys.exit(1)


          def git(*args, codes=(0,)):
              run = subprocess.run(["git", *args], capture_output=True, check=False)
              if run.returncode not in codes:
                  error = run.stderr.decode("utf-8", "replace").strip()
                  refuse(f"git {args[0]} failed ({error}), so the step cannot check the history the pull request brings")
              return run


          def where(commit):
              refs = git("for-each-ref", "--contains", commit, "--format=%(refname)").stdout.decode("utf-8", "replace").split()
              more = f" and {len(refs) - 5} more" if len(refs) > 5 else ""
              return f"{commit} (in {', '.join(['HEAD', *refs[:5]])}{more})"


          def odd(name):
              return any(c < 32 or c == 127 or c in b'"\\' for c in name)


          def named(name):
              return ascii(name.decode("utf-8", "replace"))[1:-1]


          commits = [line.split() for line in git("rev-list", "--parents", "HEAD", "--not", sha).stdout.decode().splitlines()]
          for commit, *parents in commits:
              if len(parents) > 2:
                  refuse(f"octopus merge {where(commit)} is not in the trusted commit, and git cannot show what it adds; "
                         "rewrite the pull request's history to merge its branches one at a time")
          # Each path a commit adds, changes, renames or copies, and each path
          # a merge changes beyond its automatic result.
          listing = git("log", "-z", "--format=%x01%H", "--name-status", "--diff-filter=uxdb", "--remerge-diff",
                        "--no-ext-diff", "HEAD", "--not", sha).stdout.split(b"\0")
          commit, names = None, 0
          for token in listing:
              if names:
                  names -= 1
                  if odd(token):
                      refuse(f"commit {where(commit)} adds, changes or renames the path \"{named(token)}\"; {unreadable}; {rewrite}")
                  continue
              token = token.lstrip(b"\n")
              if token.startswith(b"\x01"):
                  commit = token[1:].decode()
              elif re.fullmatch(rb"[RC][0-9]*", token):
                  names = 2
              elif re.fullmatch(rb"[A-Z][0-9]*", token):
                  names = 1
              elif token:
                  refuse(f"cannot read git's list of the paths that commit {commit} changes")
          # A conflicted merge's header can also name a path that either side
          # changed since a merge base, the trusted side included.
          empty = git("hash-object", "-t", "tree", "/dev/null").stdout.decode().strip()
          for commit, *parents in commits:
              if len(parents) != 2:
                  continue
              bases = git("merge-base", "--all", *parents, codes=(0, 1)).stdout.decode().split() or [empty]
              for base in bases:
                  for parent in parents:
                      for name in git("diff-tree", "-r", "-z", "--name-only", base, parent).stdout.split(b"\0"):
                          if odd(name):
                              held = git("merge-base", "--is-ancestor", parent, sha, codes=(0, 1)).returncode == 0
                              fix = "rebase the pull request onto the trusted commit instead of merging it in" if held else rewrite
                              refuse(f"merge {where(commit)} joins a change to the path \"{named(name)}\" made on its "
                                     f"parent {parent}; {unreadable}; {fix}")
          PY
          rm -f .gitleaksignore .gitleaks.toml .gitleaks.json
          # Writes the trusted ignore file, the configuration when gitleaks
          # needs one named, and each file that configuration extends.
          python3 -I - "$TRUSTED_SHA" "$workspace" "$trusted" <<'PY'
          import json
          import os
          import subprocess
          import sys
          import tomllib

          sha, workspace, trusted = sys.argv[1:]
          os.environ["GIT_LITERAL_PATHSPECS"] = "1"


          def refuse(message):
              print(f"::error::{message}")
              sys.exit(1)


          def in_checkout(path):
              return any(p == workspace or p.startswith(workspace + os.sep)
                         for p in (os.path.normpath(path), os.path.realpath(path)))


          def blob(path):
              """The trusted commit's regular file at a repository path, or None."""
              listing = subprocess.run(["git", "ls-tree", "-z", sha, "--", path],
                                       capture_output=True, check=True).stdout
              entry = listing.split(b"\0")[0]
              if not entry:
                  return None
              mode, kind, oid = entry.split(b"\t")[0].decode().split(" ")
              if kind != "blob" or mode not in ("100644", "100755"):
                  refuse(f"{path} on trusted commit {sha} is not a regular file; commit the file itself")
              return subprocess.run(["git", "cat-file", "blob", oid],
                                    capture_output=True, check=True).stdout


          def in_repository(path, owner):
              rel = os.path.normpath(path)
              if rel == ".." or rel.startswith("../"):
                  refuse(f"{owner} names {path}, outside the repository; use an absolute path")
              data = blob(rel)
              if data is None:
                  refuse(f"{owner} names {rel}, which trusted commit {sha} does not hold; commit it there first")
              return rel, data


          def extended(text):
              # Keys match without case, as gitleaks reads them. A file that
              # does not parse is left to gitleaks, which fails to load it.
              for parse in (tomllib.loads, json.loads):
                  try:
                      data = parse(text)
                      break
                  except ValueError:
                      continue
              else:
                  return None
              if not isinstance(data, dict):
                  return None
              extend = next((v for k, v in data.items() if k.lower() == "extend"), None)
              if not isinstance(extend, dict):
                  return None
              path = next((v for k, v in extend.items() if k.lower() == "path"), None)
              return path if isinstance(path, str) and path else None


          def walk(text, owner):
              seen = set()
              while (path := extended(text)) is not None:
                  if os.path.isabs(path):
                      if in_checkout(path):
                          refuse(f"{owner} extends {path}, a file in the checkout that the pull request can change; "
                                 "name it relative to the repository root")
                      if path in seen or not os.path.isfile(path):
                          return
                      seen.add(path)
                      with open(path, encoding="utf-8", errors="replace") as handle:
                          owner, text = path, handle.read()
                      continue
                  rel, data = in_repository(path, owner)
                  if rel in seen:
                      return
                  seen.add(rel)
                  target = os.path.join(trusted, "tree", rel)
                  os.makedirs(os.path.dirname(target), exist_ok=True)
                  with open(target, "wb") as handle:
                      handle.write(data)
                  owner, text = rel, data.decode("utf-8", "replace")


          def use(data, owner):
              with open(os.path.join(trusted, "config.toml"), "wb") as handle:
                  handle.write(data)
              walk(data.decode("utf-8", "replace"), owner)


          ignore = blob(".gitleaksignore")
          if ignore is not None:
              with open(os.path.join(trusted, "ignore"), "wb") as handle:
                  handle.write(ignore)
          named = os.environ.get("GITLEAKS_CONFIG", "")
          if named and os.path.isabs(named) and not in_checkout(named):
              if os.path.isfile(named):
                  with open(named, encoding="utf-8", errors="replace") as handle:
                      walk(handle.read(), named)
          elif named:
              rel, data = in_repository(os.path.relpath(os.path.join(workspace, named), workspace), "GITLEAKS_CONFIG")
              use(data, rel)
          elif os.environ.get("GITLEAKS_CONFIG_TOML", ""):
              walk(os.environ["GITLEAKS_CONFIG_TOML"], "GITLEAKS_CONFIG_TOML")
          elif (toml := blob(".gitleaks.toml")) is not None:
              beside = blob(".gitleaks.json")
              if beside is None:
                  use(toml, ".gitleaks.toml")
              else:
                  use(beside, ".gitleaks.json")
          PY
          set --
          if [ -f "$trusted/config.toml" ]; then set -- --config "$trusted/config.toml"; fi
          if [ "$scan" != HEAD ]; then
            if ! files=$(git log --format= --name-only --diff-filter=uxdb --remerge-diff --no-ext-diff "$scan"); then
              echo "::error::cannot list the file changes in ${scope}; refusing to skip the scan"; exit 1
            fi
            changed=$(printf '%s\n' "$files" | awk 'NF { n++ } END { print n + 0 }')
            if [ "$changed" -eq 0 ]; then
              echo "No file changes in ${scope}; nothing to scan."
              exit 0
            fi
          fi
          # The report stays in the runner's temp directory; the log names
          # each finding's rule, file, line and commit, never its value.
          report="$RUNNER_TEMP/gitleaks-report.json"
          log="$RUNNER_TEMP/gitleaks.log"
          rc=0
          (cd "$trusted/tree" && "$tool/gitleaks" detect --source "$workspace" "$@" \
            --log-opts "--full-history --diff-filter=uxdb --remerge-diff --text --no-ext-diff --no-textconv ${scan}" \
            --gitleaks-ignore-path "$trusted/ignore" --ignore-gitleaks-allow \
            --no-banner --log-level debug --exit-code 0 \
            --report-format json --report-path "$report") 2>"$log" || rc=$?
          # gitleaks exits 0 when git fails, even part way through, and logs
          # git's failure only at debug level. Debug lines can quote decoded
          # file content, so they stay in the temp file; the job log gets
          # info and above. Each check reads only gitleaks' own message,
          # which follows the time and level, so scanned text never matches.
          plain=$(sed $'s/\033\\[[0-9;]*m//g' "$log")
          printf '%s\n' "$plain" | grep -E '^[^ ]+ (INF|WRN|ERR|FTL) ' >&2 || true
          scanned=$(printf '%s\n' "$plain" | sed -n 's/^[^ ]* INF \([0-9][0-9]*\) commits scanned\..*/\1/p' | tail -n 1)
          if [ "$rc" -ne 0 ] || printf '%s\n' "$plain" | grep -qE '^[^ ]+ (ERR|FTL) |^[^ ]+ DBG command aborted' \
            || [ "${scanned:-0}" -eq 0 ] || ! jq -e 'type == "array"' "$report" >/dev/null 2>&1; then
            echo "::error::gitleaks did not complete a scan (exit ${rc}, ${scanned:-no} commits read)"
            exit 1
          fi
          # The report holds no line text, so an inline gitleaks:allow is read
          # from the commit that holds the finding, and only a commit the
          # trusted commit already holds counts.
          held=$(python3 -I - "$report" "$TRUSTED_SHA" <<'PY'
          import json
          import re
          import subprocess
          import sys

          report, sha = sys.argv[1:]
          held = []
          with open(report, encoding="utf-8") as handle:
              findings = json.load(handle)
          for finding in findings:
              commit = finding.get("Commit") or ""
              if not re.fullmatch(r"[0-9a-f]{40,64}", commit):
                  continue
              ancestor = subprocess.run(["git", "merge-base", "--is-ancestor", commit, sha],
                                        capture_output=True)
              if ancestor.returncode:
                  continue
              shown = subprocess.run(["git", "cat-file", "blob", f"{commit}:{finding['File']}"],
                                     capture_output=True)
              start = max(finding["StartLine"], 1)
              lines = shown.stdout.split(b"\n")[start - 1:max(finding["EndLine"], start)]
              if shown.returncode == 0 and any(b"gitleaks:allow" in line for line in lines):
                  held.append(finding["Fingerprint"])
          print(json.dumps(held))
          PY
          )
          if [ "$held" != "[]" ]; then
            echo "Allowed $(printf '%s' "$held" | jq length) finding(s) marked gitleaks:allow on commits the trusted commit holds."
          fi
          findings="$RUNNER_TEMP/gitleaks-findings.json"
          jq --argjson held "$held" '[.[] | select(.Fingerprint as $f | any($held[]; . == $f) | not)]' "$report" >"$findings"
          # The text is split so this file does not hold the text it allows.
          known='select(.RuleID == "generic-api-key" and .Secret == ("vulnerable/" + "malicious") and .Match == ("authz gaps, vulnerable/" + "malicious ") and (.File == ".claude/workflows/pipeline.workflow.js" or .File == ".codeflow/.baseline/.claude/workflows/pipeline.workflow.js"))'
          allowed=$(jq "[.[] | $known] | length" "$findings")
          if [ "$allowed" -gt 0 ]; then
            echo "Allowed ${allowed} finding(s) of the CodeFlow 3.0.0 pipeline prose \"vulnerable/malicious\"."
          fi
          leaks=$(jq "[.[] | select(([.] | map($known) | length) == 0)]" "$findings")
          count=$(printf '%s' "$leaks" | jq length)
          if [ "$count" -gt 0 ]; then
            # Workflow-command properties escape %, CR, LF, : and , in names.
            printf '%s' "$leaks" | jq -r '.[] | "::error file=\(.File | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A") | gsub(":"; "%3A") | gsub(","; "%2C")),line=\(.StartLine)::gitleaks \(.RuleID) in commit \(.Commit[0:12])"'
            echo "gitleaks found ${count} leak(s)."
            exit 1
          fi
          echo "No leaks found."

  # The pull request's own .gitleaks.toml still reports novel credentials
  # (TSK-198). The check runs the pull request's own script, so it has a
  # job of its own: a step before the scan in the secret-scan job could
  # steer the scan through GITHUB_ENV or GITHUB_PATH.
  gitleaks-canary:
    name: gitleaks allowlist canary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: gitleaks allowlist canary
        run: |
          GITLEAKS_VERSION=8.30.1
          GITLEAKS_SHA256=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" -o "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks
          sh scripts/check-gitleaks-allowlist.sh "$RUNNER_TEMP/gitleaks"

  security-review:
    name: security review
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Dependency / supply-chain audit — the deterministic floor the
      # cf-security-reviewer red-team layers on (CodeFlow ADR-0016; OWASP
      # A03:2025). Pinned
      # osv-scanner reads every lockfile ecosystem (here Cargo.lock), so it is the
      # stack-agnostic floor. Enforcement reads two .codeflow/policy.json keys:
      # `git.security_review` (umbrella gate for the whole security-review job) and
      # `git.dep_audit` (SCA-specific sub-gate). The advisory blocks when EITHER is
      # `block`, reports when either is `warn` (the default), and is skipped only
      # when BOTH are `off`. Record justified suppressions in an osv-scanner.toml
      # beside the lockfile they cover (with no --config, as here, osv-scanner
      # reads no other name and no parent directory) so a transitive advisory
      # in unchanged code cannot block a PR.
      # Both keys are read from the trusted commit: the pull request's base,
      # or the pushed commit on a push, so a pull request cannot lower the
      # level that judges it. A missing policy file, a missing or unreadable
      # key, or a value other than block, warn or off fails the job;
      # `codeflow update` adds missing keys with their defaults.
      # Suppressions also come from the trusted commit: the step replaces every
      # osv-scanner.toml in the checkout with the trusted commit's copies, so a
      # new suppression takes effect once its own pull request lands.
      # osv-scanner runs with --no-ignore, so a .gitignore the change edits
      # cannot hide a lockfile from the audit.
      - name: dependency audit (osv-scanner)
        env:
          TRUSTED_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          set -u
          case ${TRUSTED_SHA:-} in
            '') echo "::error::no trusted commit to read the security policy from; failing closed"; exit 1 ;;
          esac
          if ! policy=$(git show "${TRUSTED_SHA}:.codeflow/policy.json" 2>/dev/null); then
            echo "::error::cannot read .codeflow/policy.json at the trusted commit ${TRUSTED_SHA}; the security review fails closed until it is committed there"
            exit 1
          fi
          sr=$(printf '%s' "$policy" | jq -er '.git.security_review' 2>/dev/null) || sr=
          da=$(printf '%s' "$policy" | jq -er '.git.dep_audit' 2>/dev/null) || da=
          for key in security_review dep_audit; do
            if [ "$key" = security_review ]; then value=$sr; else value=$da; fi
            case $value in
              block|warn|off) ;;
              *) echo "::error::git.${key} in .codeflow/policy.json at the trusted commit ${TRUSTED_SHA} is missing or not block, warn or off; the security review fails closed. Run \`codeflow update\` to add a missing key, or set block, warn or off."
                 exit 1 ;;
            esac
          done
          echo "Security policy from trusted commit ${TRUSTED_SHA}: security_review=${sr}, dep_audit=${da}."
          python3 -I -c '
          import os, subprocess, sys
          sha = sys.argv[1]
          name = b"osv-scanner.toml"
          def refuse(message):
              print(f"::error::{message}; failing closed")
              sys.exit(1)
          # Remove every suppression file the checkout holds, links included.
          for top, dirs, files in os.walk(b".", followlinks=False):
              dirs[:] = [d for d in dirs if d != b".git"]
              for entry in files:
                  if entry == name:
                      os.unlink(os.path.join(top, entry))
          listing = subprocess.run(["git", "ls-tree", "-r", "-z", "--full-tree", sha],
                                   check=True, capture_output=True).stdout
          for record in filter(None, listing.split(b"\0")):
              meta, path = record.split(b"\t", 1)
              mode, _, blob = meta.split()
              if os.path.basename(path) != name:
                  continue
              shown = path.decode("utf-8", "replace")
              if mode not in (b"100644", b"100755"):
                  refuse(f"{shown} on trusted commit {sha} is not a regular file")
              where = b"."
              for part in path.split(b"/")[:-1]:
                  where = os.path.join(where, part)
                  if os.path.islink(where) or (os.path.lexists(where) and not os.path.isdir(where)):
                      refuse(f"the change replaces a folder holding {shown} with a link or a file")
                  os.makedirs(where, exist_ok=True)
              data = subprocess.run(["git", "cat-file", "blob", blob.decode()],
                                    check=True, capture_output=True).stdout
              fd = os.open(os.path.join(b".", path), os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o644)
              with os.fdopen(fd, "wb") as out:
                  out.write(data)
              print(f"osv-scanner suppressions from trusted commit: {shown}")
          ' "$TRUSTED_SHA"
          if [ "$sr" = "block" ] || [ "$da" = "block" ]; then
            level=block
          elif [ "$sr" = "off" ] && [ "$da" = "off" ]; then
            echo "security_review=off and dep_audit=off — skipping."; exit 0
          else
            level=warn
          fi

          OSV_VERSION=2.4.0
          OSV_SHA256=15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
          # Download outside the checkout, so a link the change commits at the
          # download path cannot redirect the write.
          tool=$(mktemp -d "${RUNNER_TEMP:?}/osv-tool.XXXXXX")
          curl -sSfL "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" -o "$tool/osv-scanner"
          printf '%s  %s\n' "$OSV_SHA256" "$tool/osv-scanner" | sha256sum -c -
          chmod +x "$tool/osv-scanner"

          set +e
          out=$("$tool/osv-scanner" scan -r --no-ignore . 2>&1); rc=$?
          set -e
          printf '%s\n' "$out"

          # The verdict comes from osv-scanner's exit status (0 no advisories,
          # 1 advisories, 127 error, 128 no package sources), never from its
          # output, which repeats file paths the change chooses. A 128 that
          # also reports a file it could not extract is a scan error.
          if [ "$rc" -eq 0 ]; then
            echo "No known advisories."
          elif [ "$rc" -eq 128 ] && ! printf '%s' "$out" | grep -qi 'error during extraction'; then
            echo "No scannable manifests found — nothing to audit."
          elif [ "$level" = "block" ]; then
            echo "::error::dependency advisories found (or scan error, exit ${rc}) and policy git.security_review=${sr} / git.dep_audit=${da} (either is block) — failing. Triage, or record a justified suppression in an osv-scanner.toml beside the lockfile."
            exit 1
          else
            echo "::warning::dependency advisories found (or scan error, exit ${rc}); policy git.security_review=${sr} / git.dep_audit=${da} → reporting only. Harden either to block once triaged."
          fi
