name: release source authority
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
permissions:
  contents: write
  pull-requests: read
  checks: read
concurrency:
  group: codeflow-release-publication
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Keep dry runs non-publishing
        if: github.event.inputs.tag == 'dry-run'
        env:
          PLAN_JSON: ${{ inputs.plan }}
        run: |
          printf '%s' "$PLAN_JSON" | jq -e '.ci.github.pr_run_mode == "plan"' >/dev/null
          echo "Dry-run plan accepted; no hosted state changed."
      - name: Verify deliberate current-main authority
        if: github.event.inputs.tag != 'dry-run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PLAN_JSON: ${{ inputs.plan }}
          REQUESTED_TAG: ${{ github.event.inputs.tag }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)
          test "$GITHUB_SHA" = "$main_sha"

          jq -n --arg event "$GITHUB_EVENT_NAME" --arg ref "$GITHUB_REF" \
            --arg actor "$GITHUB_ACTOR" --arg rerunner "$GITHUB_TRIGGERING_ACTOR" \
            '{event_name:$event,ref:$ref,actor:$actor,triggering_actor:$rerunner}' \
            > /tmp/authority-event.json
          printf '{}\n' > /tmp/authority-users.json
          printf '{}\n' > /tmp/authority-permissions.json
          for login in "$GITHUB_ACTOR" "$GITHUB_TRIGGERING_ACTOR"; do
            type=$(gh api "users/${login}" --jq .type)
            permission=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${login}/permission" --jq .permission)
            jq --arg login "$login" --arg value "$type" '. + {($login):$value}' \
              /tmp/authority-users.json > /tmp/next && mv /tmp/next /tmp/authority-users.json
            jq --arg login "$login" --arg value "$permission" '. + {($login):$value}' \
              /tmp/authority-permissions.json > /tmp/next && mv /tmp/next /tmp/authority-permissions.json
          done
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" > /tmp/authority-candidates.json
          printf '[]\n' > /tmp/authority-pulls.json
          while read -r pr_number; do
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" > /tmp/authority-pull.json
            jq --slurpfile pull /tmp/authority-pull.json '. + [$pull[0]]' \
              /tmp/authority-pulls.json > /tmp/next && mv /tmp/next /tmp/authority-pulls.json
          done < <(jq -r '.[] | select(.merge_commit_sha == env.GITHUB_SHA) | .number' /tmp/authority-candidates.json)
          python3 scripts/release.py verify-authority \
            --event /tmp/authority-event.json --users /tmp/authority-users.json \
            --permissions /tmp/authority-permissions.json --pulls /tmp/authority-pulls.json \
            --repository "$GITHUB_REPOSITORY" --source "$GITHUB_SHA"

          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            > /tmp/authority-checks.json
          python3 scripts/release.py verify-checks --state /tmp/authority-checks.json \
            --source "$GITHUB_SHA"
          python3 scripts/release.py verify-publication --source "$GITHUB_SHA" \
            --main-source "$main_sha" --tag "$REQUESTED_TAG" --drafts-visible
          plan_tag=$(printf '%s' "$PLAN_JSON" | jq -r .announcement_tag)
          test "$plan_tag" = "$REQUESTED_TAG"
          python3 scripts/release.py release-notes --ref "$GITHUB_SHA" \
            --source "$GITHUB_SHA" --tag "$REQUESTED_TAG" --output /tmp/release-notes.md

          set +e
          gh api "repos/${GITHUB_REPOSITORY}/commits/tags/${REQUESTED_TAG}" --jq .sha \
            > /tmp/release-tag-target 2>/tmp/tag.error
          tag_rc=$?
          set -e
          if [ "$tag_rc" -eq 0 ]; then
            tag_target=$(cat /tmp/release-tag-target)
          elif grep -q 'HTTP 404' /tmp/tag.error; then
            tag_target=""
          else
            cat /tmp/tag.error >&2
            exit "$tag_rc"
          fi
          set +e
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${REQUESTED_TAG}" > /tmp/release.json 2>/tmp/release.error
          release_rc=$?
          set -e
          if [ "$release_rc" -eq 0 ]; then
            jq '{draft,tag_name,name,body,target_commitish,assets:[.assets[]|{name,size,state,digest}]}' \
              /tmp/release.json > /tmp/release-one.json
          elif grep -q 'HTTP 404' /tmp/release.error; then
            printf 'null\n' > /tmp/release-one.json
          else
            cat /tmp/release.error >&2
            exit "$release_rc"
          fi
          jq -n --arg tag_target "$tag_target" --slurpfile release /tmp/release-one.json \
            '{tag_target:(if $tag_target == "" then null else $tag_target end),release:$release[0]}' \
            > /tmp/publication-state.json
          disposition=$(python3 scripts/release.py verify-host-state \
            --state /tmp/publication-state.json --source "$GITHUB_SHA" \
            --tag "$REQUESTED_TAG" --notes /tmp/release-notes.md)
          printf '%s\n' "$disposition"
          if [ "$(printf '%s' "$disposition" | jq -r .status)" != resume-draft ]; then
            gh release create "$REQUESTED_TAG" --draft --target "$GITHUB_SHA" \
              --title "$REQUESTED_TAG" --notes-file /tmp/release-notes.md
          fi
