# git-cliff configuration for codeflow.
#
# Generates CHANGELOG.md AND computes the next SemVer (`git cliff
# --bumped-version`) from the conventional commits the commit-msg gate already
# enforces. Publish-agnostic: it reads git history only — no `cargo package`, no
# crates.io — so it fits codeflow's binary-only (cargo-dist) distribution, unlike
# release-plz. See docs/releasing.md and ADR-0012.

[changelog]
header = """
# Changelog

All notable changes to this project are documented here. The format is based on
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and this project
adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """

{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}\
- {{ commit.message | split(pat="\n") | first | upper_first | trim }}
{% endfor %}\
{% endfor %}
"""
trim = true
footer = "<!-- generated by git-cliff -->"

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = true
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"
# First match wins. feat -> Added, fix -> Fixed, etc.; merge commits are
# non-conventional and dropped by filter_unconventional; chore/ci/test/build are
# skipped from rendered notes. git-cliff 2.13.1 retains a patch floor for a
# policy-none history, so candidate preparation requires both curated Unreleased
# notes and a release-impacting marker before invoking the sole calculator.
commit_parsers = [
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Changed" },
  { message = "^refactor", group = "Changed" },
  { message = "^docs", group = "Documentation" },
  { message = "^revert", group = "Reverted" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(chore|ci|test|build|style)", skip = true },
]
