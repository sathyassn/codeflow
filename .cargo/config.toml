# Optional host-agnostic cross-target helpers. Install the pinned tools listed in
# docs/releasing.md first; native per-OS tests remain the release authority.
[alias]
cross-check-windows = "xwin clippy --workspace --all-targets --target x86_64-pc-windows-msvc -- -D warnings"
cross-build-windows = "xwin build --release -p codeflow-cli --target x86_64-pc-windows-msvc"
cross-check-linux = "zigbuild --workspace --all-targets --target x86_64-unknown-linux-gnu.2.17"
cross-build-linux = "zigbuild --release -p codeflow-cli --target x86_64-unknown-linux-gnu.2.17"

# Tests run the same in an agent session and in CI: the git hooks read these
# harness markers to tell an agent from a human (ADR-0074), and a test that
# commits through real hooks must not inherit the session that runs it. An
# empty marker counts as unset; a test that needs one sets it itself.
[env]
# Every fixture process, including Git descendants of CodeFlow, inherits these.
# Disabling the writer also protects file-level copies of fixture object stores.
GIT_CONFIG_COUNT = { value = "2", force = true }
GIT_CONFIG_KEY_0 = { value = "maintenance.auto", force = true }
GIT_CONFIG_VALUE_0 = { value = "false", force = true }
GIT_CONFIG_KEY_1 = { value = "gc.auto", force = true }
GIT_CONFIG_VALUE_1 = { value = "0", force = true }
# Legacy injected parameters must not override the settings above.
GIT_CONFIG_PARAMETERS = { value = "", force = true }
CLAUDECODE = { value = "", force = true }
CODEX_SESSION_ID = { value = "", force = true }
CODEX_THREAD_ID = { value = "", force = true }
CODEX_CI = { value = "", force = true }
GROK_SESSION_ID = { value = "", force = true }
# Tests run the same on a laptop and in any CI event: `codeflow ci` and the
# gate read these CI platform variables, so a pull request run would hand the
# real event (its body, base, head and actor) to every codeflow the tests
# start. Empty counts as unset; a test that needs one sets it itself. Only
# this repository's tests see this; an adopter's `codeflow test` still reads
# its CI.
CI = { value = "", force = true }
GITHUB_ACTIONS = { value = "", force = true }
GITHUB_EVENT_NAME = { value = "", force = true }
GITHUB_EVENT_PATH = { value = "", force = true }
GITHUB_ACTOR = { value = "", force = true }
GITHUB_BASE_REF = { value = "", force = true }
GITHUB_HEAD_REF = { value = "", force = true }
CI_PIPELINE_SOURCE = { value = "", force = true }
CI_MERGE_REQUEST_IID = { value = "", force = true }
CI_MERGE_REQUEST_DIFF_BASE_SHA = { value = "", force = true }
CI_MERGE_REQUEST_TARGET_BRANCH_NAME = { value = "", force = true }
CI_MERGE_REQUEST_SOURCE_BRANCH_NAME = { value = "", force = true }
CI_COMMIT_SHA = { value = "", force = true }
CI_COMMIT_REF_NAME = { value = "", force = true }
BITBUCKET_PR_ID = { value = "", force = true }
BITBUCKET_PR_DESTINATION_COMMIT = { value = "", force = true }
BITBUCKET_PR_DESTINATION_BRANCH = { value = "", force = true }
BITBUCKET_COMMIT = { value = "", force = true }
BITBUCKET_BRANCH = { value = "", force = true }
