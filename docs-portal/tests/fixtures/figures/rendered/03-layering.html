ession setup can be edited</td></tr><tr><td>CI</td><td>push, pull request</td><td><code>.codeflow/policy.json</code> through <code>codeflow ci</code></td><td>yes, unless the remote requires its result</td></tr><tr><td>Remote branch protection</td><td>pull request, merge</td><td>rules derived from <code>.codeflow/policy.json</code></td><td>no, it is the boundary at merge</td></tr></tbody></table></div></details></figure>
