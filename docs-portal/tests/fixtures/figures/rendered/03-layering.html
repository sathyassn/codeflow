<figure class="cf-fig" data-cf-figure="layering" data-cf-figure-id="enforcement-planes" data-cf-binding="authored" data-cf-states="layer layer-remote act" data-cf-elongation-max="1.5" data-cf-facts="[{&quot;claim&quot;:&quot;four planes: git hooks, session git-guard, CI, remote branch protection&quot;,&quot;value&quot;:true}]"><p class="cf-fig-title"><span class="cf-fig-number">Figure</span> · <span class="cf-fig-name">Four enforcement planes along the life of one change</span> <span class="cf-fig-kicker">Enforcement planes</span></p><svg class="cf-fig-svg cf-fig-svg--wide" viewBox="0 0 720 248" role="img" aria-labelledby="cf-fig-0-enforcement-planes-wide-t cf-fig-0-enforcement-planes-wide-d" data-cf-variant="wide"><title id="cf-fig-0-enforcement-planes-wide-t">Four enforcement planes along the life of one change</title><desc id="cf-fig-0-enforcement-planes-wide-d">A shared axis runs edit, commit, push, pull request, merge. Git hooks cover commit and push and can stop the change at both. The session git-guard covers every moment from edit to merge and can stop the change at commit, push, pull request and merge, because it also reads gh pr create and gh pr merge. CI covers push and pull request and can stop the change at the pull request, where its checks run and run again on every push to the open pull request. Remote branch protection covers push, pull request and merge, can stop the change at push and at merge, and is the only plane drawn with an end cap, meaning remote and required here. At push three planes can act; CI acts once the pull request is open. Key: Plane covers this moment, local and editable (layer); Plane covers this moment, remote and required (layer-remote); Plane acts here (act). Facts: four planes: git hooks, session git-guard, CI, remote branch protection.</desc><text class="cf-t cf-t--mute" x="240" y="22" text-anchor="middle">Edit</text><text class="cf-t cf-t--mute" x="340" y="22" text-anchor="middle">Commit</text><text class="cf-t cf-t--mute" ers this moment, local and editable"><svg class="cf-key" viewBox="0 0 28 16" aria-hidden="true"><rect class="cf-m-layer" x="2" y="3" width="24" height="10" rx="3"/></svg>Plane covers this moment, local and editable</li><li data-state="layer-remote" data-cf-entity="legend-layer-remote" data-cf-entity-label="Plane covers this moment, remote and required"><svg class="cf-key" viewBox="0 0 28 16" aria-hidden="true"><rect class="cf-m-layer--remote" x="2" y="3" width="24" height="10" rx="3"/><path class="cf-m-cap" d="M19 3H23Q26 3 26 6V10Q26 13 23 13H19Z"/></svg>Plane covers this moment, remote and required</li><li data-state="act" data-cf-entity="legend-act" data-cf-entity-label="Plane acts here"><svg class="cf-key" viewBox="0 0 28 16" aria-hidden="true"><circle class="cf-m-act" cx="14" cy="8" r="6.5"/></svg>Plane acts here</li></ul><figcaption class="cf-fig-caption">Hooks and the guard stop changes before push; CI blocks the pull request; verified remote protection stops push and merge.</figcaption><details class="cf-fig-details"><summary>Details</summary><p class="cf-fig-description">A shared axis runs edit, commit, push, pull request, merge. Git hooks cover commit and push and can stop the change at both. The session git-guard covers every moment from edit to merge and can stop the change at commit, push, pull request and merge, because it also reads gh pr create and gh pr merge. CI covers push and pull request and can stop the change at the pull request, where its checks run and run again on every push to the open pull request. Remote branch protection covers push, pull request and merge, can stop the change at push and at merge, and is the only plane drawn with an end cap, meaning remote and required here. At push three planes can act; CI acts once the pull request is open.</p><div class="cf-twin-scroll"><table><thead><tr><th scope="col">Plane</th><th scope="col">Moments</th><th scope="col">Shared source</th><th scope="col">Can be bypassed locally</th></tr></thead><tbody><tr><td>Git hooks</td><td>commit, push</td><td><code>.codeflow/policy.json</code></td><td>yes, hooks can be edited</td></tr><tr><td>Session git-guard</td><td>edit to merge</td><td><code>.codeflow/policy.json</code></td><td>yes, the session setup can be edited</td></tr><tr><td>CI</td><td>push, pull request</td><td><code>.codeflow/policy.json</code> through <code>codeflow ci</code></td><td>yes, unless the remote requires its result</td></tr><tr><td>Remote branch protection</td><td>push to merge</td><td>rules derived from <code>.codeflow/policy.json</code></td><td>no, when the remote requires it</td></tr></tbody></table></div></details></figure>
