# The journey gate (TSK-110 AC-1, SPC-013 R-104, R-107): every deterministic
# journey R-104 lists, mapped to the tests that run its passing control and
# its fault. `scripts/journey-gate.py` runs exactly these tests and fails when
# one does not run; `journey_gate.rs` checks this map against R-104 and the
# code. Each task that produces a behaviour ships its journey; this file only
# names them. A test is `<package> --test <target> <fn>`,
# `<package> --lib <module path>` or `python <script> <TestCase class>`.
#
# `pending` names the task that ships a journey not yet on this line; the map
# check refuses a pending entry once that task is complete. `platform = "unix"`
# marks a journey whose tests exist only on unix, so the Windows job skips it.

[[journey]]
text = "concurrent issue from two worktrees and from two clones"
control = [
  "codeflow-core --test id_registry concurrent_issuers_in_two_clones_and_two_worktrees_never_share_a_number",
  "codeflow-core --test id_registry property_issued_numbers_exceed_every_number_ever_added_and_never_repeat",
]
fault = ["codeflow-core --test id_registry a_tip_that_keeps_moving_stops_after_the_bounded_retries"]

