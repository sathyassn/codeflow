[package]
name = "codeflow-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Internal library, consumed only by codeflow-cli within this workspace — never
# published to a cargo registry. `publish = false` guards against an accidental
# `cargo publish` of an internal crate.
publish = false

[features]
# Structural source-to-test mapping validator (`testing::structural`). Parked:
# the schema still accepts legacy `structural` blocks, but setup does not emit
# them and the validator is not wired into the gate. Enable to compile/test it.
structural-check = []

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
serde_yaml.workspace = true
toml.workspace = true
glob.workspace = true
quick-xml.workspace = true
regex.workspace = true
git2.workspace = true
fs2.workspace = true
same-file.workspace = true
rusqlite.workspace = true
ulid.workspace = true
tokio.workspace = true
which.workspace = true
sha2.workspace = true
unicode-normalization.workspace = true
diffy.workspace = true
pulldown-cmark.workspace = true
uuid.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
