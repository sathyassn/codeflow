[package]
name = "codeflow-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Internal library, consumed only by codeflow-cli within this workspace — never
# published to a cargo registry. Marking it non-publishable makes release-plz
# treat codeflow-cli as the single public package, so it cuts one lockstep
# `v{version}` tag instead of a per-crate tag (see release-plz.toml, ADR-0010).
publish = false

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
toml.workspace = true
glob.workspace = true
quick-xml.workspace = true
regex.workspace = true
git2.workspace = true
fs2.workspace = true
rusqlite.workspace = true
ulid.workspace = true
tokio.workspace = true
which.workspace = true

[dev-dependencies]
tempfile.workspace = true
serial_test.workspace = true

[lints]
workspace = true
