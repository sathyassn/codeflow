[package]
name = "codeflow-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Internal library, consumed only by codeflow-cli within this workspace — never
# published to a cargo registry. `publish = false` guards against an accidental
# `cargo publish` of an internal crate.
publish = false

[features]
# Structural source-to-test mapping validator (`testing::structural`). Parked:
# the `structural` config block ships and stack detection populates it, but the
# validator is not yet wired into the gate. Enable to compile/test it.
structural-check = []

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
serde_yaml.workspace = true
toml.workspace = true
glob.workspace = true
quick-xml.workspace = true
regex.workspace = true
git2.workspace = true
fs2.workspace = true
rusqlite.workspace = true
ulid.workspace = true
tokio.workspace = true
which.workspace = true
sha2.workspace = true
diffy.workspace = true

[dev-dependencies]
tempfile.workspace = true
serial_test.workspace = true

[lints]
workspace = true
