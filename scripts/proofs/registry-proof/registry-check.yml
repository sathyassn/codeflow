# Registry check for the TSK-100 host proof (SPC-013 R-109).
# Lives on the code branch, never on codeflow/registry. The check code is
# read from the target branch, so a pull request cannot select it.
name: registry check

on:
  pull_request:
  push:
    branches: [main, "integration/**"]
  schedule:
    # Proof cadence so one scheduled run lands during the proof;
    # the product cadence is daily (R-109).
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Registry check (read only)
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REF_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git init -q work && cd work
          git remote add origin "https://github.com/${REPO}.git"
          # R-20: fetch the registry explicitly, full history, never forced.
          git fetch --no-tags -q origin \
            refs/heads/codeflow/registry:refs/remotes/origin/codeflow/registry
          if [ "$EVENT" = pull_request ]; then
            git fetch --no-tags -q origin \
              "refs/heads/${BASE_REF}:refs/remotes/origin/target" \
              "refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
            mode=(--pr-base origin/target --pr-head pr/head)
          else
            git fetch --no-tags -q origin \
              "refs/heads/${REF_NAME}:refs/remotes/origin/target"
            mode=(--target origin/target)
          fi
          echo "event: ${EVENT}; check code from $(git rev-parse --short origin/target):ci/ids.py"
          git show origin/target:ci/ids.py > "${RUNNER_TEMP}/ids.py"
          python3 "${RUNNER_TEMP}/ids.py" check \
            --registry origin/codeflow/registry "${mode[@]}"
