  # Measure beside the instrumented shards at the same workflow SHA.
  # This manual-only job supplies evidence, never a required verdict.
  linux-measurement:
    if: github.event_name == 'workflow_dispatch'
    name: measure uninstrumented Linux tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Record the measured revision and runner
        shell: bash
        run: |
          git rev-parse HEAD
          echo "runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          echo "run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Install the differential shells
        run: sudo apt-get update && sudo apt-get install -y bash zsh dash
      - name: Install Rust (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: linux-uninstrumented-v1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 26.4.0
          cache: npm
          cache-dependency-path: crates/codeflow-present/web/package-lock.json
      - name: Install exact npm for the owned presentation renderer
        run: npm install --global npm@11.17.0
      - name: Install nextest
        uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2
        with:
          tool: cargo-nextest@0.9.129
      - name: present-web-build
        shell: bash
        run: python3 -B scripts/with-node.py crates/codeflow-present/web/.node-version "npm ci --no-audit --ignore-scripts --prefix crates/codeflow-present/web && npm run build --prefix crates/codeflow-present/web"
      - name: Remove previous test evidence
        shell: bash
        run: |
          rm -rf target/nextest/codeflow
          mkdir -p target/nextest/codeflow
      - name: Run the full Linux suite without instrumentation
        run: cargo nextest run --workspace --no-fail-fast --profile codeflow
      - name: List the same build's tests
        if: ${{ !cancelled() }}
        shell: bash
        run: cargo nextest list --workspace --profile codeflow --message-format json > target/nextest/codeflow/tests.json
      - name: Check Rust journey evidence
        if: ${{ !cancelled() }}
        run: python3 -I scripts/journey-gate.py --part results --results target/nextest/codeflow/junit.xml
      - name: Check every test ran exactly once
        if: ${{ !cancelled() }}
        run: python3 -I scripts/linux-test-results.py --list target/nextest/codeflow/tests.json --results target/nextest/codeflow/junit.xml
      - name: Keep the uninstrumented results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-measurement-results
          path: |
            target/nextest/codeflow/junit.xml
            target/nextest/codeflow/tests.json
          if-no-files-found: error
          retention-days: 7
